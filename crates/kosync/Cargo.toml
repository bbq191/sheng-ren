[package]
name = "kosync"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KOReader 阅读进度同步服务器（kosync 协议），自托管用：只监听本机端口，前面放 nginx"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
md-5 = "0.11.0"

[[bin]]
name = "kosync"
path = "src/main.rs"
