[package]
name = "azw3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EPUB → AZW3（KF8）写出器，clean-room：依公开的 MOBI 容器文档 + 对 KF8 样本文件的黑盒分析实现"

[dependencies]
bookconv = { path = "../bookconv" }
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[[bin]]
name = "epub-to-azw3"
path = "src/bin/epub_to_azw3.rs"
