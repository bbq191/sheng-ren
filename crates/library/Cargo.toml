[package]
name = "library"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "母版库：入库（文件/网址）→ 与设备无关的母版 → 按设备 profile 生成产物"

[dependencies]
bookconv = { path = "../bookconv" }
azw3 = { path = "../azw3" }
profile = { path = "../profile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.11.0"
reflink-copy = "0.1.30"

[dev-dependencies]
reflink-copy = "0.1.30"
serde_json = "1"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "booklib"
path = "src/bin/booklib.rs"
