[package]
name = "bookconv"
version.workspace = true
edition = "2021"
description = "电子书内容层：CBZ/网页 → EPUB、按阅读模式优化 EPUB（清洗、排版、分页、漫画图片）、质量门"
license = "MIT"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
# 文字编码：网页的 GBK 等非 UTF-8 页面（quick-xml "encoding" 已间接引入同一版本）
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 图片降采样/抖动：只启 jpeg+png 控体积
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fast_image_resize = "6.1.0"
# XML 事件解析（质量门、网页正文、EPUB 组装）
quick-xml = { version = "0.30", features = ["encoding"] }
# 网文获取（readlater 下沉，2026-09-05）：Readability 可读性抽取 + scraper 白名单重序列化成合法 XHTML
readability-rust = "0.1.0"
scraper = "0.18"
ego-tree = "0.6"
profile = { path = "../profile" }

[dev-dependencies]
tempfile = "3"

# 按设备优化一本 EPUB（书库生成用的同一套优化器）。
[[bin]]
name = "epub-optimize"
path = "src/bin/epub_optimize.rs"

[[bin]]
name = "ebook-meta"
path = "src/bin/ebook_meta.rs"

# 给已有 EPUB 无损补封面声明（只改 OPF，其余条目原样拷）。
[[bin]]
name = "cover-fix"
path = "src/bin/cover_fix.rs"

# 测量书：生成（readable-probe）与截图分析（readable-measure），量设备真实可阅读范围，见 `probe.rs`。
[[bin]]
name = "readable-probe"
path = "src/bin/readable_probe.rs"

[[bin]]
name = "readable-measure"
path = "src/bin/readable_measure.rs"
