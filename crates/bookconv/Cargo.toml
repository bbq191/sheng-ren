[package]
name = "bookconv"
version.workspace = true
edition = "2021"
description = "电子书内容层：CBZ/网页 → EPUB、按阅读模式优化 EPUB（清洗、排版、分页、漫画图片）、质量门"
license = "MIT"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
# 文字编码：网页的 GBK 等非 UTF-8 页面（quick-xml "encoding" 已间接引入同一版本）
encoding_rs = "0.8"
# 只要 flate2 的 deflate（zip 的 "deflate" 特性还会带上用不到的 zopfli；缺省压缩级别本来就走 flate2，产物逐字节不变）
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# 图片缩放与重编码：jpeg、png；gif、webp 只解码（漫画里的 GIF/WebP 页转 PNG/JPEG），都是纯 Rust 实现
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
fast_image_resize = "6.1.0"
# XML 事件解析（质量门、网页正文、EPUB 组装）
quick-xml = { version = "0.30", features = ["encoding"] }
# 网文获取（readlater 下沉，2026-09-05）：Readability 可读性抽取 + scraper 白名单重序列化成合法 XHTML
readability-rust = "0.1.0"
# deterministic：属性按原文顺序遍历（缺省是 HashMap，同一页每次输出的属性顺序可能不同）
scraper = { version = "0.18", features = ["deterministic"] }
ego-tree = "0.6"
profile = { path = "../profile" }

[dev-dependencies]
tempfile = "3"

# 按设备优化一本 EPUB（书库生成用的同一套优化器）。
[[bin]]
name = "epub-optimize"
path = "src/bin/epub_optimize.rs"

[[bin]]
name = "ebook-meta"
path = "src/bin/ebook_meta.rs"

# 测量书：生成（readable-probe）与截图分析（readable-measure），量设备真实可阅读范围，见 `probe.rs`。
[[bin]]
name = "readable-probe"
path = "src/bin/readable_probe.rs"

[[bin]]
name = "readable-measure"
path = "src/bin/readable_measure.rs"
