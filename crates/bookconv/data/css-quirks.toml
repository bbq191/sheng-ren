[[rule]]
prop = ["margin-left", "margin-right"]
value = ["em", "rem", "pct", "zero"]
ireader = "same"
note = "掌阅左右外边距 em、% 照 CSS"
src = "2026-10-13 测试-怪癖-掌阅 Q09、Q11、Q33、Q54"


[[rule]]
