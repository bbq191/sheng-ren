note = "行内元素的 position:relative 的 top/bottom、vertical-align 写的长度：Kindle 写成基线偏移、真机抬高（Send to Kindle、写出器 22），掌阅不认；没有别的写法，测试书里也没用到"
src = "2026-10-14 测试-怪癖 Q122、Q123（掌阅）、测试-怪癖-Kindle 真机截图"

[[rule]]
prop = ["justify-content", "align-items", "flex-direction", "position", "top", "bottom", "left", "right"]
ireader = "same"
note = "flex 布局、块的定位掌阅不认（照普通块排、text-align 照认），Kindle 写出器也不写"
src = "2026-10-14 测试-怪癖 Q115、Q116（掌阅）"

# ---------------------------------------------------------------- 文字：颜色、背景、字体、装饰、空白、断字

[[rule]]
prop = ["color"]
ireader = "fixed"
note = "掌阅不认 rgba()，换成不透明色（KINDLE_RULES 8）；对比度照 Kindle 提到 4.5"
src = "2026-10-06 掌阅真机；kindle_rules"

[[rule]]
prop = ["background*"]
ireader = "fixed"
note = "背景图、背景色照 Kindle 改写（KINDLE_RULES 8、10、12、13）"
src = "2026-10-12 测试-背景图、测试-掌阅背景"

[[rule]]
prop = ["font-family"]
ireader = "accept"
note = "正文字体用阅读器的字体（kindle_rules，正文字体不算验收）；别的字体两台按各自装的字体"
src = "2026-10-08 定"

[[rule]]
prop = ["font-weight", "font-style"]
ireader = "same"
note = "粗体、斜体真书里看过（没逐项测）"
src = "2026-10-09 三台真机看书"

[[rule]]
prop = ["letter-spacing"]
ireader = "accept"
note = "掌阅不认字距（Kindle 写出器照写字距，没真机核）：没有别的写法，补字距只能往书里加字，不处理"
src = "2026-10-13 测试-怪癖 Q19、测试-怪癖-掌阅 Q19"

[[rule]]
prop = ["text-decoration"]
ireader = "same"
note = "下划线掌阅画（掌阅带 !important 的不画，见上）"
src = "2026-10-13 测试-怪癖 Q85、Q87"

[[rule]]
prop = ["white-space"]
on = ["inline"]
value = ["keyword"]
ireader = "same"
note = "行内元素的 nowrap（《梁羽生》诗句每半句一个 span）：掌阅、Kindle 都照样在 span 中间断行（Kindle 看的是我们写出器的版本，没写行内的 nowrap；Amazon 版在整段写了 $45，没真机看）。真书诗句一行 12 字，两台都放得下"
src = "2026-10-14 测试-怪癖-武侠（Kindle）、测试-怪癖 Q132（掌阅）"

[[rule]]
prop = ["hyphens", "-webkit-hyphens", "-epub-hyphens", "adobe-hyphenate"]
ireader = "accept"
note = "掌阅、Kindle 都不认自动断字（不插软连字符）"
src = "2026-10-01 英文排版真机"

[[rule]]
prop = ["text-justify", "word-break"]
ireader = "accept"
note = "inter-ideograph、break-all：中文本来就按字两端对齐、任意处断行，只影响夹在中文里的英文单词断不断（Kindle 上没核）"
src = "2026-10-14 测试书取值（text-justify 只有 inter-ideograph，word-break 只有 break-all）"

[[rule]]
prop = ["text-shadow", "box-shadow"]
value = ["zero", "keyword"]
ireader = "same"
note = "写 0、none 等于没写"
src = "2026-10-14 测试书取值"

# ---------------------------------------------------------------- 不影响排版的

[[rule]]
prop = ["-webkit-*", "-epub-*", "-moz-*", "-ms-*", "-o-*", "adobe-*", "duokan-*", "qrfullpage", "orphans", "widows", "word-wrap", "overflow-wrap"]
ireader = "accept"
note = "阅读器私有属性（多看的 duokan-*、QQ 阅读的 qrfullpage 掌阅、Kindle 都不认）、分页孤行控制：不影响排出来的位置"
src = "约定"

[[rule]]
prop = ["cursor", "src", "font-variant", "overflow", "object-fit", "clear"]
ireader = "accept"
note = "不影响排版：鼠标指针；src 是 @font-face 的、写在普通规则里无效；font-variant 测试书只有 normal；overflow:hidden、object-fit:contain 不裁内容；clear 只在有浮动时起作用"
src = "2026-10-14 测试书取值"
