# 怪癖表：一种 CSS 写法在掌阅、Move 上排出来和 Kindle 比怎么样（以 Kindle 为准，Kindle 由 KFX 写出器照 Send to Kindle 写）。
# 体检（`bookconv::audit`，sync 时给每本新生成的书报）按它查书里用到的写法；怪癖测试书 tools/quirks/probe.py 量出来的结论写回这里。
# 只收验证过的（真机、测试书）；没有的就是"没验证过"，体检照报。
#
# 每条 [[rule]]：
#   prop   属性（简写展开以后的分项名，边框的分项按边算 "border-top" 等、圆角算 "border-radius"；末尾 * 通配，如 "margin-*"）
#   on     元素：p、heading（h1–h6）、cell（td、th）、list（li）、block（别的块：div、blockquote……）、inline（span、a、b……）、img；不写＝都算
#   value  值：em（em、ex）、rem、px、pt（pt 和别的绝对单位）、pct（%）、number（不带单位）、zero（0）、neg（负数）、keyword（别的）；不写＝都算
#   via    写法：sheet（外链样式表）、style（文档里的 <style>）、inline（style 属性）、important（带 !important，不论在哪）；不写＝都算
#   ireader / xochitl  这台上的表现：
#          same＝和 Kindle 一样；fixed＝不一样，kindle_rules 改写了；accept＝不一样或不管，但不影响验收（note 说为什么）；
#          broken＝不一样、没处理（体检报出来）；不写＝没验证过（体检报"没验证过"）
#   note   说明；src 出处
# 一条写法按文件顺序找第一条对得上、而且这台有结论的（所以具体的写在前面；只写一台的条目不挡另一台）。
# 掌阅的结论 2026-10-13 起由 `probe.py ireader`（adb 逐页截屏，探针同 Move）量。

# ---------------------------------------------------------------- 掌阅专有（2026-10-13 探针，probe.py ireader）

[[rule]]
prop = ["*"]
value = ["rem"]
ireader = "fixed"
note = "掌阅不认 rem：整条声明当没写（margin-left:2rem 不挪）；字号以外的改成 em、字号的折成 px（KINDLE_RULES 25，《克莱因壶》首行缩进真机）"
src = "2026-10-13 测试-怪癖-掌阅 Q53"

[[rule]]
prop = ["*"]
via = ["important"]
ireader = "fixed"
note = "掌阅带 !important 的声明不起作用（只有这一条规则、没有冲突的也不起作用）：去掉，靠它胜出的值写进行内 style（KINDLE_RULES 25，《克莱因壶》引文署名靠右真机）"
src = "2026-10-13 测试-怪癖-掌阅 Q28；2026-10-12 测试-插图"

[[rule]]
prop = ["letter-spacing"]
ireader = "accept"
xochitl = "same"
note = "掌阅不认字距（Move 认；Kindle 写出器照写字距，没真机核）：没有别的写法，补字距只能往书里加字，不处理"
src = "2026-10-13 测试-怪癖 Q19、测试-怪癖-掌阅 Q19"

[[rule]]
prop = ["font-size"]
on = ["p", "block", "inline"]
value = ["px"]
ireader = "same"
xochitl = "fixed"
note = "字号的 px：掌阅按 CSS 像素（16px＝1em，24px 同 1.5em），同 Kindle 写出器（px 按 0.75pt）；Move 按屏幕像素（24px 比正文小），root_em 换成按根的 em（KINDLE_RULES 32）"
src = "2026-10-13 测试-怪癖 Q21、测试-怪癖-掌阅 Q21"

[[rule]]
prop = ["font-size"]
on = ["p", "block", "inline"]
value = ["pt"]
ireader = "fixed"
note = "掌阅字号的 pt 当 px（18pt 只有 1.125em，Kindle 1.5em）：字号归一时折成 px（KINDLE_RULES 5；html 上写了字号的书不归一，没处理）"
src = "2026-10-13 测试-怪癖-掌阅 Q23"

[[rule]]
prop = ["padding-left", "padding-right", "text-indent"]
on = ["p", "block", "heading"]
value = ["px"]
ireader = "fixed"
note = "掌阅的 px 是屏幕像素（text-indent:30px 挪 30）；Kindle 写出器内边距按 0.45pt、首行缩进按 0.75pt：块上的折成 em（KINDLE_RULES 25）"
src = "2026-10-13 测试-怪癖-掌阅 Q16、Q60"

[[rule]]
prop = ["line-height"]
ireader = "fixed"
note = "掌阅不认不带单位的行距（line-height:2 在 p、div、标题、行内 style 上都不认；写成 3em 这种长度认），Kindle 按正文行距归一：照 Kindle 写成 em（KINDLE_RULES 25，《飘》正文行距真机）"
src = "2026-10-13 测试-怪癖-掌阅 Q80–Q84"

[[rule]]
prop = ["text-decoration"]
ireader = "same"
xochitl = "same"
note = "下划线两台都画（掌阅带 !important 的不画，见上）"
src = "2026-10-13 测试-怪癖 Q85、Q87"

[[rule]]
prop = ["margin-*"]
value = ["neg"]
ireader = "same"
note = "掌阅认负外边距（伸到屏幕边为止）"
src = "2026-10-13 测试-怪癖-掌阅 Q08、Q75–Q79"

[[rule]]
prop = ["padding-left", "padding-right", "text-indent", "border-top", "border-bottom", "width"]
on = ["p", "block", "heading"]
ireader = "same"
note = "掌阅照 CSS：左右内边距、首行缩进（em、%、负的）、上下边框、块宽"
