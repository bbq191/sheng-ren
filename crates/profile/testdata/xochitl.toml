# 测试用（不是内置模式）：reMarkable Paper Pro Move 自带阅读器 xochitl 的怪癖。Move 2026-10-29 卖了、内置的 xochitl 模式 2026-10-31 删了，
# 只修复规则里那些只有它开的改写（box_fix、inline_css、root_em、heading_div、top_spacer……）还留着，单测用这份照常测；
# 数字都是当时在 Move 上真机量的。只在打开 profile 的 fixtures 特性时编进去（bookconv 的 dev-dependencies），用 profile::fixture("xochitl") 取。
# reMarkable Paper Pro Move 上的原生阅读器 xochitl。7.3" Gallery 3，2026-09-27 核实。
name = "xochitl（reMarkable Paper Pro Move 原生阅读器）"
color = true
formats = ["epub"]
# 注释：点标号跳到章末、用阅读器的"返回"回来（xochitl 没有弹窗，只认同文件 #锚点）
notes = "jump"
# 只有小图标的注释标号换成上标数字：xochitl 里只有图的链接点了没反应，外链 CSS 的 height:1em 也限不住图标
# （2026-09-29 Move 真机注释探针：80/32/24/16 像素、带不带 <sup> 都一样；80×80 的图标撑成一大块）
note_icons = "number"
# 去掉注释里跳回正文的回链：xochitl 遇到"标号→注释、注释→标号"互相链接的一对会整对丢掉（正向也点不动，真机 8 条脚注实测），
# 返回用 xochitl 自己的"返回第 X 页"。Kindle、掌阅保留原书的回链（Kindle 自带阅读器的返回不可靠，2026-09-30 真机）。
note_backlinks = false
# 漫画：维护者要离屏幕边缘 1px（2026-09-29）。xochitl 设置里的页边距界面上只有 28/56/112 三档，但阅读器内部接口能设成 1，
# Move 上装的页边距代理在第一次开书时替我们设（xochitl/comic-margins.sh 登记）。设成 1 后 xochitl 自己就在左右各留 1px，
# 所以画布里不再留白边（comic_margin = 0）。上 112px、下 127px 是 xochitl 固定留的，改不了。
comic_margin = 0
# 文字书只修复，另保证注释能点（2026-10-08 定：不动书里任何文字、图片、格式、样式；xochitl 只保障注释可跳）：
# 注释搬进引用它的那一章、链接改同文件锚点（xochitl 只认同文件 #锚点），去掉回链（上面 note_backlinks），只有图标的标号换数字（上面 note_icons）。
# 别的排版（缩进、字号解锁、外链 eink-wash.css 等）都不做了。漫画照旧。
text_repair_only = true
repair_note_links = true
# 不认 WebP（2026-10-19 测试书「测试-WebP」：各种写法一律空白，PNG 正常）：文字书里的 WebP 无损转成 PNG，动图取第一帧（维护者定，同掌阅）
webp = false
# 照 Send to Kindle 的规则统一（2026-10-08 定三台一套规则，同 ireader；Move 上还没真机看）。
kindle_rules = true
# 中间调加深（伽马，黑白两端不动；2026-10-16 在 Move、掌阅上比过原样 / 1.2 / 1.3 / 1.45）：漫画当时选 1.45，2026-10-21 先改成 1.3，同日在掌阅上比过 1.1 / 1.2 / 1.3（《浪客行》卷07 截屏）选 1.1（只加深灰度内容的页，彩页原样：第一轮彩页提对比度、饱和度都看不出区别），
# 文字书插图当时选 1.3，2026-10-21 改成 1.1、同漫画（只动正文里内容是灰度的插图；「只修复、图片不动」的例外，已定）。Kindle 2026-10-26 也开了，同 1.1（10-27 Kindle 真机比过原样 / 1.1）
comic_gamma = 1.1
image_gamma = 1.1
# 不认背景图的 no-repeat（也不管 background-size、background-position），一律平铺：只修复的文字书里写了不平铺的背景图去掉
# （2026-10-12 定，Move 测试书真机：大图偏到一边被裁、小图铺满一页）
background_no_repeat = false
# 不认 margin-top（padding-top 也不认），页首的空元素不占地方：每章开头写了上边距的垫一张透明空白图，推到 Kindle 上同样的位置
# （2026-10-12 测试书「测试-标题位置」；《飘》「第一卷」margin-top:47% 在 Move 上顶在页首）
margin_top = false
# 不认 display:none（行内、外链都不认，2026-10-12 测试书「测试-隐藏」）：去掉隐藏的元素（《飘》《春雪》版权页的「版权信息」大标题；已定）
display_none = false
# 只有 <p> 不认 line-height，标题、div、li、blockquote、td 按阅读器缺省行距的倍数认（行内 style 也认；2026-10-13 测试书「测试-行距」）：
# 这些块的行距照 Kindle 按全书正文行距归一（《三体》body line-height:1.618，标题两行隔 179px，Kindle 上约 123）
line_height_except_p = true
# 行距少出来的空白全从行的下面扣：倍数低于 1 时字伸出行盒、压到下面的横线图和下一段（2026-10-15 探针 Q143：h1 写 0.744 横线压字，
# 写 1 和不写一样；《人生海海》版权页、目录标题写 0.85 还压着字下沿）：插了下边框横线图的块行距不低于 1（别的块照 Kindle 压，
# 行与行之间不叠；全书都压了一律不压，《古龙》正文 Move 从 100% 掉到 96.4%）
line_height_floor = 1.0
# em 一律按根字号（阅读器字号）算：字号（% 也是）、外边距、首行缩进都不按父元素、自己的字号（2026-10-14 探针「测试-div探针」4–6）：
# 照 Kindle 换算成按根的值
em_root = true
# 标题（h1–h6）的 font-size 只认关键字（small/medium/large/x-large/xx-large，绝对大小），em、px、pt、% 都不认、固定按标签排
# （2026-10-13 测试书「测试-标题字号」）：标题字号照 Kindle 写成最接近的关键字（《平凡的世界》章名 2em 的 h2 在 Move 上只有 1.5em）
heading_font_keywords = true
# 块末尾的 <br/> 多排一行（Kindle、掌阅不排；2026-10-13 测试书「测试-末尾br」：段落多 50px、1.5em 标题多 75px）：去掉
trailing_br_line = true
# 行内 style、<style>、规则最后一条不带分号又紧挨 } 的声明走另一套解析：em 按 23px（外链 37.8px），字号、首行缩进的 em、% 不认
# （2026-10-13 怪癖测试书；《狼厅》每章 <style> 里的 text-indent:2em 没有首行缩进）：<style> 挪进外链、行内 em 搬进类规则、补分号
inline_css_lengths = false
# 内边距一概不认（背景色照画）、边框一概不画、h1–h6 的上下外边距不认（前后自带一段空，和相邻块的外边距折叠）（2026-10-13 怪癖测试书）：
# 左右内边距并进外边距，上下内边距、标题前后的间距照 Kindle 写到相邻的块上，上下边框插横线图（已定）
padding = false
borders = false
heading_margins = false
# 左右外边距：px 是屏幕像素（Kindle 按 0.45pt 一 px）、% 当成 px（10% 挪 10px）（2026-10-13 怪癖测试书 Q10、Q11、Q48、Q54）：块上的折成 em
px_margins = false
percent_margins = false
# 块的 width 不认（Q30，一律满宽），左右外边距认：照 Kindle 折成左右外边距（KINDLE_RULES 28）
block_width = false
# 负的外边距不认（Q08、Q75–Q79）：页中间相邻两块之间的照 Kindle 写成非负的间距（KINDLE_RULES 28；左右的不管，已定）
negative_margins = false
# float 不认（2026-10-14 探针 Q133、Q134：标题照旧自己占一行），同 Kindle
float = false
# 单元格缺省顶端对齐（Kindle 居中），vertical-align:middle 认（2026-10-14 探针 Q105、Q106）：Kindle 上居中的单元格写进行内
cell_middle = false
# 单元格 CSS 写的宽度不认（类规则、行内都不认），width 属性认（2026-10-14 探针 Q127–Q129）：照 Kindle 的列宽百分比写成属性
cell_width = false
# 左右边距的 em 照 Kindle 按页宽换算（一行约 22 个 em，Kindle 按 32 个；2026-10-14 选，KINDLE_RULES 31）
horizontal_scale = true
comic_reader_margins = 1

# 只认百分比宽度：没写宽度、写 px/em、只写高的图一律拉满一行（2026-10-12 测试书）；kindle_rules 折成 Kindle 上的百分比
image_sizing = "percent"
# 缺省字号下 CSS 1em 的屏幕像素（2026-10-12 测试书「测试-竖直间距」Move量的）：竖直方向的边距照 Kindle 换算（Kindle 按行距排，
# 同样 1em 占页高多一半；已定）。阅读器里改了字号、Kindle 改了行距要重量
em_px = 37.8

# 标题的字号（正文 1em＝1；2026-10-13 测试书「测试-标题字号」1–4 量的）：认的关键字（xx-small、x-small、xxx-large、smaller、
# larger 不认，退回标签的），和没写（或写了不认的）时按标签固定的 h1–h6
[heading_sizes]
keywords = { small = 0.784, medium = 1.0, large = 1.216, x-large = 1.514, xx-large = 2.018 }
tags = [2.018, 1.514, 1.216, 1.0, 0.784, 1.0]

# 页首垫图（屏幕像素）：垫图后面 xochitl 自己加的空，标题每 em 字号 91、别的块 46（2026-10-12 测试书：h1 字号 1/1.35/2em 时
# 91/122/181，段落、div 46）；行内窄图的高要比想挪的多出 44px × 字号 em 字才开始挪（2026-10-13 测试书「测试-行内垫图」：2em 标题 88、段落 44）
[page_top]
gap_heading_per_em = 91.0
gap_other = 46.0
strut_base_per_em = 44.0

[screen]
width = 954
height = 1696

# 真实可阅读范围（像素，竖屏），xochitl 实测（2026-09-21 真机，上游 bookconv 白皮书 §20）：
# EPUB 图片框宽 = 页宽 − 2×页边距，默认页边距 56px → 954 − 112 = 842；
# 垂直可用高度固定 462.1pt（上 35.5pt、下 40.3pt，与页边距无关），1px = 303/954 pt → 462.1 × 954/303 ≈ 1455。
# 设备上改了页边距要同步改这里（28 档 → 898；1 → 952）。
[readable.epub]
width = 842
height = 1455

# 漫画设成页边距 1 后的可阅读范围（2026-09-29 Move 真机，读 xochitl 排出的 PDF 里图的摆放矩阵）：
# 图框左上角在 (1, 112)，宽最多 952、高最多 1457（高和页边距无关；默认 56 档下 842×1455 的图原样显示，但比它高的图也缩到 1457 高）。
[comic_readable]
width = 952
height = 1457
