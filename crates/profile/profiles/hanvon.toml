# 汉王 Clear 6 Turbo（自带阅读器）。6" E Ink Carta 1300，1448×1072，300 ppi，黑白，安卓 14（来源：知乎评测 zhuanlan.zhihu.com/p/1916870323984393879、Lukas Lab、太平洋电脑网参数页；IT之家 1024×758 为 Clear 6 非 Turbo）。
# 2026-11-06 上真机：阅读范围、封面比例、漫画版式、投递已核对；正文字号/行高、注释弹窗、伽马待测。
name = "汉王自带阅读器（Clear 6 Turbo）"
color = false                      # 来源：公开参数页，黑白屏
formats = ["epub"]                 # 约束：只出 EPUB
notes = "jump"                     # 推断：同 kobo（ireader 是 popup，汉王弹窗待真机测）
note_icons = "number"              # 推断：同另两台（最稳）
caption_fit = true                 # 推断：同另两台（待确认）
text_repair_only = true            # 维护者 2026-10-08 定的三台统一规则，沿用
kindle_rules = true                # 推断：照「以 Kindle 为准」统一（待确认，汉王怪癖要真机测）
comic_gamma = 1.1                  # 沿用 kobo 的取值（待真机比）
image_gamma = 1.1                  # 沿用 kobo 的取值（待真机比）
comic_autocontrast = true          # 沿用 kobo
comic_trim_specks = true           # 沿用 kobo
comic_page_numbers = true          # 沿用 kobo
comic_dark_bg = true               # 沿用 kobo
comic_margin = 1                   # 沿用 kobo
comic_split_spreads = true         # 2026-11-10 维护者定：竖屏只拆跨页、不旋转；没上真机
comic_meta_direction = true        # 2026-11-10 维护者定：Bangumi 判成日本漫画的按 rtl 生成；Kobo、汉王的 rtl 处理待真机确认
# 漫画版式：2026-11-06 真机比：流式整页与固定版式逐像素相同，保持流式。
background_images = true           # 推断：沿用（待确认）
# 书架缩略图：2026-11-06 书架框≈0.753，封面拉伸不裁；meta 指向缩略图同掌阅，待真机确认书架用的是缩略图
cover_thumb_aspect = 0.754
cover_meta_thumb = true
# 竖排（2026-11-11 测试书 01–13 实机通过，vinci 定）：中文文字书竖排，半角 ASCII 全部转全角竖立
vertical_text = true
vertical_ascii = "fullwidth"

[screen]                           # 来源：公开参数页 1448×1072（竖屏写成宽 1072、高 1448）
width = 1072
height = 1448

# 2026-11-06 真机测量书量：竖长黑块 362×1448、横宽黑块 1072×268，上下左右 0，整屏可阅读
[readable.epub]
width = 1072
height = 1448

# MTP（安卓设备）：jmtpfs 自动挂到 $XDG_RUNTIME_DIR/mtp/<mount>，产物放进存储根目录的 dir
[deliver]
kind = "mtp"
mount = "hanvon"                   # 2026-11-06 真机确认：~/Hanvon → /run/user/1000/mtp/hanvon（jmtpfs）
dir = "Documents"                  # 2026-11-11 现场：小写 documents 让 MTP 多登记出一个同内容的 documents，改成设备上的真名；旧记录由大小写迁移原样接过来
