# KOReader 阅读模式：掌阅 iReader Ocean 5 Pro、Kindle Paperwhite 12 代签名版上的 KOReader 共用这一份（两台都是
# 7" Carta 1300、1264×1680、300ppi，2026-09-27 核实）。Move 上的 KOReader 2026-09-29 起不单独出一份。
name = "KOReader（掌阅 Ocean 5 Pro、Kindle PW12 共用）"
ppi = 300
color = false
formats = ["epub"]
# 注释：点标号弹窗（KOReader 认 epub:type 的 noteref/footnote）
notes = "popup"
# 漫画页图到可阅读范围四边的白边（像素）：图保比缩放进"阅读范围 − 2×白边"的框、居中，受限的那条边两侧正好这么宽，
# 另一条边两侧更多（用户 2026-09-29 定：尽量贴边、留 1px）。不写缺省也是 1；须小于阅读范围短边的 1/4。
comic_margin = 1

# 漫画纯图页去掉行高和字号，整页图才能用满整屏（见 comic_fullpage 字段说明；2026-09-29 本机 KOReader 截图：不去时图最大 1260×1670，
# 行高在下面留 10px、字号在行首多出 2px；去掉后 1264×1680 原样显示，1px 白边离屏幕四边正好 1px）。
comic_fullpage = true

[screen]
width = 1264
height = 1680

# 真实可阅读范围（像素，竖屏）：2026-09-29 本机 KOReader v2026.07.1 按 1264×1680 离屏渲染、套我们的漫画方案（页边距 0、隐藏状态栏，
# 配 koreader/patches/2-footer-preset-reclaim.lua 收回状态栏的高度）截屏实测（koreader/snap.sh）：纯图页去掉行高和字号后整屏可用。
# 所以漫画的 1px 白边就是到屏幕边缘的 1px（用户 2026-09-29 定的意思）。掌阅、Kindle 真机上的 KOReader 还没实测。
[readable.epub]
width = 1264
height = 1680
