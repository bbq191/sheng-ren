# KOReader 阅读模式：掌阅 iReader Ocean 5 Pro、Kindle Paperwhite 12 代签名版上的 KOReader 共用这一份（两台都是
# 7" Carta 1300、1264×1680、300ppi，2026-09-27 核实）。Move 上的 KOReader 2026-09-29 起不单独出一份。
name = "KOReader（掌阅 Ocean 5 Pro、Kindle PW12 共用）"
ppi = 300
color = false
formats = ["epub"]
# 注释：点标号弹窗（KOReader 认 epub:type 的 noteref/footnote）
notes = "popup"
# 漫画页图到可阅读范围四边的白边（像素）：图保比缩放进"阅读范围 − 2×白边"的框、居中，受限的那条边两侧正好这么宽，
# 另一条边两侧更多（用户 2026-09-29 定：尽量贴边、留 1px）。不写缺省也是 1；须小于阅读范围短边的 1/4。
comic_margin = 1

[screen]
width = 1264
height = 1680

# 真实可阅读范围（像素，竖屏）：2026-09-29 用测量书（readable-probe，打上"漫画"标签）在本机 KOReader v2026.07.1 上按 1264×1680
# 离屏渲染、套我们的漫画方案（页边距 0、隐藏状态栏，配 koreader/patches/2-footer-preset-reclaim.lua 收回状态栏的高度）截屏实测
# （koreader/snap.sh + readable-measure）：左右各留 2px、底部留 10px，整页图最大 1260×1670。按这个排，KOReader 不再把整页图缩小一次。
# 掌阅、Kindle 真机上的 KOReader 还没实测（真机屏幕像素、状态栏字体不同，可能差几个像素）。
[readable.epub]
width = 1260
height = 1670
