# Kindle Paperwhite 12 代签名版（2024）上的自带阅读器。7" Carta 1300，2026-09-27 核实。
# USB 传书只认 AZW3，不认 EPUB（用户 2026-09-27 真机实测）：先按和别的模式同一套规则优化出 EPUB，再转成 AZW3（2026-09-30 用户撤了 KOReader、恢复这条线）。
name = "Kindle 自带阅读器（Paperwhite 12 代签名版）"
ppi = 300
color = false
formats = ["azw3"]
# 注释：点标号跳到章末（2026-09-27 前在这台 Kindle 上真机验证过跳转）
notes = "jump"
# 只有小图标的注释标号换成上标数字（2026-09-28 前的 AZW3 就是数字，真机能点；图标在 Kindle 上没验证过）
note_icons = "number"
comic_margin = 1

[screen]
width = 1264
height = 1680

# 真实可阅读范围（像素，竖屏），2026-09-27 用测量书（AZW3）在真机上截屏实测（readable-measure --format=azw3）：
# 左右各 84（页边距）、上下各 75（页眉时间、页脚位置/进度）。比页面窄的图片靠左放、不居中，漫画必须补白到这个比例。
# 截图分辨率是 1272×1696（设备实际显示缓冲区），不是标称的 1264×1680；阅读范围就是在截图像素上量的。
# 所以下面的阅读范围和上面 [screen] 不在同一个坐标系里（截图坐标 vs 标称屏幕），两者相比不严格成立；差不到 1%。
# 用的是测量时的页边距设置；在 Kindle 上改了页边距要重新量。漫画离屏幕边缘 1px 还没做到（左右 84、上下 75 是阅读器留的）。
[readable.azw3]
width = 1104
height = 1546
