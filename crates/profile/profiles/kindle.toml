# Kindle Paperwhite 12 代签名版（2024）上的自带阅读器。7" Carta 1300，2026-09-27 核实。
# USB 传书不认 EPUB（用户 2026-09-27 真机实测）：先按和别的模式同一套规则优化出 EPUB，再转成 KFX（文字书流式、漫画固定版式）。
name = "Kindle 自带阅读器（Paperwhite 12 代签名版）"
ppi = 300
color = false
# 2026-10-05 起出 KFX（clean-room 写出器，见 docs/kfx.md）：文字书注释弹窗、段间距字间距可调；漫画固定版式真机铺满整屏（《哆啦A夢》《死亡筆記》）。
# AZW3 写出器还在（epub-to-azw3），书库不再用。
formats = ["kfx"]
# 注释：点标号跳到章末（2026-09-27 前在这台 Kindle 上真机验证过跳转）
notes = "jump"
# 只有小图标的注释标号换成上标数字（2026-09-28 前的 AZW3 就是数字，真机能点；图标在 Kindle 上没验证过）
note_icons = "number"
comic_margin = 1
# 漫画写成固定版式、画布取屏幕实际分辨率（下面的 [comic_readable]）：流式版式下 Kindle 强制留页边距（最小档左右还有 101px），
# 固定版式每页按画布 1:1 铺满整屏（2026-09-30 真机截图逐像素对齐），加上 1px 白边就是离屏幕 1px。
comic_fixed_layout = true
# 保留 CSS 背景图（分卷页、书信的背景）：KFX 写出器照 Amazon 的写法写（docs/kfx.md#背景图2026-10-05绍宋样本）。ireader 也保留，xochitl 去掉（它把背景图平铺满页）。
background_images = true
# 背景图的尺寸、fixed 保留（缺省）：去掉后 Kindle 只把背景图铺在内容那一块（2026-10-05 真机）。

# 屏幕：设备实际的显示缓冲区（截图就是这个尺寸；标称分辨率 1264×1680）。阅读范围、漫画画布都在这个坐标系里量。
[screen]
width = 1272
height = 1696

# 真实可阅读范围（像素，竖屏），2026-09-27 用测量书（AZW3）在真机上截屏实测（readable-measure --device=kindle）：
# 左右各 84（页边距）、上下各 75（页眉时间、页脚位置/进度）。比页面窄的图片靠左放、不居中，漫画必须补白到这个比例。
# 用的是测量时的页边距设置；在 Kindle 上改了页边距要重新量。KFX 是同一个阅读器、同样的页边距设置，沿用这组实测（没单独量过）。
# 漫画不按它排：漫画写成固定版式、整页铺满（见 comic_fixed_layout）。
[readable.kfx]
width = 1104
height = 1546

# 漫画的画布：整屏（固定版式下整页铺满）。
[comic_readable]
width = 1272
height = 1696
