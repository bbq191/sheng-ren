# 掌阅 iReader Air 3 Pro 上的自带阅读器（2026-11-02 起；以前是 Ocean 5 Pro，2026-10-29 卖了）。默白版、黑白、无前光，安卓 14，
# 固件 4.1.0.214.0。下面的怪癖、em_px、line_px 2026-11-02 在 Air 3 Pro 上用 tools/quirks/probe.py ireader 重量过（151 个探针、302 页全认出），
# 结论除 rem 的细节外和 Ocean 5 Pro 一样；heading_center、background_auto_height 等单独测试书量的没重测，还是 Ocean 的结论。
# **量的前提是掌阅这样设**（维护者日常的设置，改了要重量）：设置里「图书排版」（自动调整本地书排版）关、「过滤书籍背景」关、
# 「本地图书指定字体」关；阅读排版里字号「中」、预设「通用」、排版「默认」。「图书排版」开着时块的外边距、首行缩进、行距一概不认
# （2026-11-02 开着跑过两遍，Q09、Q13、Q84 全无差别）。
name = "掌阅自带阅读器（iReader Air 3 Pro）"
color = false
formats = ["epub"]
# 背景尺寸的高写 auto 会把图拉长到整页高（2026-10-12 测试书「测试-掌阅背景」）：整页背景图照 Kindle 上的大小、位置写成屏幕像素
background_auto_height = false
# 注释：弹窗（2026-10-05 真机：掌阅自带阅读器认 epub:type="noteref" + <aside epub:type="footnote">，点标号弹出小窗，章末注释照常显示）
notes = "popup"
# 保留 CSS 背景图（分卷页、卷首语的背景），和 kindle 同一套（2026-10-05）。
background_images = true
# 背景图的尺寸、fixed 去掉：掌阅写了 background-size 会把图挤变形（2026-10-05 真机对照书）。
background_sizing = false
# 颜色的 rgba() 写法掌阅不认（连同那条声明作废：《绍宋》深红底色显示成白底），换成 #rrggbb；rgb()、#rrggbb 认（2026-10-06 真机测试书）。
css_rgba = false
# 只有小图标的注释标号换成上标数字（图标在掌阅自带阅读器里能不能点、会不会撑大还没验证，数字最稳）
note_icons = "number"
# 带图注的竖长图（多看图集里的人物图等）写宽度百分比，图和图注同页：掌阅不认多看图集，图撑满一页、图注掉到下一页；
# max-height、page-break-inside:avoid 都不认，宽度 60% 有效、70% 不够（2026-10-06 真机 adb 截屏）。
caption_fit = true
# 文字书只做修复（2026-10-08 定）：升级成合规的 EPUB 3、修不规范的写法、目录到节，书里的文字、图片、样式一概不动——
# 上面注释、背景图、rgba、图注、透明图这些文字书规则都不再生效（只留着给漫画和以后改回来）。漫画照旧。
text_repair_only = true
# 照 Send to Kindle 的规则统一（2026-10-08 定三台一套规则；规则表 docs/kfx.md#send-to-kindle-的样式规则）：标签缺省样式
# （掌阅给 <p> 的缺省外边距是 0，丢了样式表的《绝叫》段与段挤在一起，真机截屏）、正文字体用阅读器字体、body 左右边距不要、文字对比度 4.5。
kindle_rules = true
# 中间调加深（伽马，黑白两端不动；2026-10-16 在 Move、掌阅上比过原样 / 1.2 / 1.3 / 1.45）：漫画当时选 1.45，2026-10-21 先改成 1.3，同日在掌阅上比过 1.1 / 1.2 / 1.3（《浪客行》卷07 截屏）选 1.1（只加深灰度内容的页：黑白屏上全部页都转成灰度，都算），
# 文字书插图当时选 1.3，2026-10-21 改成 1.1、同漫画（只动正文里内容是灰度的插图；「只修复、图片不动」的例外，已定）。Kindle 2026-10-26 也开了，同 1.1（10-27 Kindle 真机比过原样 / 1.1）
comic_gamma = 1.1
image_gamma = 1.1
# 漫画页图到可阅读范围四边留 1px；阅读范围就是整屏，所以离屏幕边缘也是 1px（2026-09-29 要的意思）
comic_margin = 1
# 漫画照书的翻页方向（2026-10-15 定：「照书往右翻」；以前一律改成往左翻，2026-09-30）。掌阅遇到往右翻（page-progression-direction="rtl"，
# 日漫都这样写）的书，整页图四周按阅读器「排版」设置留边（默认约 70/66、自定义按间距），选「漫画」排版才铺满、和往左翻的书逐像素一样
# （2026-10-15 真机）。这个设置要维护者在掌阅里对每本往右翻的漫画选一次：本书自定义 → 排版 → 漫画（我们够不到掌阅的设置）。

# 图片尺寸的 px 是屏幕像素（300px 的图占四分之一页宽，Kindle 把 px 换成 em 占三分之二）：kindle_rules 改写成 Kindle 的大小（2026-10-12 测试书）
image_sizing = "device-px"
# 缺省字号下 CSS 1em 的屏幕像素（Ocean 5 Pro 2026-10-12 量的 37.5；Air 3 Pro 2026-11-02 探针：margin-left 1em/2em/4em 挪 58/116/232（Q46、Q09、Q47），
# padding 2em 116（Q06、Q12），line-height:3em 一行 174（Q84））：竖直方向的边距照 Kindle 换算（Kindle 按行距排，
# 同样 1em 占页高 Ocean 5 Pro 上多一半、Air 3 Pro 上多 12%；已定）。阅读器里改了字号、Kindle 改了行距要重量
em_px = 58
# 正文页内容区宽（屏幕像素）：阅读范围是整屏 1440（整页图铺满），正文左右各留 70（2026-11-02 Air 3 Pro 测试书：100% 宽的图 1300px，x 70–1369）
content_px = 1300
# 左右边距的 em 照 Kindle 按页宽换算：一行 1300 ÷ 58 ≈ 22.4 个 em，Kindle 按 32 个折（写出器、Send to Kindle 的左右长度一律按页宽百分比），
# 同样的 em 宽出约 1.43 倍（2026-11-02 unify.py：《ABC》《罗杰疑案》81.9%、《帷幕》90.1%）。系数由 content_px、em_px 算（≈ 0.70），同 Move。
# Ocean 5 Pro 一行 1168 ÷ 37.4 ≈ 31.2 个，和 32 差不多，以前没开
horizontal_scale = true
# 左右外边距的 px 是屏幕像素（Kindle 写出器按 0.45pt 一 px，大约 1.46 倍）：块上的折成 em（2026-10-13，KINDLE_RULES 24）
px_margins = false
# rem 不按正文字号算（Ocean 5 Pro 2026-10-13 整条不认；Air 3 Pro 2026-11-02 Q53 margin-left:2rem 只挪 32，按 1rem＝16 屏幕像素）：
# 字号以外的改成 em，字号的折成 px（KINDLE_RULES 25）
rem = false
# 带 !important 的声明一概不起作用（Q28、Q85、Q86，《克莱因壶》标题不居中、《春雪》下划线没了）：去掉 !important，靠它胜出的值写进行内 style
important = false
# 不带单位的 line-height 不认（Q80–Q83；Air 3 Pro 2026-11-02 写了的行距一律 83，比缺省 99 还挤，Q137、Q138 0.6–1.2 也是 83），长度认（Q84 3em 一行 174px）：行距和 Kindle 不一样的块照 Kindle 写成 em
line_height_numbers = false
# 缺省字号、行距下正文一行的屏幕像素（Ocean 5 Pro 2026-10-13 量的 58；Air 3 Pro 2026-11-02 探针对照页一段里相邻两行上沿 383→482、
# Q138 不写行距那段同样隔 99，约 1.71em），上面的行距按它算阅读器的缺省行距
line_px = 99
# 单元格缺省顶端对齐（Kindle 居中），vertical-align:middle 认（2026-10-14 探针 Q105、Q106）：Kindle 上居中的单元格写进行内
cell_middle = false
# span 上 vertical-align:super/sub 不认、<sup>/<sub> 标签认（Q100、Q101、Q120–Q123）：写了上标下标的行内元素里面包 <sup>/<sub>
inline_valign = false
# 标题（h1–h6）自己没写 text-align 时居中（inherit 也不认，left 认；2026-10-14 探针「测试-标题对齐」，《人生海海》「第一章」Kindle 靠左、掌阅居中）：
# 照 Kindle 继承来的对齐写明
heading_center = true
# float 认（2026-10-14 探针 Q133：标题浮到右边、后一段排在旁边；Kindle 不浮动）：标题上的写成 none。写 true 是缺省，这里写明
float = true
# 书架缩略图（2026-11-03 Air 3 Pro 真机）：书架封面框 212×281（≈0.754，书架截屏量的），封面直接拉伸到框的比例、不裁不留白
# （封面比例探针 0.5 / 0.754 / 1.0：只有 0.754 的圆还是正圆，另两本成了椭圆、四边刻度全在）。普通文字书封面 0.67–0.72，都被横向拉宽 5–12%
cover_thumb_aspect = 0.754
# 书架取封面认 EPUB 2 的 <meta name="cover">：它和 properties="cover-image" 指向不同的图时书架用 meta 那张（同日「封面来源探针」）。
# 所以让 meta cover 指向缩略图，cover-image、书里的封面页照旧（10-30 定的「只裁书架缩略图」）
cover_meta_thumb = true

# Air 3 Pro：2026-11-02 `adb exec-out screencap` 截屏 1440×1920（`wm size` 同，320dpi）
[screen]
width = 1440
height = 1920

# 真实可阅读范围（像素，竖屏），2026-09-27 用测量书在真机上截屏实测（readable-measure）：
# 只放一张大图的页面，掌阅把图铺满整屏（连页眉页脚区域也盖住），上下左右留白都是 0，所以等于标称尺寸。
# 这是整页图（漫画）的情况；图文混排时图片受正文页边距限制，不适用这组数。
# Air 3 Pro 先照 Ocean 5 Pro 的结论取整屏 1440×1920（同一个自带阅读器），待真机用测量书核对。
[readable.epub]
width = 1440
height = 1920

# 产物直接传进掌阅（2026-10-07 定）：同 Kindle，放存储根目录的 documents/（没有就建）。Air 3 Pro 上自带的是 Documents/，
# 但外部存储不分大小写（`external_storage.casefold.enabled=1`，adb 里 documents、Documents 是同一个目录，2026-11-02）
[deliver]
kind = "mtp"
mount = "ireader"
dir = "documents"
