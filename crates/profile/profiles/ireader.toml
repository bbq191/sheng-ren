# 掌阅 iReader Ocean 5 Pro 上的自带阅读器。7" Carta 1300，2026-09-27 核实。阅读范围按自带阅读器量（2026-10-06 起两台都不装 KOReader，都用自带阅读器）。
name = "掌阅自带阅读器（iReader Ocean 5 Pro）"
color = false
formats = ["epub"]
# 注释：弹窗（2026-10-05 真机：掌阅自带阅读器认 epub:type="noteref" + <aside epub:type="footnote">，点标号弹出小窗，章末注释照常显示）
notes = "popup"
# 保留 CSS 背景图（分卷页、卷首语的背景），和 kindle 同一套（用户 2026-10-05）；xochitl 仍去掉（平铺满页盖住正文）。
background_images = true
# 背景图的尺寸、fixed 去掉：掌阅写了 background-size 会把图挤变形（2026-10-05 真机对照书）。
background_sizing = false
# 颜色的 rgba() 写法掌阅不认（连同那条声明作废：《绍宋》深红底色显示成白底），换成 #rrggbb；rgb()、#rrggbb 认（2026-10-06 真机测试书）。
css_rgba = false
# 只有小图标的注释标号换成上标数字（图标在掌阅自带阅读器里能不能点、会不会撑大还没验证，数字最稳）
note_icons = "number"
# 带图注的竖长图（多看图集里的人物图等）写宽度百分比，图和图注同页：掌阅不认多看图集，图撑满一页、图注掉到下一页；
# max-height、page-break-inside:avoid 都不认，宽度 60% 有效、70% 不够（2026-10-06 真机 adb 截屏）。
caption_fit = true
# 文字书只做修复（2026-10-08 用户定）：升级成合规的 EPUB 3、修不规范的写法、目录到节，书里的文字、图片、样式一概不动——
# 上面注释、背景图、rgba、图注、透明图这些文字书规则都不再生效（只留着给漫画和以后改回来）。漫画照旧。
text_repair_only = true
# 照 Send to Kindle 的规则统一（2026-10-08 用户定三台一套规则；规则表 docs/kfx.md#send-to-kindle-的样式规则）：标签缺省样式
# （掌阅给 <p> 的缺省外边距是 0，丢了样式表的《绝叫》段与段挤在一起，真机截屏）、正文字体用阅读器字体、body 左右边距不要、文字对比度 4.5。
kindle_rules = true
# 漫画页图到可阅读范围四边留 1px；阅读范围就是整屏，所以离屏幕边缘也是 1px（用户 2026-09-29 要的意思）
comic_margin = 1
# 漫画一律从左往右翻：掌阅遇到从右往左翻（page-progression-direction="rtl"，日漫都这样写）的书，整页图不铺满、四周留边
# （左右 92、上下 124，2026-09-30 真机：只差这一个属性的两本测试书，一本铺满、一本留边）。用户选了铺满（离屏幕 1px），
# 代价是日漫也往左翻。
comic_page_direction = "ltr"

[screen]
width = 1264
height = 1680

# 真实可阅读范围（像素，竖屏），2026-09-27 用测量书在真机上截屏实测（readable-measure）：
# 只放一张大图的页面，掌阅把图铺满整屏（连页眉页脚区域也盖住），上下左右留白都是 0，所以等于标称尺寸。
# 这是整页图（漫画）的情况；图文混排时图片受正文页边距限制，不适用这组数。
[readable.epub]
width = 1264
height = 1680

# 产物直接传进掌阅（2026-10-07 用户定）：同 Kindle，放存储根目录的 documents/（没有就建）。
[deliver]
kind = "mtp"
mount = "ireader"
dir = "documents"
