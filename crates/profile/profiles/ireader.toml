# 掌阅 iReader Ocean 5 Pro 上的自带阅读器。7" Carta 1300，2026-09-27 核实。阅读范围按自带阅读器量；2026-10-02 起两台的 KOReader 也读这份产物，KOReader 上没单独量过。
name = "掌阅自带阅读器（iReader Ocean 5 Pro）"
ppi = 300
color = false
formats = ["epub"]
# 注释：弹窗（2026-10-05 真机：掌阅自带阅读器认 epub:type="noteref" + <aside epub:type="footnote">，点标号弹出小窗，章末注释照常显示）
notes = "popup"
# 只有小图标的注释标号换成上标数字（图标在掌阅自带阅读器里能不能点、会不会撑大还没验证，数字最稳）
note_icons = "number"
# 漫画页图到可阅读范围四边留 1px；阅读范围就是整屏，所以离屏幕边缘也是 1px（用户 2026-09-29 要的意思）
comic_margin = 1
# 漫画一律从左往右翻：掌阅遇到从右往左翻（page-progression-direction="rtl"，日漫都这样写）的书，整页图不铺满、四周留边
# （左右 92、上下 124，2026-09-30 真机：只差这一个属性的两本测试书，一本铺满、一本留边）。用户选了铺满（离屏幕 1px），
# 代价是日漫也往左翻。
comic_page_direction = "ltr"

[screen]
width = 1264
height = 1680

# 真实可阅读范围（像素，竖屏），2026-09-27 用测量书在真机上截屏实测（readable-measure）：
# 只放一张大图的页面，掌阅把图铺满整屏（连页眉页脚区域也盖住），上下左右留白都是 0，所以等于标称尺寸。
# 这是整页图（漫画）的情况；图文混排时图片受正文页边距限制，不适用这组数。
[readable.epub]
width = 1264
height = 1680
