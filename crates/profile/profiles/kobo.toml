# Kobo Clara BW（N365，2024）自带阅读器（Nickel）。6" E Ink Carta 1300，1448×1072，300 ppi，黑白。
# 2026-11-01 查官网；2026-11-05 真机（fw 4.45）确认漫画固定版式方案 D、文字 KEPUB 正常、侧载书签/笔记可用。
name = "Kobo 自带阅读器（Clara BW）"
color = false                      # 来源：官网/factsheet，黑白屏（Clara Colour 才是彩色）
# 出 KEPUB（`.kepub.epub`，Nickel 用 Kobo WebKit 打开、翻页更快，维护者 2026-11-01 以前在 Kobo 上试过）：clean-room 写出器
# bookconv::kepub（docs/kepub.md）。漫画也是 .kepub.epub；固定版式看 OPF 声明、不靠 .fxl 文件名，A/B 结论见 docs/kepub.md（2026-11-05 真机）
formats = ["kepub"]
notes = "jump"                     # 推断：最稳；Nickel 对 EPUB 弹窗注释支持待真机测（待确认）
note_icons = "number"              # 推断：同另两台
caption_fit = true                 # 推断：同另两台（待确认）
text_repair_only = true            # 维护者 2026-10-08 定的三台统一规则，沿用
kindle_rules = true                # 推断：照「以 Kindle 为准」统一（待确认，Nickel 的 CSS 怪癖要测试书量）
comic_gamma = 1.1                  # 沿用另两台的选择（待真机比）
image_gamma = 1.1
comic_autocontrast = true          # 沿用
comic_trim_specks = true
comic_page_numbers = true
comic_dark_bg = true
comic_margin = 1
comic_meta_direction = true        # 2026-11-10 维护者定：Bangumi 判成日本漫画的按 rtl 生成；Kobo、汉王的 rtl 处理待真机确认
comic_fixed_layout = true          # 2026-11-05 Clara BW 真机确认（方案 D）：A（像素画布 + 纯图页包 koboSpan 等）不满屏，D 满屏
comic_fixed_layout_percent = true  # 同上（方案 D）：比例合画布的 img 100%×100%，否则 max-width/max-height；html/body 和 KEPUB 包装高度链 100%
# comic_page_direction 不写：照原书 rtl（Nickel 对 EPUB/KEPUB rtl 的处理待确认）
background_images = true
# cover_thumb_aspect：Kobo 书架封面框比例未知（待真机截图量）
# font_px / line_px / em_px：待测试书量

[screen]                           # 来源：官网 1448×1072（竖屏写成宽 1072、高 1448）
width = 1072
height = 1448

# [readable.epub] 待 readable-measure 真机实测；不写就按整屏
[comic_readable]                   # 2026-11-05 Clara BW 真机确认（方案 D）：固定版式画布 1072×1448，viewport 同尺寸
width = 1072
height = 1448

# USB 大容量存储（不是 MTP）：插上后 udisks 按卷标挂到 /run/media/$USER/KOBOeReader，产物放进根目录的 books/，子目录照跟踪目录。
# 不碰 .kobo/（书库数据库 KoboReader.sqlite 由 Nickel 自己扫描更新）。
[deliver]
kind = "usbms"
label = "KOBOeReader"              # 来源：Kobo 帮助页，卷标 KOBOeReader；udisks 挂到 /run/media/$USER/KOBOeReader
dir = "books"                      # 推断：Nickel 扫描整个存储（隐藏目录除外），放子目录便于管理（待确认）
