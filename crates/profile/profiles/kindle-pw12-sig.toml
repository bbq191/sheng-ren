# Kindle Paperwhite 12 代签名版（2024）。7" Carta 1300，2026-09-27 核实。
# USB 传书只认 AZW3，不认 EPUB（用户 2026-09-27 真机实测）。
name = "Kindle Paperwhite 12 代签名版"
ppi = 300
color = false
formats = ["azw3"]

[screen]
width = 1264
height = 1680

# 真实可阅读范围（像素，竖屏），2026-09-27 用测量书（AZW3）在真机上截屏实测（readable-measure --format=azw3）：
# 左右各 84（页边距）、上下各 75（页眉时间、页脚位置/进度）。比页面窄的图片靠左放、不居中，漫画必须补白到这个比例。
# 截图分辨率是 1272×1696（设备实际显示缓冲区），不是标称的 1264×1680；阅读范围就是在截图像素上量的。
# 用的是测量时的页边距设置；在 Kindle 上改了页边距要重新量。
[readable.azw3]
width = 1104
height = 1546
