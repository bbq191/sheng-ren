# KOReader 开机启动（koreader/kindle-boot，用户 2026-09-29）。由 KUAL「KOReader 开机启动 → 装上」拷到 /etc/upstart/。
# 亚马逊界面起来以后打开 KOReader，并停掉亚马逊界面（koreader.sh --framework_stop）；退出 KOReader 时 koreader.sh 会把界面拉回来。
# 每次开机只启动一次（/tmp 是内存盘，重启就清空）：界面被拉回来时 lab126_gui 又会"started"一次，没有这个保护就退不出 KOReader。
# 临时不想自启：从电脑删掉 U 盘根目录的 koreader-boot.enabled（或 KUAL 里"卸掉"）。
# 启动前、退出后各跑一次 bin/clean-dumps.sh，清掉停界面时偶尔生成的崩溃诊断包（2026-10-02 用户要）。
# KOReader 在后台脱离本任务跑（见下面的说明：前台跑退出时会死锁白屏）。
start on started lab126_gui
stop on stopping system

task

script
    [ -f /mnt/us/koreader-boot.enabled ] || exit 0
    [ -f /mnt/us/koreader/koreader.sh ] || exit 0
    [ -e /tmp/koreader-boot.done ] && exit 0
    touch /tmp/koreader-boot.done
    # 逃生口：上次自启的 KOReader 没正常退出就关机了（卡死后长按电源键重启、没电）→ 这次跳过，停在 Kindle 自带界面，
    # 免得每次开机都卡在同一个地方。只跳一次，下次开机照常自启。正常休眠唤醒不算关机。
    if [ -e /mnt/us/koreader-boot.running ]; then
        rm -f /mnt/us/koreader-boot.running
        exit 0
    fi
    # 等亚马逊主界面真的起来（appmgrd 发 appStarted），最多 90 秒；太早停界面会黑屏
    lipc-wait-event -s 90 com.lab126.appmgrd appStarted || true
    # KOReader 必须脱离本任务在后台跑，本任务马上结束（2026-10-02 真机：原来在本任务里前台跑，退出 KOReader 时白屏卡死）：
    # KOReader 退出时 koreader.sh 执行 `start lab126_gui` 拉回亚马逊界面，那要等"started lab126_gui"触发的任务（就是本任务）
    # 处理完，而本任务又在等 koreader.sh 返回——互相等，死锁。脚本书「KOReader（独占）」本来就是后台跑的，所以它退出正常。
    # 后台那段：先清诊断包、记"运行中"标记，--kual 要写在 --framework_stop 前面（koreader.sh 按顺序认参数），
    # 退出后删标记、再清一次诊断包（停界面时偶尔生成，见 bin/clean-dumps.sh）。
    CLEAN=/mnt/us/extensions/koreader-boot/bin/clean-dumps.sh
    RUN="[ -f $CLEAN ] && /bin/sh $CLEAN; touch /mnt/us/koreader-boot.running; /bin/sh /mnt/us/koreader/koreader.sh --kual --framework_stop; rm -f /mnt/us/koreader-boot.running; [ -f $CLEAN ] && /bin/sh $CLEAN"
    if command -v setsid >/dev/null 2>&1; then
        setsid /bin/sh -c "$RUN" >/dev/null 2>&1 </dev/null &
    else
        nohup /bin/sh -c "$RUN" >/dev/null 2>&1 </dev/null &
    fi
end script
