# KOReader 开机启动（koreader/kindle-boot，用户 2026-09-29）。由「KOReader 开机启动：装上」拷到 /etc/upstart/。
# 亚马逊界面起来以后**独占**打开 KOReader（停掉亚马逊界面），在 KOReader 里退出就整机重启、停在 Kindle 自带界面（2026-10-02 起，
# 见 bin/run.sh：独占退出时拉回界面，一次开机里第三次会白屏，所以不拉回、改成重启）。自带界面里点脚本书「KOReader（独占）」再回去。
# 每次开机只启动一次（/tmp 是内存盘，重启就清空）。
# 临时不想自启：从电脑删掉 U 盘根目录的 koreader-boot.enabled（或「KOReader 开机启动：卸掉」）。
# KOReader 在后台脱离本任务跑（见下面的说明：前台跑退出时会死锁白屏）。
start on started lab126_gui
stop on stopping system

task

script
    [ -f /mnt/us/koreader-boot.enabled ] || exit 0
    [ -f /mnt/us/koreader/koreader.sh ] || exit 0
    [ -e /tmp/koreader-boot.done ] && exit 0
    touch /tmp/koreader-boot.done
    # 上次是在 KOReader 里退出的（bin/start-shim.sh 留的记号）→ 这次停在自带界面。只这一次，下次开机照常自启。
    if [ -e /mnt/us/koreader-boot.native ]; then
        rm -f /mnt/us/koreader-boot.native
        exit 0
    fi
    # 逃生口：上次的 KOReader 没正常退出就关机了（卡死后长按电源键重启、没电、KOReader 菜单里的重启/关机）→ 这次跳过，
    # 停在 Kindle 自带界面，免得每次开机都卡在同一个地方。只跳一次。正常休眠唤醒不算关机。
    if [ -e /mnt/us/koreader-boot.running ]; then
        rm -f /mnt/us/koreader-boot.running
        exit 0
    fi
    # 等亚马逊主界面真的起来（appmgrd 发 appStarted），最多 90 秒；太早停界面会黑屏
    lipc-wait-event -s 90 com.lab126.appmgrd appStarted || true
    # KOReader 必须脱离本任务在后台跑，本任务马上结束（2026-10-02 真机：原来在本任务里前台跑，退出 KOReader 时白屏卡死）：
    # 本任务是"started lab126_gui"触发的，在它结束前任何 `start lab126_gui` 都要等它——前台跑就互相等。现在退出改成重启、不再拉回界面，
    # 但 bin/run.sh 在垫片失效时仍会照原样拉回，所以照旧后台跑。
    RUN=/mnt/us/extensions/koreader-boot/bin/run.sh
    if command -v setsid >/dev/null 2>&1; then
        setsid /bin/sh "$RUN" >/dev/null 2>&1 </dev/null &
    else
        nohup /bin/sh "$RUN" >/dev/null 2>&1 </dev/null &
    fi
end script
