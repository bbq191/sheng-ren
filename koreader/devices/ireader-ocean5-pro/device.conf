TRANSPORT="mtp"
# 掌阅 iReader Ocean 5 Pro 上的 KOReader（Android 版）。USB 连电脑是 MTP（gvfs）挂载。
MTP_HOST_PREFIX="iReader_Ocean_5_Pro"
KOREADER_DIR="内部共享存储空间/koreader"
# Android 上从电脑看不出 KOReader 是否在运行：apply.sh 会要求确认已在掌阅上彻底关闭 KOReader（最近任务里划掉）。
RUNNING_CHECK="ask"
# 个人设置要用的字体（KOReader 的 fonts/ 下）：正文霞鹜文楷、状态栏京華老宋体 v2.0。
FONTS=("LXGWWenKai-Regular.ttf" "京華老宋体.ttf")
