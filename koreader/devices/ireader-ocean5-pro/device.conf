TRANSPORT="mtp"
# 掌阅 iReader Ocean 5 Pro 上的 KOReader（Android 版）。USB 连电脑是 MTP（gvfs）挂载。
MTP_HOST_PREFIX="iReader_Ocean_5_Pro"
KOREADER_DIR="内部共享存储空间/koreader"
# Android 上从电脑看不出 KOReader 是否在运行：apply.sh 会要求确认已关闭。要用 KOReader 菜单里的「退出」——在最近任务里划掉
# 不一定结束进程（2026-09-28 实测：划掉后写入的界面字体设置，被还在运行的 KOReader 两分钟后存设置时整份覆盖掉了）。
RUNNING_CHECK="ask"
# 要用的字体（KOReader 的 fonts/ 下）：正文霞鹜文楷 Medium、状态栏京華老宋体 v3.0（用户 2026-09-28：三台统一用这两个文件）。
FONTS=("LXGWWenKai-Medium.ttf" "京華老宋体v3.0.ttf")
# 放书的目录（相对 MTP 挂载点；KOReader 起始目录 home_dir = /storage/emulated/0/books，见设备层；用户 2026-10-02 定：两台都用存储根下的 books）。
BOOKS_DIR="内部共享存储空间/books"
