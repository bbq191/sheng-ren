TRANSPORT="mtp"
# Kindle Paperwhite 12 代签名版上的 KOReader（v2026.07.2 nightly，kindlehf；KOReader 里型号 KindlePaperWhite6）。
# USB 连电脑是 MTP（gvfs）挂载。apply.sh 按这里找设备和 KOReader 目录。
MTP_HOST_PREFIX="Amazon_Kindle_Paperwhite"   # gvfs 挂载点 mtp:host=<这个前缀>…
KOREADER_DIR="Internal Storage/koreader"     # 相对挂载点
# KOReader 是否已退出：Kindle 上看 crash.log 最后一次启动之后有没有"Tearing down UIManager"（它退出时会把内存里的
# 设置写回文件，运行中改了会被覆盖）。
RUNNING_CHECK="crashlog"
# 要用的字体（KOReader 的 fonts/ 下）：正文和界面霞鹜新晰黑＋（2026-10-02 从文楷换）、状态栏京華老宋体 v3.0。
FONTS=("LXGWNeoXiHeiPlus.ttf" "京華老宋体v3.0.ttf")
# 要装的插件（koreader/plugins/<名>/ 整个目录拷到设备的 plugins/）：感光调亮度——Kindle 自带的自动亮度（光线传感器）照常调灯，
# 插件让 KOReader 读亮度时取硬件当前值，手动调亮度不会从旧值跳回来（用户 2026-10-02 要）。只读不写，开关在 更多工具 里。
PLUGINS=("kindleautobrightness.koplugin" "autolight.koplugin")  # autolight：自己写的自动前光（2026-10-02），见 koreader/README.md
# 放书的目录（相对 MTP 挂载点；KOReader 起始目录 home_dir = /mnt/us/books，见设备层）。Kindle 自带书库只扫 documents/，放这里的 EPUB 不会混进去。
BOOKS_DIR="Internal Storage/books"
