# 复制到代码仓库 .github/workflows/notify-afu.yml
# 需要仓库 Secrets：AFU_WEBHOOK_URL、AFU_WEBHOOK_TOKEN（变量名沿用旧名，值填 Jarvis「任务单唤醒路由」例行任务的地址和 key）（原始 token，不含 Bearer 前缀）
# 只发 {repo, branch, paths, task_ids}，不发任务内容
# 只有「状态变为 done / blocked」或「.agy.md 有改动」时才 POST，避免开单和验收过程反复唤醒
# 若 HEAD 提交信息含 [skip-notify]，整次推送不 POST：oc-exec --push 只靠唤醒 B；
# 负责 bot 推 .agy.md 后若在同一回合处理回执，提交时也加此标记，避免自我唤醒
name: notify-afu
on:
  push:
    branches: ['**']
    paths: ['.dev/tasks/**']
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 收集需要唤醒的任务单
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # HEAD 提交信息含 [skip-notify] 则整次不 POST（oc-exec --push / 负责 bot 推回执）
          if git log -1 --format=%B "$AFTER" 2>/dev/null | grep -Fq '[skip-notify]'; then
            echo "跳过：提交信息含 [skip-notify]"
            echo "paths=[]" >> "$GITHUB_OUTPUT"
            echo "ids=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # before 不可用（新分支首次 push、force push 后旧提交不在等）时，改用与默认分支的 merge-base，
          # 只看本分支相对默认分支新增的改动，避免把历史回执和既有 done/blocked 单整棵树发出去。
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=""
            if [ -n "$DEFAULT_BRANCH" ]; then
              git fetch --no-tags --quiet origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" 2>/dev/null || true
              BEFORE=$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" "$AFTER" 2>/dev/null || true)
            fi
          fi
          if [ -n "$BEFORE" ]; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER" -- .dev/tasks)
            has_before=1
          else
            # 仓库第一次 push、拿不到默认分支等极少数情况才退回全量
            changed=$(git ls-tree -r --name-only "$AFTER" -- .dev/tasks)
            has_before=0
          fi
          changed=$(printf '%s\n' "$changed" | grep -E '^\.dev/tasks/[a-z0-9][a-z0-9-]{0,95}(\.agy)?\.md$' || true)

          tmp=$(mktemp)
          printf '%s\n' "$changed" | while IFS= read -r p; do
            [ -n "$p" ] || continue
            keep=0
            case "$p" in
              *.agy.md) keep=1 ;;
              *)
                after_status=$(git show "$AFTER:$p" 2>/dev/null | grep -E '^- 状态:[[:space:]]*(done|blocked)\b' | head -n1 || true)
                if [ -n "$after_status" ]; then
                  if [ "$has_before" -eq 0 ]; then
                    keep=1
                  elif ! git cat-file -e "$BEFORE:$p" 2>/dev/null; then
                    keep=1
                  else
                    before_status=$(git show "$BEFORE:$p" 2>/dev/null | grep -E '^- 状态:[[:space:]]*(done|blocked)\b' | head -n1 || true)
                    [ "$before_status" = "$after_status" ] || keep=1
                  fi
                fi
                ;;
            esac
            if [ "$keep" -eq 1 ]; then
              printf '%s\n' "$p" >> "$tmp"
            fi
          done

          paths=$(cat "$tmp" 2>/dev/null || true)
          rm -f "$tmp"
          ids=$(printf '%s' "$paths" | sed -E '/^$/d; s#^\.dev/tasks/##; s#(\.agy)?\.md$##' | sort -u)
          echo "paths=$(printf '%s' "$paths" | sed '/^$/d' | jq -R . | jq -sc 'map(select(length>0))')" >> "$GITHUB_OUTPUT"
          echo "ids=$(printf '%s\n' "$ids" | sed '/^$/d' | jq -R . | jq -sc 'map(select(length>0))')" >> "$GITHUB_OUTPUT"
      - name: 唤醒 Jarvis
        if: steps.diff.outputs.paths != '[]'
        env:
          URL: ${{ secrets.AFU_WEBHOOK_URL }}
          TOKEN: ${{ secrets.AFU_WEBHOOK_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          PATHS: ${{ steps.diff.outputs.paths }}
          IDS: ${{ steps.diff.outputs.ids }}
        run: |
          [ -n "$URL" ] && [ -n "$TOKEN" ] || { echo "未配置 AFU_WEBHOOK_* ，跳过"; exit 0; }
          body=$(jq -nc --arg repo "$REPO" --arg branch "$BRANCH" --argjson paths "$PATHS" --argjson ids "$IDS" \
            '{repo:$repo, branch:$branch, paths:$paths, task_ids:$ids}')
          curl -fsS --retry 3 -X POST "$URL" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$body"
