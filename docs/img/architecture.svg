<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>核心架构</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555B66"/></marker>
    <style>
      .t{font-weight:600;fill:#1F2937}
      .tm{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace;font-weight:600;fill:#1F2937}
      .s{font-size:12px;fill:#4B5563}
      .sm{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace;font-size:11.5px;fill:#4B5563}
      .n{font-size:12px;fill:#6B7280}
    </style>
  </defs>
  <rect width="960" height="640" fill="#FCFCFD"/>
  <text x="480" y="30" text-anchor="middle" class="t" font-size="15">核心架构：六个 crate 分层，上层用下层，下层不知道上层</text>
  <rect x="340" y="48" width="280" height="52" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="480.0" y="70.0" text-anchor="middle" class="tm" font-size="14">booklib</text>
  <text x="480.0" y="88.0" text-anchor="middle" class="s">日常只用它：track · sync · list · meta …</text>
  <rect x="660" y="48" width="280" height="52" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="800.0" y="70.0" text-anchor="middle" class="t" font-size="13">tools/（Python 开发工具）</text>
  <text x="800.0" y="88.0" text-anchor="middle" class="s">只读：--print-profile、kfx-dump --json</text>
  <path d="M480 100 L480 124" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="20" y="126" width="760" height="132" rx="12" fill="#FFF6E5" stroke="#D89A2B" stroke-width="1.6"/>
  <text x="36" y="152" class="tm" font-size="15" fill="#D89A2B">library</text>
  <text x="112.39999999999999" y="152" class="s">书库：入库、跟踪同步、按设备生成、传到设备、补元数据</text>
  <rect x="36" y="158" width="86" height="44" rx="6" fill="#FFFFFF" stroke="#D89A2B" stroke-width="1"/>
  <text x="79.0" y="177" text-anchor="middle" class="tm" font-size="12.5">sources</text>
  <text x="79.0" y="194" text-anchor="middle" class="s" font-size="11">跟踪目录</text>
  <rect x="128" y="158" width="86" height="44" rx="6" fill="#FFFFFF" stroke="#D89A2B" stroke-width="1"/>
  <text x="171.0" y="177" text-anchor="middle" class="tm" font-size="12.5">catalog</text>
  <text x="171.0" y="194" text-anchor="middle" class="s" font-size="11">书库条目</text>
  <rect x="220" y="158" width="86" height="44" rx="6" fill="#FFFFFF" stroke="#D89A2B" stroke-width="1"/>
  <text x="263.0" y="177" text-anchor="middle" class="tm" font-size="12.5">generate</text>
  <text x="263.0" y="194" text-anchor="middle" class="s" font-size="11">生成计划</text>
  <rect x="312" y="158" width="86" height="44" rx="6" fill="#FFFFFF" stroke="#D89A2B" stroke-width="1"/>
  <text x="355.0" y="177" text-anchor="middle" class="tm" font-size="12.5">fingerprint</text>
  <text x="355.0" y="194" text-anchor="middle" class="s" font-size="11">指纹</text>
  <rect x="404" y="158" width="86" height="44" rx="6" fill="#FFFFFF" stroke="#D89A2B" stroke-width="1"/>
  <text x="447.0" y="177" text-anchor="middle" class="tm" font-size="12.5">build_run</text>
  <text x="447.0" y="194" text-anchor="middle" class="s" font-size="11">一轮调度</text>
  <rect x="496" y="158" width="86" height="44" rx="6" fill="#FFFFFF" stroke="#D89A2B" stroke-width="1"/>
  <text x="539.0" y="177" text-anchor="middle" class="tm" font-size="12.5">transfer</text>
  <text x="539.0" y="194" text-anchor="middle" class="s" font-size="11">传输线程</text>
  <rect x="588" y="158" width="86" height="44" rx="6" fill="#FFFFFF" stroke="#D89A2B" stroke-width="1"/>
  <text x="631.0" y="177" text-anchor="middle" class="tm" font-size="12.5">deliver</text>
  <text x="631.0" y="194" text-anchor="middle" class="s" font-size="11">送到设备</text>
  <rect x="680" y="158" width="86" height="44" rx="6" fill="#FFFFFF" stroke="#D89A2B" stroke-width="1"/>
  <text x="723.0" y="177" text-anchor="middle" class="tm" font-size="12.5">metadata</text>
  <text x="723.0" y="194" text-anchor="middle" class="s" font-size="11">补简介封面</text>
  <text x="36" y="236" text-anchor="start" class="s">session（缓存分组）· net（节流重试，NetError）· matching · 书目源：bangumi / douban / qqread / wikidata</text>
  <rect x="800" y="140" width="140" height="104" rx="8" fill="#EAF7EE" stroke="#3F9A5B" stroke-width="1.4"/>
  <text x="870.0" y="170.0" text-anchor="middle" class="t" font-size="14">三台设备</text>
  <text x="870.0" y="188.0" text-anchor="middle" class="s">Kindle：KFX</text>
  <text x="870.0" y="206.0" text-anchor="middle" class="s">掌阅：EPUB</text>
  <text x="870.0" y="224.0" text-anchor="middle" class="s">Move：EPUB</text>
  <path d="M780 192 L798 192" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M160 258 L160 290" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="168" y="280" text-anchor="start" class="n">只有 kindle 模式</text>
  <path d="M560 258 L560 290" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="568" y="280" text-anchor="start" class="n">优化、转换、读写 EPUB</text>
  <rect x="20" y="292" width="290" height="130" rx="12" fill="#E8F6F3" stroke="#2F9C8A" stroke-width="1.6"/>
  <text x="36" y="318" class="tm" font-size="15" fill="#2F9C8A">kfx</text>
  <text x="75.6" y="318" class="s">EPUB → KFX（clean-room）</text>
  <rect x="36" y="324" width="258" height="44" rx="6" fill="#FFFFFF" stroke="#2F9C8A" stroke-width="1"/>
  <text x="165.0" y="343" text-anchor="middle" class="tm" font-size="12.5">write/  写出器</text>
  <text x="165.0" y="360" text-anchor="middle" class="s" font-size="11">parse → analyze → style/layout → symbols</text>
  <rect x="36" y="374" width="258" height="44" rx="6" fill="#FFFFFF" stroke="#2F9C8A" stroke-width="1"/>
  <text x="165.0" y="393" text-anchor="middle" class="tm" font-size="12.5">ion · container · yj</text>
  <text x="165.0" y="410" text-anchor="middle" class="s" font-size="11">Ion 编解码、KFX 容器读写</text>
  <path d="M310 357 L338 357" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="340" y="292" width="600" height="130" rx="12" fill="#EEF3FF" stroke="#5B7FD6" stroke-width="1.6"/>
  <text x="356" y="318" class="tm" font-size="15" fill="#5B7FD6">bookconv</text>
  <text x="441.6" y="318" class="s">内容层：不管书库，只按给的阅读范围和选项处理一本书</text>
  <rect x="356" y="324" width="137" height="44" rx="6" fill="#FFFFFF" stroke="#5B7FD6" stroke-width="1"/>
  <text x="424.5" y="343" text-anchor="middle" class="tm" font-size="12.5">optimize/</text>
  <text x="424.5" y="360" text-anchor="middle" class="s" font-size="11">主流程、流式</text>
  <rect x="499" y="324" width="137" height="44" rx="6" fill="#FFFFFF" stroke="#5B7FD6" stroke-width="1"/>
  <text x="567.5" y="343" text-anchor="middle" class="tm" font-size="12.5">wash/</text>
  <text x="567.5" y="360" text-anchor="middle" class="s" font-size="11">只修复 + 照 Kindle</text>
  <rect x="642" y="324" width="137" height="44" rx="6" fill="#FFFFFF" stroke="#5B7FD6" stroke-width="1"/>
  <text x="710.5" y="343" text-anchor="middle" class="tm" font-size="12.5">kindle_model</text>
  <text x="710.5" y="360" text-anchor="middle" class="s" font-size="11">Kindle 的样子</text>
  <rect x="785" y="324" width="137" height="44" rx="6" fill="#FFFFFF" stroke="#5B7FD6" stroke-width="1"/>
  <text x="853.5" y="343" text-anchor="middle" class="tm" font-size="12.5">imgopt</text>
  <text x="853.5" y="360" text-anchor="middle" class="s" font-size="11">图片、漫画</text>
  <rect x="356" y="374" width="137" height="44" rx="6" fill="#FFFFFF" stroke="#5B7FD6" stroke-width="1"/>
  <text x="424.5" y="393" text-anchor="middle" class="tm" font-size="12.5">convert/</text>
  <text x="424.5" y="410" text-anchor="middle" class="s" font-size="11">CBZ → EPUB</text>
  <rect x="499" y="374" width="137" height="44" rx="6" fill="#FFFFFF" stroke="#5B7FD6" stroke-width="1"/>
  <text x="567.5" y="393" text-anchor="middle" class="tm" font-size="12.5">epubzip</text>
  <text x="567.5" y="410" text-anchor="middle" class="s" font-size="11">读写 EPUB</text>
  <rect x="642" y="374" width="137" height="44" rx="6" fill="#FFFFFF" stroke="#5B7FD6" stroke-width="1"/>
  <text x="710.5" y="393" text-anchor="middle" class="tm" font-size="12.5">opfmeta</text>
  <text x="710.5" y="410" text-anchor="middle" class="s" font-size="11">元数据</text>
  <rect x="785" y="374" width="137" height="44" rx="6" fill="#FFFFFF" stroke="#5B7FD6" stroke-width="1"/>
  <text x="853.5" y="393" text-anchor="middle" class="tm" font-size="12.5">check</text>
  <text x="853.5" y="410" text-anchor="middle" class="s" font-size="11">质量门</text>
  <path d="M160 422 L160 444 L380 444 L380 462" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M640 422 L640 462" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="280" y="464" width="460" height="64" rx="12" fill="#F1EEFF" stroke="#7C6CD9" stroke-width="1.6"/>
  <text x="296" y="490" class="tm" font-size="15" fill="#7C6CD9">csscascade</text>
  <text x="400.0" y="490" class="s">CSS 层叠引擎（写出器、kindle_rules 共用一份）</text>
  <text x="296" y="514" text-anchor="start" class="s">Rules（规则分桶）· Sheet::cascade_split · Computed::derive · ua（标签缺省样式）</text>
  <path d="M400 528 L400 552" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M620 528 L620 552" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="180" y="554" width="300" height="56" rx="8" fill="#F7EEFB" stroke="#A35DC9" stroke-width="1.4"/>
  <text x="330.0" y="578.0" text-anchor="middle" class="tm" font-size="14">profile</text>
  <text x="330.0" y="596.0" text-anchor="middle" class="s">阅读模式：屏幕、阅读范围、怪癖、怎么传</text>
  <rect x="520" y="554" width="300" height="56" rx="8" fill="#F2F4F7" stroke="#667085" stroke-width="1.4"/>
  <text x="670.0" y="578.0" text-anchor="middle" class="tm" font-size="14">bookbase</text>
  <text x="670.0" y="596.0" text-anchor="middle" class="s">基础件：util · html · color · epubpath</text>
  <text x="480" y="630" text-anchor="middle" class="n">箭头 = 依赖方向，单向无环：library → kfx → bookconv → csscascade → profile、bookbase（上层也直接用下面几层）</text>
</svg>
