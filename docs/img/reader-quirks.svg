<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>三台阅读器的怪癖，和对应的 profile 字段</title>
  <style>
    .hd{font-weight:bold;font-size:14px}
    .s{font-size:12px;fill:#444}
    .k{fill:#eef4ff;stroke:#5b7fd6}
    .i{fill:#eaf7ee;stroke:#3f9a5b}
    .x{fill:#fff6e5;stroke:#d69a2b}
    .f{fill:#f3eefa;stroke:#8a63c9}
    .c{stroke-width:1.2}
    .code{font-family:monospace;font-size:12px;fill:#4b2e83}
  </style>
  <rect width="960" height="676" fill="#ffffff"/>
  <text x="20" y="28" class="hd">算法只有一套；阅读器之间的差别都写成 profile 字段（crates/profile/profiles/*.toml），不在代码里按设备名分支</text>
  <rect class="c k" x="210" y="44" width="236" height="30" rx="6"/><text x="328" y="64" text-anchor="middle" class="hd">kindle（Kindle 自带）</text>
  <rect class="c i" x="456" y="44" width="236" height="30" rx="6"/><text x="574" y="64" text-anchor="middle" class="hd">ireader（掌阅自带）</text>
  <rect class="c x" x="702" y="44" width="238" height="30" rx="6"/><text x="821" y="64" text-anchor="middle" class="hd">xochitl（Move 自带）</text>
  <g>
    <rect class="c f" x="20" y="84" width="180" height="50" rx="6"/>
    <text x="30" y="104" class="code">formats</text><text x="30" y="123" class="s">产物格式</text>
    <text x="220" y="104" class="s">USB 传书不认 EPUB，出 KFX</text>
    <text x="220" y="123" class="code">["kfx"]</text>
    <text x="466" y="104" class="s">读 EPUB</text>
    <text x="466" y="123" class="code">["epub"]</text>
    <text x="712" y="104" class="s">读 EPUB（排成 PDF 显示）</text>
    <text x="712" y="123" class="code">["epub"]</text>
    <line x1="210" y1="138" x2="940" y2="138" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="142" width="180" height="50" rx="6"/>
    <text x="30" y="162" class="code">color</text><text x="30" y="181" class="s">彩色屏</text>
    <text x="220" y="162" class="s">黑白屏：漫画转灰度</text>
    <text x="220" y="181" class="code">false</text>
    <text x="466" y="162" class="s">黑白屏</text>
    <text x="466" y="181" class="code">false</text>
    <text x="712" y="162" class="s">彩色屏</text>
    <text x="712" y="181" class="code">true</text>
    <line x1="210" y1="196" x2="940" y2="196" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="200" width="180" height="50" rx="6"/>
    <text x="30" y="220" class="code">note_icons</text><text x="30" y="239" class="s">只有图标的注释号</text>
    <text x="220" y="220" class="s">另两台跟着用数字</text>
    <text x="220" y="239" class="code">"number"</text>
    <text x="466" y="220" class="s">同左</text>
    <text x="466" y="239" class="code">"number"</text>
    <text x="712" y="220" class="s">只有图的链接点不了</text>
    <text x="712" y="239" class="code">"number"（换数字）</text>
    <line x1="210" y1="254" x2="940" y2="254" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="258" width="180" height="50" rx="6"/>
    <text x="30" y="278" class="code">note_backlinks</text><text x="30" y="297" class="s">注释里跳回正文的链接</text>
    <text x="220" y="278" class="s">"返回"不可靠，要靠回链</text>
    <text x="220" y="297" class="code">true（保留）</text>
    <text x="466" y="278" class="s">有"返回"，回链也行</text>
    <text x="466" y="297" class="code">true</text>
    <text x="712" y="278" class="s">互相链接的一对整对丢掉</text>
    <text x="712" y="297" class="code">false（去掉）</text>
    <line x1="210" y1="312" x2="940" y2="312" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="316" width="180" height="50" rx="6"/>
    <text x="30" y="336" class="code">comic_margin</text><text x="30" y="355" class="s">图到画布四边的白边</text>
    <text x="220" y="355" class="code">1</text>
    <text x="466" y="355" class="code">1</text>
    <text x="712" y="336" class="s">页边距 1 时自己留了 1px</text>
    <text x="712" y="355" class="code">0</text>
    <line x1="210" y1="370" x2="940" y2="370" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="374" width="180" height="50" rx="6"/>
    <text x="30" y="394" class="code">[comic_readable]</text><text x="30" y="413" class="s">漫画画布</text>
    <text x="220" y="394" class="s">整屏</text>
    <text x="220" y="413" class="code">1272×1696</text>
    <text x="466" y="394" class="s">不写：同阅读范围（整屏）</text>
    <text x="466" y="413" class="code">—</text>
    <text x="712" y="394" class="s">页边距 1 时的显示区</text>
    <text x="712" y="413" class="code">952×1457</text>
    <line x1="210" y1="428" x2="940" y2="428" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="432" width="180" height="50" rx="6"/>
    <text x="30" y="452" class="code">comic_fixed_layout</text><text x="30" y="471" class="s">漫画写成固定版式</text>
    <text x="220" y="452" class="s">流式排版强制留页边距</text>
    <text x="220" y="471" class="code">true</text>
    <text x="466" y="452" class="s">整页图本来就铺满</text>
    <text x="466" y="471" class="code">—</text>
    <text x="712" y="452" class="s">按页边距 1 排</text>
    <text x="712" y="471" class="code">—</text>
    <line x1="210" y1="486" x2="940" y2="486" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="490" width="180" height="50" rx="6"/>
    <text x="30" y="510" class="code">comic_page_direction</text><text x="30" y="529" class="s">漫画翻页方向</text>
    <text x="220" y="510" class="s">照原书（日漫往右翻）</text>
    <text x="220" y="529" class="code">—</text>
    <text x="466" y="510" class="s">往右翻的书四周留边</text>
    <text x="466" y="529" class="code">"ltr"（改往左翻）</text>
    <text x="712" y="510" class="s">照原书</text>
    <text x="712" y="529" class="code">—</text>
    <line x1="210" y1="544" x2="940" y2="544" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="548" width="180" height="50" rx="6"/>
    <text x="30" y="568" class="code">comic_reader_margins</text><text x="30" y="587" class="s">漫画要设的页边距</text>
    <text x="220" y="587" class="code">—</text>
    <text x="466" y="587" class="code">—</text>
    <text x="712" y="568" class="s">CSS 改不动四周留白</text>
    <text x="712" y="587" class="code">1（登记后开书时设）</text>
  </g>
  <text x="20" y="622" class="s">上面一行是实测怪癖，下面一行是字段的值（— = 不写，用缺省）。notes：kindle、xochitl 是 "jump"，ireader 是 "popup"；屏幕、阅读范围的数字见 devices.md。</text>
  <text x="20" y="644" class="s">这些字段都进指纹：改了哪个，书库里受影响的书都算过期、下次重建。自定义模式放书库的 profiles/，同 id 覆盖内置的。</text>
</svg>
