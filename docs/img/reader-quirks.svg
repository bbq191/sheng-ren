<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 986" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>两台阅读器的怪癖，和对应的 profile 字段</title>
  <style>
    .hd{font-weight:bold;font-size:14px}
    .s{font-size:12px;fill:#444}
    .k{fill:#eef4ff;stroke:#5b7fd6}
    .i{fill:#eaf7ee;stroke:#3f9a5b}
    .f{fill:#f3eefa;stroke:#8a63c9}
    .c{stroke-width:1.2}
    .code{font-family:monospace;font-size:12px;fill:#4b2e83}
  </style>
  <rect width="960" height="986" fill="#ffffff"/>
  <text x="20" y="28" class="hd">算法只有一套；阅读器之间的差别都写成 profile 字段（crates/profile/profiles/*.toml），不在代码里按设备名分支</text>
  <rect class="c k" x="210" y="44" width="355" height="30" rx="6"/><text x="387" y="64" text-anchor="middle" class="hd">kindle（Kindle 自带）</text>
  <rect class="c i" x="575" y="44" width="365" height="30" rx="6"/><text x="757" y="64" text-anchor="middle" class="hd">ireader（掌阅自带）</text>
  <g>
    <rect class="c f" x="20" y="84" width="180" height="50" rx="6"/>
    <text x="30" y="104" class="code">formats</text><text x="30" y="123" class="s">产物格式</text>
    <text x="220" y="104" class="s">USB 传书不认 EPUB，出 KFX</text>
    <text x="220" y="123" class="code">["kfx"]</text>
    <text x="585" y="104" class="s">读 EPUB</text>
    <text x="585" y="123" class="code">["epub"]</text>
    <line x1="210" y1="138" x2="940" y2="138" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="142" width="180" height="50" rx="6"/>
    <text x="30" y="162" class="code">color</text><text x="30" y="181" class="s">彩色屏</text>
    <text x="220" y="162" class="s">黑白屏：漫画转灰度</text>
    <text x="220" y="181" class="code">false</text>
    <text x="585" y="162" class="s">黑白屏</text>
    <text x="585" y="181" class="code">false</text>
    <line x1="210" y1="196" x2="940" y2="196" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="200" width="180" height="50" rx="6"/>
    <text x="30" y="220" class="code">note_icons</text><text x="30" y="239" class="s">只有图标的注释号</text>
    <text x="220" y="220" class="s">用数字（验证过能跳）</text>
    <text x="220" y="239" class="code">"number"</text>
    <text x="585" y="220" class="s">同左</text>
    <text x="585" y="239" class="code">"number"</text>
    <line x1="210" y1="254" x2="940" y2="254" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="258" width="180" height="50" rx="6"/>
    <text x="30" y="278" class="code">note_backlinks</text><text x="30" y="297" class="s">注释里跳回正文的链接</text>
    <text x="220" y="278" class="s">"返回"不可靠，要靠回链</text>
    <text x="220" y="297" class="code">—（缺省 true，保留）</text>
    <text x="585" y="278" class="s">有"返回"，回链也行</text>
    <text x="585" y="297" class="code">—</text>
    <line x1="210" y1="312" x2="940" y2="312" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="316" width="180" height="50" rx="6"/>
    <text x="30" y="336" class="code">comic_margin</text><text x="30" y="355" class="s">图到画布四边的白边</text>
    <text x="220" y="336" class="s">离屏幕 1px</text>
    <text x="220" y="355" class="code">1</text>
    <text x="585" y="336" class="s">同左</text>
    <text x="585" y="355" class="code">1</text>
    <line x1="210" y1="370" x2="940" y2="370" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="374" width="180" height="50" rx="6"/>
    <text x="30" y="394" class="code">[comic_readable]</text><text x="30" y="413" class="s">漫画画布</text>
    <text x="220" y="394" class="s">整屏</text>
    <text x="220" y="413" class="code">1272×1696</text>
    <text x="585" y="394" class="s">不写：同阅读范围（整屏）</text>
    <text x="585" y="413" class="code">—</text>
    <line x1="210" y1="428" x2="940" y2="428" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="432" width="180" height="50" rx="6"/>
    <text x="30" y="452" class="code">comic_fixed_layout</text><text x="30" y="471" class="s">漫画写成固定版式</text>
    <text x="220" y="452" class="s">流式排版强制留页边距</text>
    <text x="220" y="471" class="code">true</text>
    <text x="585" y="452" class="s">整页图本来就铺满</text>
    <text x="585" y="471" class="code">—</text>
    <line x1="210" y1="486" x2="940" y2="486" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="490" width="180" height="50" rx="6"/>
    <text x="30" y="510" class="code">background_images</text><text x="30" y="529" class="s">保留 CSS 背景图</text>
    <text x="220" y="510" class="s">KFX 照 Amazon 写法写</text>
    <text x="220" y="529" class="code">true</text>
    <text x="585" y="510" class="s">不认 background 简写：拆成分项</text>
    <text x="585" y="529" class="code">true</text>
    <line x1="210" y1="544" x2="940" y2="544" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="548" width="180" height="50" rx="6"/>
    <text x="30" y="568" class="code">background_sizing</text><text x="30" y="587" class="s">留背景图尺寸和 fixed</text>
    <text x="220" y="568" class="s">和 Amazon 写法一致</text>
    <text x="220" y="587" class="code">—（缺省 true，留）</text>
    <text x="585" y="568" class="s">写了尺寸把图挤变形</text>
    <text x="585" y="587" class="code">false（去掉）</text>
    <line x1="210" y1="602" x2="940" y2="602" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="606" width="180" height="50" rx="6"/>
    <text x="30" y="626" class="code">css_rgba</text><text x="30" y="645" class="s">认 rgba() 颜色</text>
    <text x="220" y="626" class="s">KFX 认 rgba()</text>
    <text x="220" y="645" class="code">—（缺省 true）</text>
    <text x="585" y="626" class="s">rgba() 那条声明整条作废</text>
    <text x="585" y="645" class="code">false（换成 #rrggbb）</text>
    <line x1="210" y1="660" x2="940" y2="660" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="664" width="180" height="50" rx="6"/>
    <text x="30" y="684" class="code">caption_fit</text><text x="30" y="703" class="s">图和图注同页</text>
    <text x="220" y="684" class="s">KFX 只认图片宽度</text>
    <text x="220" y="703" class="code">true</text>
    <text x="585" y="684" class="s">不认 max-height，宽度 % 认</text>
    <text x="585" y="703" class="code">true</text>
    <line x1="210" y1="718" x2="940" y2="718" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="722" width="180" height="50" rx="6"/>
    <text x="30" y="742" class="code">image_alpha</text><text x="30" y="761" class="s">图片透明通道</text>
    <text x="220" y="742" class="s">透明处显示成黑色</text>
    <text x="220" y="761" class="code">false（合成白底）</text>
    <text x="585" y="742" class="s">显示正确</text>
    <text x="585" y="761" class="code">—</text>
    <line x1="210" y1="776" x2="940" y2="776" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="780" width="180" height="50" rx="6"/>
    <text x="30" y="800" class="code">text_repair_only</text><text x="30" y="819" class="s">文字书只修复</text>
    <text x="220" y="800" class="s">文字、图片、样式不动（2026-10-08）</text>
    <text x="220" y="819" class="code">true</text>
    <text x="585" y="800" class="s">同左</text>
    <text x="585" y="819" class="code">true</text>
    <line x1="210" y1="834" x2="940" y2="834" stroke="#ddd"/>
  </g>
  <g>
    <rect class="c f" x="20" y="838" width="180" height="50" rx="6"/>
    <text x="30" y="858" class="code">kindle_rules</text><text x="30" y="877" class="s">照 Send to Kindle 统一</text>
    <text x="220" y="858" class="s">由 KFX 写出器照规则表做</text>
    <text x="220" y="877" class="code">—</text>
    <text x="585" y="858" class="s">丢了样式表的书段与段挤在一起</text>
    <text x="585" y="877" class="code">true</text>
  </g>
  <text x="20" y="916" class="s">上面一行是实测怪癖，下面一行是字段的值（— = 不写，用缺省）。notes：kindle 是 "jump"，ireader 是 "popup"（只在完整优化时生效）；</text>
  <text x="20" y="936" class="s">background_images 到 image_alpha 是文字书完整优化的规则：文字书现在都只修复，它们只管漫画。屏幕、阅读范围、[deliver] 等其余字段见 devices.md。</text>
  <text x="20" y="958" class="s">影响产物的字段都进指纹（[deliver] 不进）：改了哪个，书库里受影响的书都算过期、下次重建。自定义模式放书库的 profiles/，同 id 覆盖内置的。</text>
</svg>
