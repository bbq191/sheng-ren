<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>三台阅读器的怪癖，和对应的 profile 字段</title>
  <style>
    .hd{font-weight:bold;font-size:14px}
    .s{font-size:12px;fill:#444}
    .k{fill:#eef4ff;stroke:#5b7fd6}
    .i{fill:#eaf7ee;stroke:#3f9a5b}
    .x{fill:#fff6e5;stroke:#d69a2b}
    .f{fill:#f3eefa;stroke:#8a63c9}
    .c{stroke-width:1.2}
    .code{font-family:monospace;font-size:12px;fill:#4b2e83}
  </style>
  <rect width="960" height="560" fill="#fafafa"/>
  <text x="20" y="28" class="hd">算法只有一套；阅读器之间的差别都写成 profile 字段（crates/profile/profiles/*.toml），不在代码里按设备名分支</text>

  <!-- 表头 -->
  <rect class="c k" x="200" y="44" width="240" height="30" rx="6"/><text x="320" y="64" text-anchor="middle" class="hd">kindle（Kindle 自带）</text>
  <rect class="c i" x="450" y="44" width="240" height="30" rx="6"/><text x="570" y="64" text-anchor="middle" class="hd">ireader（掌阅自带）</text>
  <rect class="c x" x="700" y="44" width="240" height="30" rx="6"/><text x="820" y="64" text-anchor="middle" class="hd">xochitl（Move 自带）</text>

  <!-- 每一行：字段 | 三台的怪癖与取值 -->
  <g>
    <rect class="c f" x="20" y="84" width="170" height="64" rx="6"/>
    <text x="30" y="104" class="code">formats</text><text x="30" y="124" class="s">产物格式</text>
    <text x="210" y="104" class="s">USB 传书只认 AZW3</text><text x="210" y="124" class="code">["azw3"]</text>
    <text x="460" y="104" class="s">读 EPUB</text><text x="460" y="124" class="code">["epub"]</text>
    <text x="710" y="104" class="s">读 EPUB（排成 PDF 显示）</text><text x="710" y="124" class="code">["epub"]</text>
  </g>
  <g>
    <rect class="c f" x="20" y="154" width="170" height="64" rx="6"/>
    <text x="30" y="174" class="code">note_icons</text><text x="30" y="194" class="s">只有图标的注释号</text>
    <text x="210" y="174" class="s">图标能不能点没验证</text><text x="210" y="194" class="code">"number"（换数字）</text>
    <text x="460" y="174" class="s">同左</text><text x="460" y="194" class="code">"number"</text>
    <text x="710" y="174" class="s">只有图的链接点不了</text><text x="710" y="194" class="code">"number"</text>
  </g>
  <g>
    <rect class="c f" x="20" y="224" width="170" height="64" rx="6"/>
    <text x="30" y="244" class="code">note_backlinks</text><text x="30" y="264" class="s">注释里跳回正文的链接</text>
    <text x="210" y="244" class="s">"返回"不可靠，要靠回链</text><text x="210" y="264" class="code">true（保留）</text>
    <text x="460" y="244" class="s">有"返回"，回链也行</text><text x="460" y="264" class="code">true</text>
    <text x="710" y="244" class="s">互相链接的一对整对丢掉</text><text x="710" y="264" class="code">false（去掉）</text>
  </g>
  <g>
    <rect class="c f" x="20" y="294" width="170" height="64" rx="6"/>
    <text x="30" y="314" class="code">comic_fixed_layout</text><text x="30" y="334" class="s">漫画写成固定版式</text>
    <text x="210" y="314" class="s">流式排版强制留页边距</text><text x="210" y="334" class="code">true（整屏 1272×1696）</text>
    <text x="460" y="314" class="s">整页图本来就铺满</text><text x="460" y="334" class="code">false</text>
    <text x="710" y="314" class="s">按页边距 1 排（见下）</text><text x="710" y="334" class="code">false</text>
  </g>
  <g>
    <rect class="c f" x="20" y="364" width="170" height="64" rx="6"/>
    <text x="30" y="384" class="code">comic_page_direction</text><text x="30" y="404" class="s">漫画翻页方向</text>
    <text x="210" y="384" class="s">照原书（日漫往右翻）</text><text x="210" y="404" class="code">不写</text>
    <text x="460" y="384" class="s">往右翻的书四周留边</text><text x="460" y="404" class="code">"ltr"（改成往左翻）</text>
    <text x="710" y="384" class="s">照原书</text><text x="710" y="404" class="code">不写</text>
  </g>
  <g>
    <rect class="c f" x="20" y="434" width="170" height="64" rx="6"/>
    <text x="30" y="454" class="code">comic_reader_margins</text><text x="30" y="474" class="s">漫画要设的页边距</text>
    <text x="210" y="454" class="s">—</text>
    <text x="460" y="454" class="s">—</text>
    <text x="710" y="454" class="s">CSS 改不动四周留白，只能靠页边距</text><text x="710" y="474" class="code">1（登记后开书时设）</text>
  </g>
  <line x1="20" y1="150" x2="940" y2="150" stroke="#ddd"/><line x1="20" y1="220" x2="940" y2="220" stroke="#ddd"/>
  <line x1="20" y1="290" x2="940" y2="290" stroke="#ddd"/><line x1="20" y1="360" x2="940" y2="360" stroke="#ddd"/>
  <line x1="20" y1="430" x2="940" y2="430" stroke="#ddd"/>

  <text x="20" y="526" class="s">三台都是黑白 / 彩色、屏幕、真实可阅读范围不同（color、[screen]、[readable.*]、[comic_readable]），其余规则完全一样。</text>
  <text x="20" y="546" class="s">这些字段都进指纹：改了哪个，书库里受影响的书都算过期、下次重建。自定义模式放书库的 profiles/，同 id 覆盖内置的。</text>
</svg>
