<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>KFX 容器结构，以及符号编号和容器 id 的硬规矩（样本黑盒分析得出）</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .hd{fill:#f3eefa;stroke:#8a63c9;stroke-width:1.2}
      .tb{fill:#eef4ff;stroke:#5b7fd6;stroke-width:1.2}
      .en{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.2}
      .sy{fill:#fff6e5;stroke:#d69a2b;stroke-width:1.2}
      .gr{fill:#f4f4f4;stroke:#999;stroke-width:1.2}
      .rd{fill:#fdecea;stroke:#b2452d;stroke-width:1.2}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12px;fill:#444}
      .m{font-family:monospace;font-size:12px;fill:#4b2e83}
      .l{stroke:#555;stroke-width:1.3;fill:none}
      .d{stroke:#b2452d;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>

  <text x="230" y="28" text-anchor="middle" class="h">一个 .kfx 文件（全部小端）</text>

  <!-- 固定头 -->
  <rect class="hd" x="20" y="40" width="420" height="48" rx="6"/>
  <text x="32" y="60" class="h">固定头 18 字节</text>
  <text x="32" y="78" class="m">CONT · u16 版本 2 · u32 头长度 · u32 容器信息偏移、长度</text>

  <!-- 头里的表 -->
  <rect class="tb" x="20" y="96" width="420" height="44" rx="6"/>
  <text x="32" y="114" class="h">实体索引表</text>
  <text x="32" y="131" class="s">每项 24 字节：u32 id · u32 类型 · u64 偏移（相对头长度）· u64 长度</text>
  <rect class="tb" x="20" y="146" width="420" height="44" rx="6"/>
  <text x="32" y="164" class="h">符号表</text>
  <text x="32" y="181" class="s">导入 YJ_symbols v10（max_id 859），再追加本书的局部符号</text>
  <rect class="tb" x="20" y="196" width="420" height="34" rx="6"/>
  <text x="32" y="218" class="s"><tspan class="h">格式能力表</tspan>（$593）：kfxgen.textBlock、kfxgen.positionMaps</text>
  <rect class="tb" x="20" y="236" width="420" height="44" rx="6"/>
  <text x="32" y="254" class="h">容器信息（Ion 结构体）</text>
  <text x="32" y="271" class="s">$409 容器 id · $412 块大小 4096 · 上面三张表的偏移和长度</text>
  <rect class="tb" x="20" y="286" width="420" height="44" rx="6"/>
  <text x="32" y="304" class="h">kfxgen 信息（Ion 文本）</text>
  <text x="32" y="321" class="s">kfxgen_payload_sha1（设备不校验）· kfxgen_acr（＝容器 id）</text>

  <!-- 实体区 -->
  <text x="20" y="352" class="s">← 头长度：实体区从这里开始</text>
  <rect class="en" x="20" y="360" width="420" height="172" rx="6"/>
  <text x="32" y="380" class="h">实体区</text>
  <text x="32" y="398" class="s">每个实体：ENTY · u16 版本 1 · u32 头长度 · {$410:0, $411:0} · 内容</text>
  <rect class="gr" x="34" y="408" width="128" height="30" rx="4"/><text x="98" y="428" text-anchor="middle" class="s">$260 版面</text>
  <rect class="gr" x="168" y="408" width="128" height="30" rx="4"/><text x="232" y="428" text-anchor="middle" class="s">$259 排版流</text>
  <rect class="gr" x="302" y="408" width="128" height="30" rx="4"/><text x="366" y="428" text-anchor="middle" class="s">$145 正文文字</text>
  <rect class="gr" x="34" y="444" width="128" height="30" rx="4"/><text x="98" y="464" text-anchor="middle" class="s">$157 样式</text>
  <rect class="gr" x="168" y="444" width="128" height="30" rx="4"/><text x="232" y="464" text-anchor="middle" class="s">$266 锚点 · $391 导航</text>
  <rect class="gr" x="302" y="444" width="128" height="30" rx="4"/><text x="366" y="464" text-anchor="middle" class="s">$490 元数据</text>
  <rect class="sy" x="34" y="480" width="128" height="30" rx="4"/><text x="98" y="500" text-anchor="middle" class="s">$164 资源描述</text>
  <rect class="sy" x="168" y="480" width="128" height="30" rx="4"/><text x="232" y="500" text-anchor="middle" class="s">$417 图片字节</text>
  <rect class="gr" x="302" y="480" width="128" height="30" rx="4"/><text x="366" y="500" text-anchor="middle" class="s">$419 清单 · …</text>
  <text x="32" y="524" class="s">版面 → 排版流 → 正文文字、样式；锚点、导航指到排版流里的节点（eid）</text>

  <!-- 右：符号编号 -->
  <text x="730" y="28" text-anchor="middle" class="h">符号编号（同一张符号表）</text>
  <rect class="gr" x="480" y="44" width="70" height="40" rx="4"/><text x="515" y="62" text-anchor="middle" class="s">1–9</text><text x="515" y="77" text-anchor="middle" class="s">Ion 系统</text>
  <rect class="tb" x="556" y="44" width="110" height="40" rx="4"/><text x="611" y="62" text-anchor="middle" class="s">10–868（859 个）</text><text x="611" y="77" text-anchor="middle" class="s">YJ_symbols（$N）</text>
  <rect class="en" x="672" y="44" width="150" height="40" rx="4"/><text x="747" y="62" text-anchor="middle" class="s">869 起：局部符号</text><text x="747" y="77" text-anchor="middle" class="s">实体名（版面、锚点…）</text>
  <rect class="sy" x="828" y="44" width="152" height="40" rx="4"/><text x="904" y="62" text-anchor="middle" class="s">最后：资源的符号</text><text x="904" y="77" text-anchor="middle" class="s">字节实体名 · 资源路径</text>

  <!-- 规矩 1 -->
  <rect class="sy" x="480" y="104" width="500" height="118" rx="8"/>
  <text x="494" y="126" class="h">① 资源路径的符号 = 字节实体的符号 + 9</text>
  <rect class="en" x="494" y="138" width="40" height="26" rx="3"/><text x="514" y="156" text-anchor="middle" class="s">n</text>
  <rect class="gr" x="538" y="138" width="150" height="26" rx="3"/><text x="613" y="156" text-anchor="middle" class="s">其余字节实体或占位</text>
  <rect class="sy" x="692" y="138" width="56" height="26" rx="3" stroke-width="2"/><text x="720" y="156" text-anchor="middle" class="s">n + 9</text>
  <path class="l" d="M514 166 C514 184 720 184 720 168" marker-end="url(#a)"/>
  <text x="760" y="156" class="s">每 9 个资源一组：先字节实体名</text>
  <text x="760" y="174" class="s">（不满 9 个补占位符号），再路径</text>
  <text x="494" y="204" class="s">$164 的 $165 路径符号减 9 = $417 字节实体。6 本样本 443 个资源无一例外，</text>
  <text x="494" y="218" class="s">不满足时图片、书架缩略图不显示。9 正好是 Ion 系统符号的个数。</text>

  <!-- 规矩 2 -->
  <rect class="sy" x="480" y="230" width="500" height="58" rx="8"/>
  <text x="494" y="252" class="h">② 元数据 cover_image 的符号 = 封面资源 $164 的符号 + 9</text>
  <text x="494" y="274" class="s">写出器在封面资源名后面排 8 个占位符号，第 9 个叫 cover-ref，元数据写它</text>

  <!-- 规矩 3 -->
  <rect class="rd" x="480" y="296" width="500" height="80" rx="8"/>
  <text x="494" y="318" class="h">③ 不能有实体的 id 排在资源路径的符号后面</text>
  <text x="494" y="340" class="s">否则比画布小的图有的页整页空白（固定版式漫画，47 本测试书查出来的）。</text>
  <text x="494" y="358" class="s">写出器 6 起资源的符号最后分配；单元测试断言最大实体 id &lt; 最大资源路径符号。</text>

  <!-- 容器 id 4 处 -->
  <rect class="hd" x="480" y="388" width="500" height="160" rx="8"/>
  <text x="494" y="410" class="h">④ 容器 id（CR!…）书里有 4 处，要一起改</text>
  <rect class="tb" x="494" y="422" width="230" height="28" rx="4"/><text x="506" y="441" class="s">容器信息 $409</text>
  <rect class="tb" x="734" y="422" width="232" height="28" rx="4"/><text x="746" y="441" class="s">kfxgen 信息 kfxgen_acr</text>
  <rect class="gr" x="494" y="456" width="230" height="28" rx="4"/><text x="506" y="475" class="s">$419 内容清单的 $155</text>
  <rect class="gr" x="734" y="456" width="232" height="28" rx="4"/><text x="746" y="475" class="s">$490 元数据的 asset_id</text>
  <text x="494" y="502" class="s">前两处在头里（左边蓝框），后两处在实体里。</text>
  <text x="494" y="520" class="s">只改头里的：书能开、正文对，但封面页的图不显示。</text>
  <text x="494" y="538" class="s">Container::set_container_id 一次换全。</text>


  <text x="20" y="568" class="s">· 实体 id = 实体名那个局部符号的编号；$N = 编号为 N 的 YJ_symbols 符号，名字没有公开，含义是对照样本推出来的。</text>
  <text x="20" y="590" class="s">· 没改动的容器解开再打包逐字节相同（kfx-repack，6 本样本）；设备不校验完整性，重新编码、改长度也能开。</text>
  <text x="20" y="612" class="s">· 细节见 docs/kfx.md：容器、片段类型、封面、固定版式、真机结论各节。</text>
</svg>
