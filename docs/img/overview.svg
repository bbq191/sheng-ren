<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>总体流程：入库 → 书库（索引）→ 按阅读模式生成（文字书、漫画分开处理）→ 自己拷到设备</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#888;stroke-width:1.2}
      .src{fill:#eef4ff;stroke:#5b7fd6}
      .lib{fill:#fff6e5;stroke:#d69a2b}
      .gen{fill:#eaf7ee;stroke:#3f9a5b}
      .dev{fill:#f3eefa;stroke:#8a63c9}
      .h{font-weight:bold;font-size:15px}
      .s{font-size:12px;fill:#555}
      line,path.l{stroke:#555;stroke-width:1.4;fill:none}
      path.d{stroke:#8a63c9;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1080" height="470" fill="#ffffff"/>

  <text x="100" y="30" text-anchor="middle" class="h">① 入库 add / sync</text>
  <text x="340" y="30" text-anchor="middle" class="h">② 书库（索引）</text>
  <text x="630" y="30" text-anchor="middle" class="h">③ 按阅读模式生成</text>
  <text x="935" y="30" text-anchor="middle" class="h">④ 自己拷到设备</text>

  <!-- 来源 -->
  <rect class="box src" x="20" y="60" width="160" height="40" rx="6"/><text x="100" y="85" text-anchor="middle">EPUB</text>
  <rect class="box src" x="20" y="116" width="160" height="44" rx="6"/><text x="100" y="135" text-anchor="middle">CBZ 漫画</text><text x="100" y="152" text-anchor="middle" class="s">生成时当场转 EPUB</text>
  <rect class="box src" x="20" y="176" width="160" height="40" rx="6"/><text x="100" y="201" text-anchor="middle">网页链接 https://</text>
  <rect class="box" x="20" y="240" width="160" height="56" rx="6" fill="#fdecec" stroke="#c44"/>
  <text x="100" y="263" text-anchor="middle" fill="#a22">不收</text><text x="100" y="283" text-anchor="middle" class="s">MOBI/AZW3/PDF 等、带 DRM</text>
  <rect class="box" x="20" y="316" width="160" height="50" rx="6"/>
  <text x="100" y="337" text-anchor="middle" class="s">track 书目录 → sync</text><text x="100" y="355" text-anchor="middle" class="s">增删改挪都跟着走</text>

  <!-- 书库 -->
  <rect class="box lib" x="230" y="50" width="220" height="316" rx="10"/>
  <text x="340" y="78" text-anchor="middle" class="h">只存索引，不复制原件</text>
  <text x="340" y="104" text-anchor="middle">每本书一个 meta.json：</text>
  <text x="340" y="126" text-anchor="middle">原件路径 · 内容哈希 · 书名作者</text>
  <text x="340" y="148" text-anchor="middle" class="s">网页没有原件：存抓下来的 EPUB</text>
  <line x1="250" y1="168" x2="430" y2="168" stroke="#e3c68c"/>
  <text x="340" y="192" text-anchor="middle" class="s">产物都从原件派生，随时可重建</text>
  <text x="340" y="214" text-anchor="middle" class="s">生成前核对原件没被改过</text>
  <text x="340" y="236" text-anchor="middle" class="s">指纹没变就跳过</text>
  <line x1="250" y1="262" x2="430" y2="262" stroke="#e3c68c"/>
  <text x="340" y="290" text-anchor="middle">meta --fetch 联网补</text>
  <text x="340" y="312" text-anchor="middle">简介、标签、封面</text>
  <text x="340" y="336" text-anchor="middle" class="s">豆瓣 → Wikidata → 生成封面</text>

  <path class="l" d="M180 80 C205 80 205 150 228 150" marker-end="url(#a)"/>
  <path class="l" d="M180 138 C205 138 205 165 228 165" marker-end="url(#a)"/>
  <path class="l" d="M180 196 C205 196 205 180 228 180" marker-end="url(#a)"/>
  <path class="l" d="M180 341 C205 341 205 200 228 200" marker-end="url(#a)"/>

  <!-- 生成：分叉 -->
  <rect class="box gen" x="500" y="50" width="260" height="316" rx="10"/>
  <text x="630" y="76" text-anchor="middle" class="h">阅读模式 profile</text>
  <text x="630" y="96" text-anchor="middle" class="s">阅读范围 · 黑白/彩色 · 阅读器怪癖</text>
  <rect class="box" x="565" y="108" width="130" height="30" rx="15"/>
  <text x="630" y="128" text-anchor="middle">是漫画吗？</text>
  <path class="l" d="M600 138 C590 150 572 152 572 162" marker-end="url(#a)"/>
  <path class="l" d="M660 138 C670 150 688 152 688 162" marker-end="url(#a)"/>
  <text x="560" y="156" text-anchor="end" class="s">否</text>
  <text x="700" y="156" class="s">是</text>
  <rect class="box" x="512" y="164" width="118" height="78" rx="6"/>
  <text x="571" y="185" text-anchor="middle">文字书</text>
  <text x="571" y="204" text-anchor="middle" class="s">解锁字体字号</text>
  <text x="571" y="220" text-anchor="middle" class="s">排版 · 注释</text>
  <text x="571" y="236" text-anchor="middle" class="s">章节分页</text>
  <rect class="box" x="640" y="164" width="108" height="78" rx="6"/>
  <text x="694" y="185" text-anchor="middle">漫画</text>
  <text x="694" y="204" text-anchor="middle" class="s">裁边 · 缩放</text>
  <text x="694" y="220" text-anchor="middle" class="s">补白 · 灰度</text>
  <text x="694" y="236" text-anchor="middle" class="s">贴屏幕 1px</text>
  <path class="l" d="M571 242 C571 256 600 256 610 262" marker-end="url(#a)"/>
  <path class="l" d="M694 242 C694 256 660 256 650 262" marker-end="url(#a)"/>
  <rect class="box" x="560" y="264" width="140" height="32" rx="6"/>
  <text x="630" y="285" text-anchor="middle">质量门（只警告）</text>
  <text x="630" y="318" text-anchor="middle" class="s">产物是 EPUB；kindle 模式再转 KFX</text>
  <text x="630" y="338" text-anchor="middle" class="s">放在书目录旁的 kindle/ ireader/ xochitl/</text>
  <text x="630" y="356" text-anchor="middle" class="s">（add 的书在书库 output/&lt;模式&gt;/）</text>

  <path class="l" d="M450 208 L498 208" marker-end="url(#a)"/>

  <!-- 设备 -->
  <rect class="box dev" x="810" y="50" width="250" height="100" rx="8"/>
  <text x="935" y="74" text-anchor="middle" class="h">kindle/（KFX）</text>
  <text x="935" y="98" text-anchor="middle">Kindle 自带阅读器</text>
  <text x="935" y="120" text-anchor="middle" class="s">文字书流式 · 漫画固定版式</text>
  <text x="935" y="138" text-anchor="middle" class="s">USB 拷进 documents/</text>
  <rect class="box dev" x="810" y="162" width="250" height="102" rx="8"/>
  <text x="935" y="186" text-anchor="middle" class="h">ireader/（EPUB）</text>
  <text x="935" y="210" text-anchor="middle">掌阅自带阅读器</text>
  <text x="935" y="232" text-anchor="middle" class="s">注释弹窗 · 漫画往左翻</text>
  <text x="935" y="250" text-anchor="middle" class="s">USB 导入</text>
  <rect class="box dev" x="810" y="276" width="250" height="90" rx="8"/>
  <text x="935" y="298" text-anchor="middle" class="h">xochitl/（EPUB，彩色）</text>
  <text x="935" y="320" text-anchor="middle">Move 自带阅读器</text>
  <text x="935" y="340" text-anchor="middle" class="s">网页上传；漫画要登记页边距</text>
  <path class="d" d="M760 180 C786 180 786 100 808 100" marker-end="url(#a)"/>
  <path class="d" d="M760 208 L808 208" marker-end="url(#a)"/>
  <path class="d" d="M760 236 C786 236 786 320 808 320" marker-end="url(#a)"/>

  <text x="540" y="410" text-anchor="middle" class="s">booklib sync 同步后按全部阅读模式生成（--device=kindle 只生成一个）；拷到设备上由你自己来（文件管理器或同步工具）</text>
  <text x="540" y="434" text-anchor="middle" class="s">三个模式用同一套规则，差别都写在模式的配置里；Kindle 的产物是同一份优化结果再转 KFX；三台都用自带阅读器，不装 KOReader</text>
</svg>
