<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>总体流程：入库 → 书库（索引）→ 按阅读模式生成 EPUB / AZW3 → 自己拷到设备</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#888;stroke-width:1.2}
      .src{fill:#eef4ff;stroke:#5b7fd6}
      .lib{fill:#fff6e5;stroke:#d69a2b}
      .gen{fill:#eaf7ee;stroke:#3f9a5b}
      .dev{fill:#f3eefa;stroke:#8a63c9}
      .h{font-weight:bold;font-size:15px}
      .s{font-size:12px;fill:#555}
      line,path.l{stroke:#555;stroke-width:1.4;fill:none}
      path.d{stroke:#8a63c9;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="960" height="440" fill="#fafafa"/>

  <!-- 列标题 -->
  <text x="100" y="30" text-anchor="middle" class="h">① 入库 add / sync</text>
  <text x="370" y="30" text-anchor="middle" class="h">② 书库（索引）</text>
  <text x="630" y="30" text-anchor="middle" class="h">③ 按阅读模式生成</text>
  <text x="865" y="30" text-anchor="middle" class="h">④ 自己拷到设备</text>

  <!-- 来源 -->
  <g>
    <rect class="box src" x="20" y="60" width="160" height="40" rx="6"/><text x="100" y="85" text-anchor="middle">EPUB</text>
    <rect class="box src" x="20" y="120" width="160" height="40" rx="6"/><text x="100" y="138" text-anchor="middle">CBZ 漫画</text><text x="100" y="153" text-anchor="middle" class="s">生成时当场转 EPUB</text>
    <rect class="box src" x="20" y="180" width="160" height="40" rx="6"/><text x="100" y="205" text-anchor="middle">网页链接 https://</text>
    <rect class="box" x="20" y="250" width="160" height="56" rx="6" fill="#fdecec" stroke="#c44"/>
    <text x="100" y="273" text-anchor="middle" fill="#a22">不收</text><text x="100" y="292" text-anchor="middle" class="s">MOBI/AZW3/PDF 等、带 DRM</text>
    <rect class="box" x="20" y="316" width="160" height="50" rx="6"/>
    <text x="100" y="337" text-anchor="middle" class="s">track 书目录 → sync</text><text x="100" y="355" text-anchor="middle" class="s">增删改挪都跟着走</text>
  </g>

  <!-- 书库 -->
  <rect class="box lib" x="250" y="50" width="240" height="316" rx="10"/>
  <text x="370" y="78" text-anchor="middle" class="h">只存索引，不复制原件</text>
  <text x="370" y="104" text-anchor="middle">每本书一个 meta.json：</text>
  <text x="370" y="128" text-anchor="middle">原件路径 · 内容哈希 · 书名作者</text>
  <text x="370" y="152" text-anchor="middle">网页没有原件：存抓下来的 EPUB</text>
  <line x1="270" y1="172" x2="470" y2="172" stroke="#e3c68c"/>
  <text x="370" y="196" text-anchor="middle" class="s">产物都从原件派生，随时可重建</text>
  <text x="370" y="218" text-anchor="middle" class="s">id = 原件内容 SHA-256 前 12 位</text>
  <text x="370" y="240" text-anchor="middle" class="s">生成前核对原件没被改过</text>
  <text x="370" y="262" text-anchor="middle" class="s">指纹没变就跳过，只重建有变化的</text>
  <line x1="270" y1="290" x2="470" y2="290" stroke="#e3c68c"/>
  <text x="370" y="316" text-anchor="middle">meta：联网补简介、标签、封面</text>
  <text x="370" y="338" text-anchor="middle" class="s">豆瓣 → Wikidata → 生成封面</text>

  <!-- 箭头：来源 → 书库 -->
  <path class="l" d="M180 80 C215 80 215 150 248 150" marker-end="url(#a)"/>
  <path class="l" d="M180 140 C215 140 215 165 248 165" marker-end="url(#a)"/>
  <path class="l" d="M180 200 C215 200 215 180 248 180" marker-end="url(#a)"/>
  <path class="l" d="M180 341 C215 341 215 200 248 200" marker-end="url(#a)"/>

  <!-- 生成 -->
  <rect class="box gen" x="540" y="50" width="180" height="316" rx="10"/>
  <text x="630" y="78" text-anchor="middle" class="h">阅读模式 profile</text>
  <text x="630" y="98" text-anchor="middle" class="s">真实可阅读范围 · 黑白/彩色</text>
  <rect class="box" x="556" y="112" width="148" height="44" rx="6"/>
  <text x="630" y="131" text-anchor="middle">文字书</text><text x="630" y="148" text-anchor="middle" class="s">清洗 · 排版 · 分页</text>
  <rect class="box" x="556" y="166" width="148" height="44" rx="6"/>
  <text x="630" y="185" text-anchor="middle">漫画</text><text x="630" y="202" text-anchor="middle" class="s">裁边 · 缩放 · 补白 · 灰度</text>
  <rect class="box" x="556" y="220" width="148" height="36" rx="6"/>
  <text x="630" y="243" text-anchor="middle">质量门（只警告）</text>
  <path class="l" d="M630 156 L630 164" marker-end="url(#a)"/>
  <path class="l" d="M630 210 L630 218" marker-end="url(#a)"/>
  <text x="630" y="274" text-anchor="middle" class="s">产物是 EPUB；kindle 模式</text>
  <text x="630" y="292" text-anchor="middle" class="s">再转成 AZW3。放在书目录旁的</text>
  <text x="630" y="310" text-anchor="middle" class="s">kindle/ ireader/ xochitl/</text>
  <text x="630" y="328" text-anchor="middle" class="s">（镜像子目录）；add 的书在</text>
  <text x="630" y="346" text-anchor="middle" class="s">书库 output/&lt;模式&gt;/</text>

  <path class="l" d="M490 208 L538 208" marker-end="url(#a)"/>

  <!-- 设备 -->
  <rect class="box dev" x="776" y="50" width="178" height="96" rx="8"/>
  <text x="865" y="73" text-anchor="middle" class="h">kindle/（AZW3）</text>
  <text x="865" y="96" text-anchor="middle">Kindle PW12 签名版</text>
  <text x="865" y="116" text-anchor="middle" class="s">自带阅读器 · 黑白</text>
  <text x="865" y="134" text-anchor="middle" class="s">USB 拷进 documents/</text>
  <rect class="box dev" x="776" y="160" width="178" height="96" rx="8"/>
  <text x="865" y="183" text-anchor="middle" class="h">ireader/（EPUB）</text>
  <text x="865" y="206" text-anchor="middle">掌阅 Ocean 5 Pro</text>
  <text x="865" y="226" text-anchor="middle" class="s">自带阅读器 · 黑白</text>
  <text x="865" y="244" text-anchor="middle" class="s">USB（MTP）导入</text>
  <rect class="box dev" x="776" y="270" width="178" height="96" rx="8"/>
  <text x="865" y="293" text-anchor="middle" class="h">xochitl/（EPUB）</text>
  <text x="865" y="316" text-anchor="middle">reMarkable Move</text>
  <text x="865" y="336" text-anchor="middle" class="s">自带阅读器 · 彩色</text>
  <text x="865" y="354" text-anchor="middle" class="s">自带的传书方式</text>
  <path class="d" d="M720 180 C750 180 750 98 774 98" marker-end="url(#a)"/>
  <path class="d" d="M720 208 L774 208" marker-end="url(#a)"/>
  <path class="d" d="M720 236 C750 236 750 318 774 318" marker-end="url(#a)"/>

  <text x="480" y="400" text-anchor="middle" class="s">booklib sync 同步后按全部阅读模式生成（--device=kindle 只生成一个）；拷到设备上用文件管理器或同步工具，自己来</text>
  <text x="480" y="422" text-anchor="middle" class="s">三个模式用同一套优化规则，只是阅读范围、黑白彩色不同；Kindle 的产物是同一份优化结果再转 AZW3</text>
</svg>
