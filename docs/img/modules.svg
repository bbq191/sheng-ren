<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>模块交互</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555B66"/></marker>
    <style>
      .t{font-weight:600;fill:#1F2937}
      .tm{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace;font-weight:600;fill:#1F2937}
      .s{font-size:12px;fill:#4B5563}
      .sm{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace;font-size:11.5px;fill:#4B5563}
      .n{font-size:12px;fill:#6B7280}
    </style>
  </defs>
  <rect width="960" height="900" fill="#FCFCFD"/>
  <text x="480" y="30" text-anchor="middle" class="t" font-size="15">模块交互：booklib sync 里的一本书、一台设备</text>
  <rect x="20" y="46" width="280" height="836" rx="12" fill="#FFF6E5" stroke="none" opacity="0.6"/>
  <text x="160.0" y="70" text-anchor="middle" class="t" font-size="14" fill="#D89A2B">library（书库）</text>
  <rect x="320" y="46" width="340" height="836" rx="12" fill="#EEF3FF" stroke="none" opacity="0.6"/>
  <text x="490.0" y="70" text-anchor="middle" class="t" font-size="14" fill="#5B7FD6">bookconv（内容层）</text>
  <rect x="680" y="46" width="260" height="836" rx="12" fill="#E8F6F3" stroke="none" opacity="0.6"/>
  <text x="810.0" y="70" text-anchor="middle" class="t" font-size="14" fill="#2F9C8A">kfx（只有 kindle 模式）</text>
  <rect x="40" y="88" width="240" height="56" rx="8" fill="#FFF6E5" stroke="#D89A2B" stroke-width="1.4"/>
  <text x="160.0" y="112.0" text-anchor="middle" class="tm" font-size="14">sources</text>
  <text x="160.0" y="130.0" text-anchor="middle" class="s">扫跟踪目录：新书入库，改了删了的跟着走</text>
  <path d="M160 144 L160 164" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="166" width="240" height="74" rx="8" fill="#FFF6E5" stroke="#D89A2B" stroke-width="1.4"/>
  <text x="160.0" y="181.0" text-anchor="middle" class="tm" font-size="14">build_run · generate</text>
  <text x="160.0" y="199.0" text-anchor="middle" class="s">每本书 × 每台接上的设备</text>
  <text x="160.0" y="217.0" text-anchor="middle" class="s">算指纹（fingerprint）比生成记录</text>
  <text x="160.0" y="235.0" text-anchor="middle" class="s">没变 → 跳过；变了 → 生成</text>
  <path d="M280 203 L310 203 L310 284 L338 284" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="160" y="262" text-anchor="middle" class="n">交给内容层：原件 + 这台的 profile →</text>
  <rect x="340" y="258" width="300" height="52" rx="8" fill="#EEF3FF" stroke="#5B7FD6" stroke-width="1.4"/>
  <text x="490.0" y="280.0" text-anchor="middle" class="tm" font-size="14">convert/ · opfmeta</text>
  <text x="490.0" y="298.0" text-anchor="middle" class="s">CBZ 转 EPUB；补书里缺的封面、简介</text>
  <path d="M490 310 L490 330" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="340" y="332" width="300" height="52" rx="8" fill="#EEF3FF" stroke="#5B7FD6" stroke-width="1.4"/>
  <text x="490.0" y="354.0" text-anchor="middle" class="tm" font-size="13">optimize/ → wash::repair_entries</text>
  <text x="490.0" y="372.0" text-anchor="middle" class="s">文字书只修复：EPUB 3、目录到节</text>
  <path d="M490 384 L490 404" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="340" y="406" width="300" height="70" rx="8" fill="#EEF3FF" stroke="#5B7FD6" stroke-width="1.4"/>
  <text x="490.0" y="428.0" text-anchor="middle" class="tm" font-size="13">步骤表 KINDLE_RULE_PASSES</text>
  <text x="490.0" y="446.0" text-anchor="middle" class="s">掌阅、Move：照 Kindle 改写</text>
  <text x="490.0" y="464.0" text-anchor="middle" class="s">每步：逐章并行分析 → 改写</text>
  <path d="M490 476 L490 496" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="340" y="498" width="300" height="52" rx="8" fill="#EEF3FF" stroke="#5B7FD6" stroke-width="1.4"/>
  <text x="490.0" y="520.0" text-anchor="middle" class="tm" font-size="14">check  质量门</text>
  <text x="490.0" y="538.0" text-anchor="middle" class="s">→ 优化后的 EPUB</text>
  <path d="M640 524 L694 524" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="648" y="516" text-anchor="start" class="n">kindle</text>
  <rect x="696" y="498" width="228" height="52" rx="8" fill="#E8F6F3" stroke="#2F9C8A" stroke-width="1.4"/>
  <text x="810.0" y="520.0" text-anchor="middle" class="tm" font-size="12.5">epubbook → write::parse</text>
  <text x="810.0" y="538.0" text-anchor="middle" class="s">读整本，XHTML 读成块树</text>
  <path d="M810 550 L810 600" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="696" y="602" width="228" height="52" rx="8" fill="#E8F6F3" stroke="#2F9C8A" stroke-width="1.4"/>
  <text x="810.0" y="624.0" text-anchor="middle" class="tm" font-size="12.5">analyze → style · layout</text>
  <text x="810.0" y="642.0" text-anchor="middle" class="s">全书统计 → 样式去重、版面</text>
  <path d="M810 654 L810 674" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="696" y="676" width="228" height="52" rx="8" fill="#E8F6F3" stroke="#2F9C8A" stroke-width="1.4"/>
  <text x="810.0" y="698.0" text-anchor="middle" class="tm" font-size="12.5">symbols · entities</text>
  <text x="810.0" y="716.0" text-anchor="middle" class="s">分配符号（资源最后）→ .kfx</text>
  <rect x="400" y="580" width="240" height="52" rx="8" fill="#F1EEFF" stroke="#7C6CD9" stroke-width="1.4"/>
  <text x="520.0" y="602.0" text-anchor="middle" class="tm" font-size="14">csscascade</text>
  <text x="520.0" y="620.0" text-anchor="middle" class="s">共用一份层叠：口径一样</text>
  <path d="M340 441 L326 441 L326 606 L398 606" fill="none" stroke="#555B66" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M780 604 L642 604" fill="none" stroke="#555B66" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="520" y="650" text-anchor="middle" class="n">虚线 = 调用；漫画不走 kindle_rules，走图片处理 imgopt</text>
  <path d="M420 550 L420 566 L304 566 L304 740 L282 740" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="160" y="708" text-anchor="middle" class="n">掌阅、Move：优化后的 EPUB</text>
  <path d="M696 702 L668 702 L668 758 L282 758" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="560" y="750" text-anchor="middle" class="n">Kindle：KFX</text>
  <rect x="40" y="722" width="240" height="52" rx="8" fill="#FFF6E5" stroke="#D89A2B" stroke-width="1.4"/>
  <text x="160.0" y="744.0" text-anchor="middle" class="tm" font-size="14">transfer</text>
  <text x="160.0" y="762.0" text-anchor="middle" class="s">交给这台的传输线程，主线程接着做下一本</text>
  <path d="M160 774 L160 790" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="792" width="240" height="36" rx="8" fill="#FFF6E5" stroke="#D89A2B" stroke-width="1.4"/>
  <text x="160.0" y="815.0" text-anchor="middle" class="t" font-size="12.5">deliver：MTP 写文件 / Move 导入</text>
  <path d="M280 810 L694 810" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="696" y="790" width="228" height="40" rx="8" fill="#EAF7EE" stroke="#3F9A5B" stroke-width="1.4"/>
  <text x="810.0" y="815.0" text-anchor="middle" class="t" font-size="13">设备</text>
  <path d="M160 828 L160 842" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="40" y="844" width="240" height="32" rx="8" fill="#FFF6E5" stroke="#D89A2B" stroke-width="1.4"/>
  <text x="160.0" y="865.0" text-anchor="middle" class="t" font-size="12.5">generate 收尾：写生成记录</text>
</svg>
