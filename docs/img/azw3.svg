<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>AZW3（KF8）文件结构与 EPUB 的对应</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .r{stroke:#777;stroke-width:1}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12px;fill:#444}
      .m{font-family:monospace;font-size:11.5px}
      .l{stroke:#555;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect width="940" height="500" fill="#fafafa"/>

  <!-- 第一行：EPUB → 文字流 → 引用改写 -->
  <text x="110" y="28" text-anchor="middle" class="h">EPUB（已按 Kindle 优化）</text>
  <rect x="20" y="40" width="180" height="34" rx="5" fill="#eaf7ee" stroke="#3f9a5b"/><text x="110" y="62" text-anchor="middle">ch1 … chN.xhtml</text>
  <rect x="20" y="82" width="180" height="34" rx="5" fill="#f3eefa" stroke="#8a63c9"/><text x="110" y="104" text-anchor="middle">*.css</text>
  <rect x="20" y="124" width="180" height="34" rx="5" fill="#eef4ff" stroke="#5b7fd6"/><text x="110" y="146" text-anchor="middle">图片 / 封面</text>
  <rect x="20" y="166" width="180" height="34" rx="5" fill="#fff6e5" stroke="#d69a2b"/><text x="110" y="188" text-anchor="middle">toc.ncx / nav 目录</text>
  <rect x="20" y="208" width="180" height="34" rx="5" fill="#ffe9e0" stroke="#d0735a"/><text x="110" y="230" text-anchor="middle">OPF 元数据</text>

  <text x="420" y="28" text-anchor="middle" class="h">文字流（每 4096 字节一条记录，PalmDOC 压缩）</text>
  <rect x="250" y="40" width="80" height="40" fill="#fff" class="r"/><text x="290" y="57" text-anchor="middle" class="s">骨架 0</text><text x="290" y="72" text-anchor="middle" class="m">aid=0</text>
  <rect x="330" y="40" width="70" height="40" fill="#eaf7ee" class="r"/><text x="365" y="65" text-anchor="middle" class="s">片段 0</text>
  <rect x="400" y="40" width="80" height="40" fill="#fff" class="r"/><text x="440" y="57" text-anchor="middle" class="s">骨架 1</text><text x="440" y="72" text-anchor="middle" class="m">aid=1</text>
  <rect x="480" y="40" width="70" height="40" fill="#eaf7ee" class="r"/><text x="515" y="65" text-anchor="middle" class="s">片段 1</text>
  <rect x="550" y="40" width="40" height="40" fill="#fff" class="r"/><text x="570" y="65" text-anchor="middle">…</text>
  <text x="420" y="102" text-anchor="middle" class="s">骨架 = &lt;html&gt;&lt;head&gt;…&lt;body aid&gt;&lt;/body&gt;&lt;/html&gt;</text>
  <text x="420" y="120" text-anchor="middle" class="s">片段 = body 里的内容，阅读器把它插回骨架的 &lt;/body&gt; 前</text>
  <rect x="250" y="134" width="340" height="34" fill="#f3eefa" class="r"/><text x="420" y="156" text-anchor="middle" class="s">CSS 各自一条流，接在后面（FDST 记每条流的起止）</text>

  <path class="l" d="M200 57 L248 60" marker-end="url(#a)"/>
  <path class="l" d="M200 99 L248 148" marker-end="url(#a)"/>

  <rect x="620" y="40" width="300" height="130" rx="6" fill="#fff" stroke="#aaa"/>
  <text x="770" y="62" text-anchor="middle" class="h">书里的引用改写成 Kindle 地址</text>
  <text x="632" y="86" class="m">图片 src → kindle:embed:0001?mime=…</text>
  <text x="632" y="106" class="m">样式表   → kindle:flow:0001?mime=text/css</text>
  <text x="632" y="126" class="m">书内链接 → kindle:pos:fid:0003:off:…</text>
  <text x="632" y="152" class="s">链接先写等长占位串，偏移定下后回填</text>

  <!-- 第二行：记录顺序 -->
  <text x="470" y="282" text-anchor="middle" class="h">AZW3 文件里的记录顺序（PDB 容器）</text>
  <g font-size="12">
    <rect x="20" y="296" width="96" height="56" fill="#ffe9e0" class="r"/><text x="68" y="318" text-anchor="middle">记录 0</text><text x="68" y="336" text-anchor="middle" class="s">MOBI 头 + EXTH</text>
    <rect x="116" y="296" width="110" height="56" fill="#eaf7ee" class="r"/><text x="171" y="318" text-anchor="middle">文字记录 × N</text><text x="171" y="336" text-anchor="middle" class="s">压缩 + 尾随字节</text>
    <rect x="226" y="296" width="92" height="56" fill="#fff" class="r"/><text x="272" y="318" text-anchor="middle">片段索引</text><text x="272" y="336" text-anchor="middle" class="s">INDX + CNCX</text>
    <rect x="318" y="296" width="88" height="56" fill="#fff" class="r"/><text x="362" y="318" text-anchor="middle">骨架索引</text><text x="362" y="336" text-anchor="middle" class="s">INDX</text>
    <rect x="406" y="296" width="92" height="56" fill="#fff6e5" class="r"/><text x="452" y="318" text-anchor="middle">目录索引</text><text x="452" y="336" text-anchor="middle" class="s">NCX INDX</text>
    <rect x="498" y="296" width="116" height="56" fill="#eef4ff" class="r"/><text x="556" y="318" text-anchor="middle">图片记录</text><text x="556" y="336" text-anchor="middle" class="s">含封面 + 缩略图</text>
    <rect x="614" y="296" width="80" height="56" fill="#f3eefa" class="r"/><text x="654" y="328" text-anchor="middle">FDST</text>
    <rect x="694" y="296" width="140" height="56" fill="#eee" class="r"/><text x="764" y="328" text-anchor="middle">FLIS / FCIS</text>
    <rect x="834" y="296" width="86" height="56" fill="#eee" class="r"/><text x="877" y="328" text-anchor="middle">EOF</text>
  </g>
  <text x="470" y="374" text-anchor="middle" class="s">颜色对应上面 EPUB 里的来源：元数据 → 记录 0 的 EXTH；正文 → 文字记录；目录 → 目录索引；图片 → 图片记录</text>

  <rect x="20" y="390" width="900" height="96" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="36" y="412" class="h">要点</text>
  <text x="36" y="434" class="s">· 依据公开的 MOBI 格式文档 + 对 KF8 样本文件的黑盒分析实现（clean-room，不看 KindleUnpack / Calibre 代码）。</text>
  <text x="36" y="454" class="s">· 不嵌字体（去掉 @font-face，字号字体交给阅读器）；缺省归"文档"（PDOC，侧载书封面最稳），--ebok 归"书籍"。</text>
  <text x="36" y="474" class="s">· 验证：roundtrip 测试用 bookconv 的 KF8 读取器读回核对；29 本真书逐字符一致；Kindle PW12 真机通过。</text>
</svg>
