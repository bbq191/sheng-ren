<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 720" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>按阅读模式生成一本书：文字书只修复、各台另加一点；漫画完整处理</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .b{fill:#fff;stroke:#999;stroke-width:1.1}
      .t{fill:#eef4ff;stroke:#5b7fd6;stroke-width:1.2}
      .c{fill:#fff6e5;stroke:#d69a2b;stroke-width:1.2}
      .g{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.2}
      .k{fill:#f3eefa;stroke:#8a63c9;stroke-width:1.2}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12px;fill:#444}
      .m{font-family:monospace;font-size:11.5px;fill:#4b2e83}
      .l{stroke:#555;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect width="940" height="720" fill="#fafafa"/>

  <rect class="b" x="300" y="14" width="340" height="44" rx="8"/>
  <text x="470" y="34" text-anchor="middle" class="h">原件 EPUB</text>
  <text x="470" y="50" text-anchor="middle" class="s">CBZ 先转成每页一张原图的 EPUB（标"漫画"）</text>
  <path class="l" d="M470 58 L470 74" marker-end="url(#a)"/>
  <rect class="b" x="380" y="76" width="180" height="32" rx="16"/>
  <text x="470" y="97" text-anchor="middle">是漫画吗？</text>
  <path class="l" d="M400 108 C330 120 250 120 240 146" marker-end="url(#a)"/>
  <path class="l" d="M540 108 C610 120 690 120 700 146" marker-end="url(#a)"/>
  <text x="300" y="140" class="s">文字书</text>
  <text x="620" y="140" class="s">漫画</text>

  <!-- 文字书：只修复 -->
  <rect class="t" x="20" y="148" width="440" height="200" rx="10"/>
  <text x="240" y="170" text-anchor="middle" class="h">文字书：只修复（text_repair_only，三台都做）</text>
  <g class="s">
    <text x="36" y="196">· 伪 DRM 剥离（真 DRM 入库时就拒收）· 坏文件名改名</text>
    <text x="36" y="218">· 去掉指向不存在文件的引用 · 重复 id 合并、改名</text>
    <text x="36" y="240">· 目录：改指指错的、分部重建、没有就生成</text>
    <text x="36" y="262">· 按目录层级定章节，漏掉的节补进目录（不拆文件）</text>
    <text x="36" y="284">· EPUB 3 规范整理：合法 XML、OPF 3.0、nav + NCX</text>
    <text x="36" y="306">· 网上的图按原图收进书里，抓不到的留着</text>
    <text x="36" y="334" font-weight="bold" fill="#1d4fa8">书里的文字、图片、格式、样式一概不动</text>
  </g>

  <!-- 各台另加 -->
  <path class="l" d="M240 348 L240 366" marker-end="url(#a)"/>
  <text x="250" y="362" class="s">各台另加</text>
  <rect class="k" x="20" y="368" width="140" height="150" rx="8"/>
  <text x="90" y="390" text-anchor="middle" class="h">kindle</text>
  <text x="90" y="414" text-anchor="middle" class="s">EPUB 不再加东西</text>
  <text x="90" y="438" text-anchor="middle" class="s">KFX 写出器照</text>
  <text x="90" y="456" text-anchor="middle" class="s">Send to Kindle</text>
  <text x="90" y="474" text-anchor="middle" class="s">规则表排</text>
  <text x="90" y="500" text-anchor="middle" class="m">→ KFX</text>

  <rect class="k" x="170" y="368" width="140" height="150" rx="8"/>
  <text x="240" y="390" text-anchor="middle" class="h">ireader</text>
  <text x="240" y="414" text-anchor="middle" class="m">kindle_rules</text>
  <text x="240" y="436" text-anchor="middle" class="s">标签缺省样式</text>
  <text x="240" y="454" text-anchor="middle" class="s">正文用阅读器字体</text>
  <text x="240" y="472" text-anchor="middle" class="s">body 左右边距不要</text>
  <text x="240" y="490" text-anchor="middle" class="s">文字对比度 4.5</text>
  <text x="240" y="510" text-anchor="middle" class="m">→ EPUB</text>

  <rect class="k" x="320" y="368" width="140" height="150" rx="8"/>
  <text x="390" y="390" text-anchor="middle" class="h">xochitl</text>
  <text x="390" y="414" text-anchor="middle" class="m">kindle_rules</text>
  <text x="390" y="432" text-anchor="middle" class="s">（同左）</text>
  <text x="390" y="454" text-anchor="middle" class="m">repair_note_links</text>
  <text x="390" y="474" text-anchor="middle" class="s">注释搬进本章、</text>
  <text x="390" y="492" text-anchor="middle" class="s">改同文件锚点</text>
  <text x="390" y="510" text-anchor="middle" class="m">→ EPUB</text>

  <!-- 漫画 -->
  <rect class="c" x="480" y="148" width="440" height="370" rx="10"/>
  <text x="700" y="170" text-anchor="middle" class="h">漫画：完整处理（不受只修复影响）</text>
  <g class="s">
    <text x="496" y="196">· 清洗层全套（夹着的文字页：解锁字体、排版、注释……）</text>
  </g>
  <g>
    <rect class="b" x="496" y="212" width="78" height="50" rx="6"/><text x="535" y="234" text-anchor="middle">解码</text><text x="535" y="252" text-anchor="middle" class="s">按 EXIF 摆正</text>
    <rect class="b" x="590" y="212" width="78" height="50" rx="6"/><text x="629" y="234" text-anchor="middle">裁边</text><text x="629" y="252" text-anchor="middle" class="s">只裁近白的边</text>
    <rect class="b" x="684" y="212" width="98" height="50" rx="6"/><text x="733" y="234" text-anchor="middle">缩放 + 补白</text><text x="733" y="252" text-anchor="middle" class="s">到漫画画布</text>
    <rect class="b" x="798" y="212" width="108" height="50" rx="6"/><text x="852" y="234" text-anchor="middle">编码 q95</text><text x="852" y="252" text-anchor="middle" class="s">+ 哈夫曼表重做</text>
    <path class="l" d="M574 237 L588 237" marker-end="url(#a)"/>
    <path class="l" d="M668 237 L682 237" marker-end="url(#a)"/>
    <path class="l" d="M782 237 L796 237" marker-end="url(#a)"/>
  </g>
  <g class="s">
    <text x="496" y="290">· 每张图只解码一次、只编码一次；已经合适的不重编码</text>
    <text x="496" y="314">· 画布 = comic_readable，图保比放进"画布 − 2×白边"</text>
    <text x="496" y="338">· 黑白屏（kindle、ireader）转 256 级灰度，<tspan font-weight="bold">不抖动</tspan></text>
    <text x="496" y="362">· xochitl 保留彩色</text>
    <text x="496" y="386">· 静态 GIF/WebP 转 PNG/JPEG；动图、解压炸弹原样保留</text>
    <text x="496" y="410">· 多张图并行处理（按像素额度限内存），结果与逐张相同</text>
    <text x="496" y="440" font-weight="bold">离屏幕 1px：</text>
    <text x="496" y="462">· kindle 写成固定版式（整屏画布）→ KFX</text>
    <text x="496" y="484">· ireader 改成往左翻（整页铺满）</text>
    <text x="496" y="506">· xochitl 按页边距 1 排，书架服务导入时登记</text>
  </g>

  <path class="l" d="M240 518 C240 560 440 550 450 600" marker-end="url(#a)"/>
  <path class="l" d="M700 518 C700 560 500 550 490 600" marker-end="url(#a)"/>

  <rect class="g" x="190" y="602" width="560" height="60" rx="8"/>
  <text x="470" y="624" text-anchor="middle" class="h">质量门 → 产物 → 传到设备</text>
  <text x="470" y="644" text-anchor="middle" class="s">XHTML 合法、目录和资源引用找得到、没有 DRM（没过只警告）；kindle 模式再转 KFX</text>
  <text x="470" y="686" text-anchor="middle" class="s">可见文字一个不多一个不少（真书回归逐字符核对）；拿不准的结构原样保留</text>
  <text x="470" y="706" text-anchor="middle" class="s">是不是漫画：图 ≥ 20 张（标了"漫画"的不看张数）且平均每张图配的字 &lt; 40</text>
</svg>
