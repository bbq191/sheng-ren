<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>按阅读模式优化一本书的流程（booklib build 内部，三个模式同一套规则）</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .b{fill:#fff;stroke:#999;stroke-width:1.1}
      .w{fill:#f3eefa;stroke:#8a63c9;stroke-width:1.2}
      .t{fill:#eef4ff;stroke:#5b7fd6;stroke-width:1.2}
      .c{fill:#fff6e5;stroke:#d69a2b;stroke-width:1.2}
      .g{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.2}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12px;fill:#444}
      .l{stroke:#555;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect width="940" height="700" fill="#fafafa"/>

  <rect class="b" x="300" y="14" width="340" height="44" rx="8"/>
  <text x="470" y="34" text-anchor="middle" class="h">原件 EPUB</text>
  <text x="470" y="50" text-anchor="middle" class="s">CBZ 先转成每页一张原图的 EPUB（标"漫画"）</text>
  <path class="l" d="M470 58 L470 76" marker-end="url(#a)"/>

  <!-- 清洗层：文字书和漫画都做 -->
  <rect class="w" x="20" y="78" width="900" height="206" rx="10"/>
  <text x="470" y="100" text-anchor="middle" class="h">清洗层 wash（文字书、漫画都做；漫画不分页）</text>
  <g class="s">
    <text x="40" y="126">① 剥"伪 DRM"（真 DRM 报错）· 删空白页、失效引用 · 坏文件名改名</text>
    <text x="40" y="148">② 判断主语言（dc:language + 正文字符分布）</text>
    <text x="40" y="170">③ CSS 解锁：去字体、绝对字号、行高、vh 高度；背景图按模式留或去</text>
    <text x="40" y="192">④ 嵌入字体：正文、批注不用；章名、书信等装饰字体保留</text>
    <text x="40" y="214">⑤ 段首缩进空白交给 CSS · 居中居右换成类 · 补 lang</text>
    <text x="490" y="126">⑥ 注入 eink-wash.css：缩进、两端对齐、断字、注释和批注 0.85em</text>
    <text x="490" y="148">⑦ 目录：改指指错的、按层级重建（册/作品/部/章）、没有就生成</text>
    <text x="490" y="170">⑧ 分页：书/卷、章独占一页，节另起一页（按目录层级）</text>
    <text x="490" y="192">⑨ 删章尾空白页 · NCX uid 对齐 OPF</text>
    <text x="490" y="214">⑩ 规范整理：XHTML 修成合法 XML、OPF 3.0、nav + NCX、landmarks</text>
  </g>
  <line x1="40" y1="232" x2="900" y2="232" stroke="#c9b8e8"/>
  <text x="40" y="254" class="s">可见文字一个不多一个不少（真书回归逐字符核对）；拿不准的结构原样保留。</text>
  <text x="40" y="274" class="s">判断是不是漫画：图 ≥ 20 张（标了"漫画"的不看张数）且平均每张图配的文字 &lt; 40 字。</text>

  <path class="l" d="M300 284 C300 304 240 296 240 316" marker-end="url(#a)"/>
  <path class="l" d="M640 284 C640 304 700 296 700 316" marker-end="url(#a)"/>
  <text x="200" y="306" class="s">文字书</text>
  <text x="720" y="306" class="s">漫画</text>

  <!-- 文字书 -->
  <rect class="t" x="20" y="318" width="440" height="262" rx="10"/>
  <text x="240" y="340" text-anchor="middle" class="h">文字书</text>
  <g class="s">
    <text x="36" y="366">· 注释搬到引用它的那一份末尾，标号改成同文件链接</text>
    <text x="52" y="386">（几章都引用的留在原处；回链 xochitl 去掉，另两台保留）</text>
    <text x="36" y="410">· 只有小图标的注释号换成上标数字（三个模式都这样）</text>
    <text x="36" y="434">· 书里引用的网上图片抓进书里；抓不到的删掉 &lt;img&gt;</text>
    <text x="36" y="458">· 插图超过阅读范围才缩小（带 EXIF 方向的先摆正）</text>
    <text x="36" y="482">· 封面 SVG 换成 &lt;img&gt;；本章重复的 id 改名</text>
    <text x="36" y="506">· manifest 的 properties 按最终内容标</text>
    <text x="36" y="540" class="s">不改：颜色、背景色、粗体、斜体、对齐等原书样式；</text>
    <text x="36" y="560" class="s">标点、全半角、中英文间距（会多字少字）</text>
  </g>

  <!-- 漫画 -->
  <rect class="c" x="480" y="318" width="440" height="262" rx="10"/>
  <text x="700" y="340" text-anchor="middle" class="h">漫画页：每张图单趟处理，只编码一次</text>
  <g>
    <rect class="b" x="496" y="354" width="78" height="50" rx="6"/><text x="535" y="376" text-anchor="middle">解码</text><text x="535" y="394" text-anchor="middle" class="s">按 EXIF 摆正</text>
    <rect class="b" x="590" y="354" width="78" height="50" rx="6"/><text x="629" y="376" text-anchor="middle">裁边</text><text x="629" y="394" text-anchor="middle" class="s">只裁近白的边</text>
    <rect class="b" x="684" y="354" width="98" height="50" rx="6"/><text x="733" y="376" text-anchor="middle">缩放 + 补白</text><text x="733" y="394" text-anchor="middle" class="s">到漫画画布</text>
    <rect class="b" x="798" y="354" width="108" height="50" rx="6"/><text x="852" y="376" text-anchor="middle">编码 q95</text><text x="852" y="394" text-anchor="middle" class="s">+ 哈夫曼表重做</text>
    <path class="l" d="M574 379 L588 379" marker-end="url(#a)"/>
    <path class="l" d="M668 379 L682 379" marker-end="url(#a)"/>
    <path class="l" d="M782 379 L796 379" marker-end="url(#a)"/>
  </g>
  <g class="s">
    <text x="496" y="430">· 画布 = comic_readable（Kindle 整屏），图保比放进"画布 − 2×白边"</text>
    <text x="496" y="452">· 黑白屏（kindle、ireader）转 256 级灰度，<tspan font-weight="bold">不抖动</tspan>；xochitl 保留彩色</text>
    <text x="496" y="474">· 已经合适的图不重新编码；透明背景先铺白</text>
    <text x="496" y="496">· 静态 GIF/WebP 转 PNG/JPEG；动图、解压炸弹原样保留</text>
    <text x="496" y="518">· kindle 写成固定版式；ireader 改往左翻；xochitl 按页边距 1 排</text>
    <text x="496" y="540">· 多张图并行处理（按像素额度限内存），结果与逐张相同</text>
    <text x="496" y="562">· 夹在漫画里的文字页照常保留；OPF 标"漫画"</text>
  </g>

  <path class="l" d="M240 580 C240 610 440 600 450 622" marker-end="url(#a)"/>
  <path class="l" d="M700 580 C700 610 500 600 490 622" marker-end="url(#a)"/>

  <rect class="g" x="190" y="624" width="560" height="60" rx="8"/>
  <text x="470" y="646" text-anchor="middle" class="h">质量门 → 产物</text>
  <text x="470" y="666" text-anchor="middle" class="s">XHTML 合法、目录和资源引用找得到、没有 DRM（没过只警告）→ EPUB；kindle 模式再转 KFX</text>
</svg>
