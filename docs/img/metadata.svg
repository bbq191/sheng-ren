<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 585" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>booklib meta --fetch：元数据和封面从哪来、写到哪里</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#888;stroke-width:1.2}
      .src{fill:#eef4ff;stroke:#5b7fd6}
      .lib{fill:#fff6e5;stroke:#d69a2b}
      .gen{fill:#eaf7ee;stroke:#3f9a5b}
      .dev{fill:#f3eefa;stroke:#8a63c9}
      .h{font-weight:bold;font-size:15px}
      .s{font-size:12px;fill:#555}
      path.l{stroke:#555;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="960" height="585" fill="#fafafa"/>

  <text x="250" y="30" text-anchor="middle" class="h">按顺序找，找到就停</text>
  <text x="760" y="30" text-anchor="middle" class="h">存到哪里</text>

  <!-- 输入 -->
  <rect class="box" x="20" y="48" width="460" height="44" rx="6"/>
  <text x="250" y="68" text-anchor="middle">书名、作者（书里的元数据；署名拆开、书名去卷次再搜）</text>
  <text x="250" y="85" text-anchor="middle" class="s">书里已有封面就只找元数据；每个网络请求间隔 1.2 秒</text>

  <!-- 1 豆瓣 -->
  <rect class="box src" x="20" y="116" width="460" height="92" rx="8"/>
  <text x="40" y="140" class="h">① 豆瓣</text>
  <text x="120" y="140" class="s">中文版；没有公开 API，改版会失效</text>
  <text x="40" y="164" class="s">搜索建议找条目，搜不到用书籍搜索页（漫画在这里）→ 条目页取：</text>
  <text x="40" y="182">内容简介 · 标签 · 原作名 · 出版社 / 出版年 / ISBN / 译者</text>
  <text x="40" y="200" class="s">封面：几个候选里挑分辨率最高的</text>

  <!-- 2 QQ 阅读 -->
  <rect class="box src" x="20" y="232" width="460" height="74" rx="8"/>
  <text x="40" y="256" class="h">② QQ 阅读</text>
  <text x="140" y="256" class="s">novel.qq.com，网络文学多在这里；豆瓣没找到时</text>
  <text x="40" y="278">内容简介 · 分类当标签</text>
  <text x="40" y="296" class="s">封面：搜索结果里的封面（约 500×720）</text>

  <!-- 3 Wikidata -->
  <rect class="box src" x="20" y="330" width="460" height="74" rx="8"/>
  <text x="40" y="354" class="h">③ Wikidata</text>
  <text x="140" y="354" class="s">前两个都没找到这本书、或没有封面时</text>
  <text x="40" y="376">原作名 · 首次出版年</text>
  <text x="40" y="394" class="s">封面：作品的 Open Library / Wikimedia Commons 封面</text>

  <!-- 4 生成 -->
  <rect class="box gen" x="20" y="428" width="460" height="56" rx="8"/>
  <text x="40" y="452" class="h">④ 生成封面</text>
  <text x="150" y="452" class="s">都没有封面时</text>
  <text x="40" y="473" class="s">书名 + 作者名，能找到的话配作者头像（Wikidata）</text>

  <path class="l" d="M250 92 L250 114" marker-end="url(#a)"/>
  <path class="l" d="M250 208 L250 230" marker-end="url(#a)"/>
  <path class="l" d="M250 306 L250 328" marker-end="url(#a)"/>
  <path class="l" d="M250 404 L250 426" marker-end="url(#a)"/>
  <text x="258" y="224" class="s">元数据或封面没找到</text>
  <text x="258" y="322" class="s">还是没找到</text>
  <text x="258" y="420" class="s">没有封面</text>

  <!-- 存放 -->
  <rect class="box lib" x="540" y="48" width="400" height="150" rx="8"/>
  <text x="560" y="72" class="h">书库 meta.json（全部都记）</text>
  <text x="560" y="96">找来的一切：简介、标签、原作名、首版年、</text>
  <text x="560" y="116">那个版本的出版社、ISBN、译者，来源网址</text>
  <text x="560" y="140" class="s">出版社、ISBN、日期、译者：版本就是这本时才写进书</text>
  <text x="560" y="158" class="s">（条目名和书名一致，书里写了译者时译者也对得上）</text>
  <text x="560" y="182" class="s">封面图存在书库条目目录（cover.jpg / cover.png）</text>

  <rect class="box dev" x="540" y="222" width="400" height="164" rx="8"/>
  <text x="560" y="246" class="h">生成的书（booklib sync 生成时补进去）</text>
  <text x="560" y="272">只补书里没有的：</text>
  <text x="560" y="294">简介 · 标签 · 封面 · 国籍 · 译者 · 出版社 · 日期 · ISBN</text>
  <text x="560" y="320" class="s">书名用网站书名 + 卷次（文件名同）；署名拆开；正文不动</text>
  <text x="560" y="340" class="s">原件不动：补在生成的副本里</text>
  <text x="560" y="360" class="s">真正补进书的才进指纹：找到新东西，下次 sync 重建这本</text>

  <path class="l" d="M480 162 C510 162 510 123 538 123" marker-end="url(#a)"/>
  <path class="l" d="M480 269 C510 269 510 150 538 150" marker-end="url(#a)"/>
  <path class="l" d="M480 367 C515 367 515 160 538 160" marker-end="url(#a)"/>
  <path class="l" d="M740 198 L740 220" marker-end="url(#a)"/>

  <text x="480" y="530" text-anchor="middle" class="s">sync 生成前给没找过的书自动找一次（--no-meta 跳过）；meta --fetch [--force] 手动找；找错了 --clear</text>
  <text x="480" y="550" text-anchor="middle" class="s">也可以手改文件本身：booklib meta --edit 书.epub --title … --tag … --cover 图（可见文字不变，图片原样）</text>
  <text x="480" y="570" text-anchor="middle" class="s">漫画先查 Bangumi（bgm.tv 公开 API），再查豆瓣；同一套漫画只查一次，别的卷照用；只写作品层面的，不写某一卷的 ISBN</text>
</svg>
