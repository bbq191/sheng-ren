<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>booklib meta --fetch：元数据和封面从哪来、写到哪里</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#888;stroke-width:1.2}
      .src{fill:#eef4ff;stroke:#5b7fd6}
      .lib{fill:#fff6e5;stroke:#d69a2b}
      .gen{fill:#eaf7ee;stroke:#3f9a5b}
      .dev{fill:#f3eefa;stroke:#8a63c9}
      .h{font-weight:bold;font-size:15px}
      .s{font-size:12px;fill:#555}
      path.l{stroke:#555;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="960" height="485" fill="#fafafa"/>

  <text x="250" y="30" text-anchor="middle" class="h">按顺序找，找到就停</text>
  <text x="760" y="30" text-anchor="middle" class="h">存到哪里</text>

  <!-- 输入 -->
  <rect class="box" x="20" y="48" width="460" height="44" rx="6"/>
  <text x="250" y="68" text-anchor="middle">书名、作者（书里的 + 文件名里的）</text>
  <text x="250" y="85" text-anchor="middle" class="s">书里已有封面就只找元数据；每个网络请求间隔 1.2 秒</text>

  <!-- 1 豆瓣 -->
  <rect class="box src" x="20" y="116" width="460" height="92" rx="8"/>
  <text x="40" y="140" class="h">① 豆瓣</text>
  <text x="120" y="140" class="s">中文版；没有公开 API，改版会失效</text>
  <text x="40" y="164" class="s">搜索建议接口找条目（书名、作者对得上才算）→ 条目页取：</text>
  <text x="40" y="182">内容简介 · 标签 · 原作名 · 出版社 / 出版年 / ISBN / 译者</text>
  <text x="40" y="200" class="s">封面：几个候选里挑分辨率最高的</text>

  <!-- 2 Wikidata -->
  <rect class="box src" x="20" y="232" width="460" height="74" rx="8"/>
  <text x="40" y="256" class="h">② Wikidata</text>
  <text x="140" y="256" class="s">豆瓣没找到这本书、或没有封面时</text>
  <text x="40" y="278">原作名 · 首次出版年</text>
  <text x="40" y="296" class="s">封面：作品的 Open Library / Wikimedia Commons 封面</text>

  <!-- 3 生成 -->
  <rect class="box gen" x="20" y="330" width="460" height="56" rx="8"/>
  <text x="40" y="354" class="h">③ 生成封面</text>
  <text x="150" y="354" class="s">都没有封面时</text>
  <text x="40" y="375" class="s">书名 + 作者名，能找到的话配作者头像（Wikidata）</text>

  <path class="l" d="M250 92 L250 114" marker-end="url(#a)"/>
  <path class="l" d="M250 208 L250 230" marker-end="url(#a)"/>
  <path class="l" d="M250 306 L250 328" marker-end="url(#a)"/>
  <text x="258" y="224" class="s">元数据或封面没找到</text>
  <text x="258" y="322" class="s">没有封面</text>

  <!-- 存放 -->
  <rect class="box lib" x="540" y="48" width="400" height="150" rx="8"/>
  <text x="560" y="72" class="h">书库 meta.json（全部都记）</text>
  <text x="560" y="96">找来的一切：简介、标签、原作名、首版年、</text>
  <text x="560" y="116">那个版本的出版社、ISBN、译者，来源网址</text>
  <text x="560" y="140" class="s">出版社、ISBN、译者是豆瓣那个版本的（多是大陆版），</text>
  <text x="560" y="158" class="s">不一定是你手上这本（好读多是台湾译本），所以只存不写进书</text>
  <text x="560" y="182" class="s">封面图存在书库条目目录（cover.jpg / cover.png）</text>

  <rect class="box dev" x="540" y="222" width="400" height="164" rx="8"/>
  <text x="560" y="246" class="h">生成的书（booklib build 时补进去）</text>
  <text x="560" y="272">只补书里没有的：</text>
  <text x="560" y="294">内容简介（dc:description）· 标签（dc:subject）· 封面</text>
  <text x="560" y="320" class="s">书名、作者一律用书自己的，不改；正文一个字不动</text>
  <text x="560" y="340" class="s">原件不动：补在生成的副本里</text>
  <text x="560" y="360" class="s">补进去的内容进指纹：meta 找到新东西，下次 build 重建这本</text>

  <path class="l" d="M480 162 C510 162 510 123 538 123" marker-end="url(#a)"/>
  <path class="l" d="M480 269 C510 269 510 150 538 150" marker-end="url(#a)"/>
  <path class="l" d="M740 198 L740 220" marker-end="url(#a)"/>

  <text x="480" y="430" text-anchor="middle" class="s">booklib meta --fetch [--force] [书…]：已经找过的不再找（--force 重找）；找错了用 --clear 去掉</text>
  <text x="480" y="450" text-anchor="middle" class="s">也可以手改文件本身：booklib meta --edit 书.epub --title … --tag … --cover 图（可见文字不变，图片原样）</text>
  <text x="480" y="470" text-anchor="middle" class="s">漫画跳过（CBZ 一律算；EPUB 按优化器同一套判定）：书里的封面就是第一页，按书名搜漫画多半对不上</text>
</svg>
