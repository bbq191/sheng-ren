<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>标称屏幕与真实可阅读范围（按比例缩小 1/5）</title>
  <style>
    .scr{fill:#e9e9e9;stroke:#666;stroke-width:1.2}
    .rd{fill:#d9f0df;stroke:#3f9a5b;stroke-width:1.4}
    .h{font-weight:bold;font-size:14px}
    .s{font-size:12px;fill:#444}
  </style>
  <rect width="900" height="510" fill="#fafafa"/>
  <text x="450" y="24" text-anchor="middle" class="h">灰色 = 标称屏幕　绿色 = 阅读器真正用来显示内容的范围（优化按绿色算）</text>

  <!-- 缩放 1/5；原点对齐各自屏幕左上角 -->
  <!-- Move 954x1696 -> 190.8x339.2 ; readable 842x1455 -> 168.4x291, 水平居中(56px→11.2)，上 35.5pt≈111.8px→22.4 -->
  <g transform="translate(60,50)">
    <rect class="scr" width="190.8" height="339.2" rx="6"/>
    <rect class="rd" x="11.2" y="22.4" width="168.4" height="291"/>
    <text x="95.4" y="165" text-anchor="middle">842 × 1455</text>
    <text x="95.4" y="360" text-anchor="middle" class="h">reMarkable Move（EPUB）</text>
    <text x="95.4" y="378" text-anchor="middle" class="s">屏幕 954 × 1696</text>
    <text x="95.4" y="394" text-anchor="middle" class="s">左右页边距各 56；上下留白固定</text>
    <text x="95.4" y="410" text-anchor="middle" class="s">来源：上游白皮书换算</text>
  </g>

  <!-- Kindle 1272x1696 截图 -> 254.4x339.2 ; readable 1104x1546 -> 220.8x309.2 at (16.8,15) -->
  <g transform="translate(320,50)">
    <rect class="scr" width="254.4" height="339.2" rx="6"/>
    <rect class="rd" x="16.8" y="15" width="220.8" height="309.2"/>
    <text x="127.2" y="165" text-anchor="middle">1104 × 1546</text>
    <text x="127.2" y="360" text-anchor="middle" class="h">Kindle PW12 签名版（AZW3）</text>
    <text x="127.2" y="378" text-anchor="middle" class="s">屏幕标称 1264 × 1680（截图 1272 × 1696）</text>
    <text x="127.2" y="394" text-anchor="middle" class="s">左右各 84，上下各 75（页眉/页脚）</text>
    <text x="127.2" y="410" text-anchor="middle" class="s">窄图靠左 → 漫画必须补白到这个比例</text>
  </g>

  <!-- iReader 1264x1680 -> 252.8x336 ; readable 全屏 -->
  <g transform="translate(620,50)">
    <rect class="scr" width="252.8" height="336" rx="6"/>
    <rect class="rd" x="0" y="0" width="252.8" height="336"/>
    <text x="126.4" y="165" text-anchor="middle">1264 × 1680</text>
    <text x="126.4" y="360" text-anchor="middle" class="h">掌阅 Ocean 5 Pro（EPUB）</text>
    <text x="126.4" y="378" text-anchor="middle" class="s">屏幕 1264 × 1680</text>
    <text x="126.4" y="394" text-anchor="middle" class="s">整页大图铺满整屏（盖住页眉页脚）</text>
    <text x="126.4" y="410" text-anchor="middle" class="s">图文混排时不适用</text>
  </g>

  <text x="450" y="494" text-anchor="middle" class="s">Kindle / 掌阅用"测量书"实测：readable-probe 生成 → 设备上截屏 → readable-measure 读出尺寸。阅读器页边距设置改了就要重量。</text>
</svg>
