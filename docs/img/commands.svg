<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>booklib 各命令读写什么</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker>
  </defs>
  <style>
    .box{stroke-width:1.4}
    .h{font-weight:bold;font-size:15px}
    .s{font-size:12px;fill:#444}
    .cmd{font-family:monospace;font-size:13px;font-weight:bold;fill:#1f3f8f}
    .del{font-family:monospace;font-size:13px;font-weight:bold;fill:#c0392b}
    .l{stroke:#555;stroke-width:1.6;fill:none}
    .ld{stroke:#c0392b;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
  </style>
  <rect width="960" height="545" fill="#fafafa"/>
  <text x="480" y="28" text-anchor="middle" class="h">booklib 各命令读写什么：原件只读，书库只存索引，产物随时能重建</text>

  <!-- 三个主体 -->
  <rect class="box" x="30" y="70" width="230" height="150" rx="10" fill="#eaf7ee" stroke="#3f9a5b"/>
  <text x="145" y="96" text-anchor="middle" class="h">你的书目录（原件）</text>
  <text x="145" y="118" text-anchor="middle" class="s">~/Documents/ereader/books/</text>
  <text x="145" y="140" text-anchor="middle" class="s">EPUB、CBZ</text>
  <text x="145" y="170" text-anchor="middle" class="s">booklib 只读，从不改它</text>
  <text x="145" y="190" text-anchor="middle" class="s">（meta --edit 除外，见下）</text>

  <rect class="box" x="365" y="70" width="230" height="150" rx="10" fill="#fff6e5" stroke="#d69a2b"/>
  <text x="480" y="96" text-anchor="middle" class="h">书库（索引）</text>
  <text x="480" y="118" text-anchor="middle" class="s">~/.local/share/booklib/</text>
  <text x="480" y="140" text-anchor="middle" class="s">每本书一个 meta.json：原件在哪、哈希</text>
  <text x="480" y="160" text-anchor="middle" class="s">找来的简介、标签、封面</text>
  <text x="480" y="180" text-anchor="middle" class="s">生成记录：产物在哪、指纹</text>

  <rect class="box" x="700" y="70" width="230" height="150" rx="10" fill="#eef4ff" stroke="#5b7fd6"/>
  <text x="815" y="96" text-anchor="middle" class="h">产物文件夹</text>
  <text x="815" y="118" text-anchor="middle" class="s">books/ 旁边的 kindle/ ireader/ xochitl/</text>
  <text x="815" y="140" text-anchor="middle" class="s">（add 的书在书库 output/ 里）</text>
  <text x="815" y="170" text-anchor="middle" class="s">你拷到设备上读</text>
  <text x="815" y="190" text-anchor="middle" class="s">删了也能用 sync 重建</text>

  <!-- 原件 → 书库 -->
  <path class="l" d="M262 120 L362 120" marker-end="url(#a)"/>
  <text x="312" y="62" text-anchor="middle" class="cmd">add</text>
  <text x="312" y="80" text-anchor="middle" class="cmd">track + sync</text>
  <text x="312" y="140" text-anchor="middle" class="s">登记索引</text>

  <!-- 书库 → 产物 -->
  <path class="l" d="M597 120 L697 120" marker-end="url(#a)"/>
  <text x="647" y="62" text-anchor="middle" class="cmd">sync</text>
  <text x="647" y="80" text-anchor="middle" class="s">（可选书）</text>
  <text x="647" y="140" text-anchor="middle" class="s">读原件生成</text>
  <path class="l" d="M145 222 C145 262 815 262 815 224" marker-end="url(#a)"/>
  <text x="290" y="276" text-anchor="middle" class="s">生成时读原件（先核对还是入库时那本书）</text>

  <!-- 网络 → 书库 -->
  <rect class="box" x="395" y="320" width="170" height="54" rx="8" fill="#f3eefa" stroke="#8a63c9"/>
  <text x="480" y="342" text-anchor="middle" class="h">网络</text>
  <text x="480" y="361" text-anchor="middle" class="s">豆瓣 · Wikidata · Open Library</text>
  <path class="l" d="M480 320 L480 224" marker-end="url(#a)"/>
  <text x="490" y="306" class="cmd">meta --fetch</text>

  <!-- 删除 -->
  <path class="ld" d="M597 200 L697 200" marker-end="url(#r)"/>
  <text x="647" y="186" text-anchor="middle" class="del">remove</text>
  <text x="647" y="218" text-anchor="middle" class="s">删条目和产物</text>
  <text x="647" y="240" text-anchor="middle" class="s">sync：原件删了的也删</text>

  <!-- meta edit -->
  <rect class="box" x="30" y="405" width="230" height="70" rx="10" fill="#ffffff" stroke="#888"/>
  <text x="145" y="431" text-anchor="middle" class="h">任意一个 EPUB 文件</text>
  <text x="145" y="453" text-anchor="middle" class="s">改的是文件本身，不备份</text>
  <path class="l" d="M290 440 L262 440" marker-end="url(#a)"/>
  <text x="300" y="435" class="cmd">meta --edit 书.epub</text>
  <text x="300" y="455" class="s">查看、改写书名作者简介标签封面；和书库无关</text>
  <text x="300" y="473" class="s">改了跟踪目录里的原件，下次 sync 当新版本入库</text>

  <!-- 只读 -->
  <text x="700" y="425" class="cmd">list · devices</text>
  <text x="700" y="445" class="s">只读：看书库、产物是否最新、有哪些模式</text>
  <text x="700" y="473" class="cmd">dedupe · untrack</text>
  <text x="700" y="493" class="s">整理书库（迁移旧条目、不再跟踪目录）</text>

  <text x="480" y="530" text-anchor="middle" class="s">会改书库的命令同时只能跑一个（.lock）；sync --watch 一直运行，原件有变化才重新生成</text>
</svg>
