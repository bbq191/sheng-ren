<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>生成一本书（booklib build / sync 里每本书、每个阅读模式走一遍）</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .b{fill:#fff;stroke:#999;stroke-width:1.1}
      .q{fill:#fff6e5;stroke:#d69a2b;stroke-width:1.2}
      .w{fill:#eef4ff;stroke:#5b7fd6;stroke-width:1.2}
      .g{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.2}
      .e{fill:#fdecea;stroke:#b2452d;stroke-width:1.2}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12px;fill:#444}
      .l{stroke:#555;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect width="900" height="640" fill="#fafafa"/>

  <rect class="q" x="14" y="14" width="214" height="50" rx="8"/>
  <text x="121" y="34" text-anchor="middle" class="h">先看原件动过没有</text>
  <text x="121" y="52" text-anchor="middle" class="s">动过就核对内容，改过了 → 停下</text>
  <path class="l" d="M228 39 L248 39" marker-end="url(#a)"/>
  <rect class="b" x="250" y="14" width="400" height="50" rx="8"/>
  <text x="450" y="34" text-anchor="middle" class="h">算指纹</text>
  <text x="450" y="52" text-anchor="middle" class="s">原件哈希 · 找来的封面和简介 · 各版本号 · 阅读模式的参数 · 产物格式</text>
  <path class="l" d="M450 64 L450 86" marker-end="url(#a)"/>

  <rect class="q" x="250" y="88" width="400" height="50" rx="8"/>
  <text x="450" y="108" text-anchor="middle" class="h">和生成记录比</text>
  <text x="450" y="126" text-anchor="middle" class="s">output-state/&lt;模式&gt;.json：这本书上次的产物在哪、指纹是什么</text>

  <path class="l" d="M300 138 C300 170 110 160 110 186" marker-end="url(#a)"/>
  <text x="60" y="160" class="s">指纹一样、位置一样</text>
  <rect class="g" x="20" y="188" width="180" height="48" rx="8"/>
  <text x="110" y="208" text-anchor="middle" class="h">= 已是最新</text>
  <text x="110" y="226" text-anchor="middle" class="s">什么都不做</text>

  <path class="l" d="M450 138 L450 186" marker-end="url(#a)"/>
  <text x="458" y="166" class="s">指纹一样、位置变了</text>
  <rect class="g" x="340" y="188" width="220" height="48" rx="8"/>
  <text x="450" y="208" text-anchor="middle" class="h">↪ 挪位置</text>
  <text x="450" y="226" text-anchor="middle" class="s">原件改名移动、书名变了：直接挪过去</text>

  <path class="l" d="M600 138 C600 170 790 160 790 186" marker-end="url(#a)"/>
  <text x="760" y="160" class="s">指纹变了、没有产物</text>
  <rect class="b" x="680" y="188" width="200" height="48" rx="8"/>
  <text x="780" y="208" text-anchor="middle" class="h">先登记新位置</text>
  <text x="780" y="226" text-anchor="middle" class="s">中途打断也认得出、旧的也会删</text>
  <path class="l" d="M780 236 L780 262" marker-end="url(#a)"/>

  <rect class="q" x="560" y="264" width="320" height="62" rx="8"/>
  <text x="720" y="284" text-anchor="middle" class="h">核对原件</text>
  <text x="720" y="302" text-anchor="middle" class="s">大小、修改时间没变 → 直接用；变了 → 重算哈希</text>
  <text x="720" y="318" text-anchor="middle" class="s">内容不一样 → 停下（提示先 sync）</text>
  <path class="l" d="M600 326 L600 342" marker-end="url(#a)"/>
  <rect class="e" x="740" y="336" width="140" height="34" rx="8"/>
  <text x="810" y="358" text-anchor="middle" class="s">✗ 报错，旧产物不动</text>
  <path class="l" d="M810 326 L810 334" marker-end="url(#a)"/>

  <rect class="w" x="100" y="344" width="600" height="50" rx="8"/>
  <text x="400" y="364" text-anchor="middle" class="h">准备要优化的 EPUB（与模式无关，一本书只做一次、几个模式共用）</text>
  <text x="400" y="382" text-anchor="middle" class="s">EPUB 原件直接用；CBZ 当场转成每页一张原图的 EPUB；书里没有的封面、简介、标签补进 OPF</text>
  <path class="l" d="M400 394 L400 414" marker-end="url(#a)"/>

  <rect class="w" x="100" y="416" width="600" height="50" rx="8"/>
  <text x="400" y="436" text-anchor="middle" class="h">按阅读模式优化（bookconv::optimize，三个模式同一套规则）</text>
  <text x="400" y="454" text-anchor="middle" class="s">直接写成目标旁边的临时文件；流式处理，大漫画不整本进内存</text>
  <path class="l" d="M400 466 L400 486" marker-end="url(#a)"/>

  <rect class="w" x="100" y="488" width="290" height="50" rx="8"/>
  <text x="245" y="508" text-anchor="middle" class="h">质量门</text>
  <text x="245" y="526" text-anchor="middle" class="s">没过只警告（⚠），产物照样生成</text>
  <path class="l" d="M390 513 L408 513" marker-end="url(#a)"/>
  <rect class="w" x="410" y="488" width="290" height="50" rx="8"/>
  <text x="555" y="508" text-anchor="middle" class="h">kindle 模式：再转 KFX</text>
  <text x="555" y="526" text-anchor="middle" class="s">书里不写写出器版本：内容没变就逐字节相同</text>
  <path class="l" d="M400 538 L400 558" marker-end="url(#a)"/>

  <rect class="g" x="100" y="560" width="600" height="62" rx="8"/>
  <text x="400" y="580" text-anchor="middle" class="h">✓ 落盘后改名到位，补上指纹，删掉记录里的旧位置</text>
  <text x="400" y="598" text-anchor="middle" class="s">只删生成记录里记着的文件；产物目录里别的文件一概不动</text>
  <text x="400" y="614" text-anchor="middle" class="s">中途失败：临时文件删掉，上一版产物还在</text>
</svg>
