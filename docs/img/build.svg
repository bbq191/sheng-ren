<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>生成一本书并传到设备（booklib sync 时每本书、每台接着的设备走一遍）</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .b{fill:#fff;stroke:#999;stroke-width:1.1}
      .q{fill:#fff6e5;stroke:#d69a2b;stroke-width:1.2}
      .w{fill:#eef4ff;stroke:#5b7fd6;stroke-width:1.2}
      .g{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.2}
      .e{fill:#fdecea;stroke:#b2452d;stroke-width:1.2}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12px;fill:#444}
      .l{stroke:#555;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect width="900" height="720" fill="#fafafa"/>

  <rect class="q" x="250" y="14" width="400" height="50" rx="8"/>
  <text x="450" y="34" text-anchor="middle" class="h">这台设备接上了吗</text>
  <text x="450" y="52" text-anchor="middle" class="s">sync 开头每台看一次；接上的先删掉以前删书时没删成的</text>
  <path class="l" d="M650 39 L678 39" marker-end="url(#a)"/>
  <rect class="b" x="680" y="14" width="200" height="50" rx="8"/>
  <text x="780" y="34" text-anchor="middle" class="h">没接上：这台整个跳过</text>
  <text x="780" y="52" text-anchor="middle" class="s">不算失败，下次接上再传</text>
  <path class="l" d="M450 64 L450 86" marker-end="url(#a)"/>

  <rect class="q" x="250" y="88" width="400" height="50" rx="8"/>
  <text x="450" y="108" text-anchor="middle" class="h">先看原件动过没有</text>
  <text x="450" y="126" text-anchor="middle" class="s">大小、修改时间变了 → 重算哈希核对内容</text>
  <path class="l" d="M650 113 L678 113" marker-end="url(#a)"/>
  <rect class="e" x="680" y="88" width="200" height="50" rx="8"/>
  <text x="780" y="108" text-anchor="middle" class="h">✗ 内容改过了：停下</text>
  <text x="780" y="126" text-anchor="middle" class="s">旧产物不动（提示先 sync）</text>
  <path class="l" d="M450 138 L450 160" marker-end="url(#a)"/>

  <rect class="b" x="250" y="162" width="400" height="50" rx="8"/>
  <text x="450" y="182" text-anchor="middle" class="h">算指纹</text>
  <text x="450" y="200" text-anchor="middle" class="s">原件哈希 · 找来的封面和简介 · 各版本号 · 模式的参数 · 产物格式</text>
  <path class="l" d="M450 212 L450 234" marker-end="url(#a)"/>

  <rect class="q" x="250" y="236" width="400" height="50" rx="8"/>
  <text x="450" y="256" text-anchor="middle" class="h">和生成记录比</text>
  <text x="450" y="274" text-anchor="middle" class="s">output-state/&lt;模式&gt;.json：这本书在设备上的位置（Move 上是 uuid）、指纹</text>

  <path class="l" d="M290 286 L114 328" marker-end="url(#a)"/>
  <path class="l" d="M390 286 L336 328" marker-end="url(#a)"/>
  <path class="l" d="M510 286 L558 328" marker-end="url(#a)"/>
  <path class="l" d="M610 286 L780 328" marker-end="url(#a)"/>

  <rect class="g" x="14" y="330" width="200" height="66" rx="8"/>
  <text x="114" y="350" text-anchor="middle" class="h">= 已是最新</text>
  <text x="114" y="368" text-anchor="middle" class="s">指纹一样、位置一样</text>
  <text x="114" y="386" text-anchor="middle" class="s">什么都不做</text>

  <rect class="g" x="236" y="330" width="200" height="66" rx="8"/>
  <text x="336" y="350" text-anchor="middle" class="h">= 认领</text>
  <text x="336" y="368" text-anchor="middle" class="s">指纹一样、记录里的位置空了，</text>
  <text x="336" y="386" text-anchor="middle" class="s">设备上同名文件就是那份 → 不生成</text>

  <rect class="g" x="458" y="330" width="200" height="66" rx="8"/>
  <text x="558" y="350" text-anchor="middle" class="h">↪ 挪位置</text>
  <text x="558" y="368" text-anchor="middle" class="s">指纹一样、位置变了</text>
  <text x="558" y="386" text-anchor="middle" class="s">直接挪（Move 是加新删旧）</text>

  <rect class="b" x="680" y="330" width="206" height="66" rx="8"/>
  <text x="783" y="350" text-anchor="middle" class="h">要生成</text>
  <text x="783" y="368" text-anchor="middle" class="s">指纹变了、没有产物、--force</text>
  <text x="783" y="386" text-anchor="middle" class="s">换位置先登记，打断也认得出</text>
  <path class="l" d="M783 396 C783 412 450 404 450 422" marker-end="url(#a)"/>

  <rect class="w" x="100" y="424" width="700" height="50" rx="8"/>
  <text x="450" y="444" text-anchor="middle" class="h">准备要优化的 EPUB（与模式无关，一本书只做一次、几个模式共用）</text>
  <text x="450" y="462" text-anchor="middle" class="s">EPUB 原件直接用；CBZ 当场转成每页一张原图的 EPUB；书里没有的封面、简介、标签补进 OPF</text>
  <path class="l" d="M450 474 L450 494" marker-end="url(#a)"/>

  <rect class="w" x="100" y="496" width="700" height="50" rx="8"/>
  <text x="450" y="516" text-anchor="middle" class="h">按这个模式的 profile 优化（bookconv::optimize）</text>
  <text x="450" y="534" text-anchor="middle" class="s">写进书库的临时目录；流式处理，大漫画不整本进内存</text>
  <path class="l" d="M450 546 L450 566" marker-end="url(#a)"/>

  <rect class="w" x="100" y="568" width="340" height="50" rx="8"/>
  <text x="270" y="588" text-anchor="middle" class="h">质量门</text>
  <text x="270" y="606" text-anchor="middle" class="s">没过只警告（⚠），产物照样生成</text>
  <path class="l" d="M440 593 L458 593" marker-end="url(#a)"/>
  <rect class="w" x="460" y="568" width="340" height="50" rx="8"/>
  <text x="630" y="588" text-anchor="middle" class="h">kindle 模式：再转 KFX</text>
  <text x="630" y="606" text-anchor="middle" class="s">书里不写写出器版本：内容没变就逐字节相同</text>
  <path class="l" d="M450 618 L450 638" marker-end="url(#a)"/>

  <rect class="g" x="100" y="640" width="700" height="66" rx="8"/>
  <text x="450" y="660" text-anchor="middle" class="h">✓ 传上设备，补上指纹，删掉旧位置</text>
  <text x="450" y="678" text-anchor="middle" class="s">和上次传的一样（看哈希）→ ≡ 不再传；MTP 上相同字节不拷；Move 原地替换（sync 里由这台的传输线程做）</text>
  <text x="450" y="696" text-anchor="middle" class="s">只删生成记录里记着的，设备上别的书一概不动；中途失败：临时文件删掉，上一版产物还在</text>
</svg>
