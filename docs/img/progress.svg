<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>重新生成后覆盖设备上的旧文件，三台阅读器的进度保不保留（2026-10-06 真机）</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .dev{fill:#f3eefa;stroke:#8a63c9;stroke-width:1.3}
      .q{fill:#fff;stroke:#888;stroke-width:1.2}
      .ok{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.2}
      .no{fill:#fdecea;stroke:#b2452d;stroke-width:1.2}
      .na{fill:#f4f4f4;stroke:#999;stroke-width:1.2;stroke-dasharray:5 4}
      .h{font-weight:bold;font-size:15px}
      .s{font-size:12.5px;fill:#444}
      .y{font-size:12px;fill:#2a7a3f;font-weight:bold}
      .n{font-size:12px;fill:#a33;font-weight:bold}
      .l{stroke:#555;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="980" height="400" fill="#ffffff"/>

  <!-- Kindle -->
  <rect class="dev" x="20" y="16" width="300" height="54" rx="8"/>
  <text x="170" y="40" text-anchor="middle" class="h">Kindle 自带阅读器</text>
  <text x="170" y="60" text-anchor="middle" class="s">sync 覆盖 documents/ 里的 .kfx</text>
  <path class="l" d="M170 70 L170 92" marker-end="url(#a)"/>
  <rect class="q" x="60" y="94" width="220" height="40" rx="20"/>
  <text x="170" y="119" text-anchor="middle">新旧文件逐字节相同？</text>
  <path class="l" d="M120 134 C110 150 90 150 90 166" marker-end="url(#a)"/>
  <path class="l" d="M220 134 C230 150 250 150 250 166" marker-end="url(#a)"/>
  <text x="96" y="154" text-anchor="end" class="y">是</text>
  <text x="246" y="154" class="n">否</text>
  <rect class="ok" x="24" y="168" width="134" height="62" rx="8"/>
  <text x="91" y="194" text-anchor="middle" class="h">进度保留</text>
  <text x="91" y="216" text-anchor="middle" class="s">《啸风山庄》</text>
  <rect class="no" x="182" y="168" width="134" height="62" rx="8"/>
  <text x="249" y="194" text-anchor="middle" class="h">进度清零</text>
  <text x="249" y="216" text-anchor="middle" class="s">只差一个版本号也是</text>

  <!-- 掌阅 -->
  <rect class="dev" x="340" y="16" width="300" height="54" rx="8"/>
  <text x="490" y="40" text-anchor="middle" class="h">掌阅自带阅读器</text>
  <text x="490" y="60" text-anchor="middle" class="s">sync 覆盖 documents/ 里的 .epub</text>
  <path class="l" d="M490 70 L490 166" marker-end="url(#a)"/>
  <text x="500" y="122" class="s">字节变了也一样</text>
  <rect class="ok" x="400" y="168" width="180" height="62" rx="8"/>
  <text x="490" y="194" text-anchor="middle" class="h">进度保留</text>
  <text x="490" y="216" text-anchor="middle" class="s">《罗杰疑案》两次覆盖</text>

  <!-- Move -->
  <rect class="dev" x="660" y="16" width="300" height="54" rx="8"/>
  <text x="810" y="40" text-anchor="middle" class="h">Move 自带阅读器（xochitl）</text>
  <text x="810" y="60" text-anchor="middle" class="s">sync 经书架服务按 uuid 原地替换</text>
  <path class="l" d="M810 70 L810 166" marker-end="url(#a)"/>
  <rect class="no" x="720" y="168" width="180" height="62" rx="8"/>
  <text x="810" y="194" text-anchor="middle" class="h">进度回到开头</text>
  <text x="810" y="216" text-anchor="middle" class="s">新内容显示正常（《绍宋》）</text>

  <!-- 我们怎么配合 -->
  <rect class="q" x="20" y="256" width="940" height="128" rx="10"/>
  <text x="36" y="282" class="h">所以生成时这样做</text>
  <text x="36" y="308" class="s">· KFX 里不写写出器版本（创建器版本固定写 1），唯一 ID 重建不变：只升了版本号、内容没变的书，重建出来逐字节相同，Kindle 进度保住。</text>
  <text x="36" y="330" class="s">· 内容真变了（规则改了正文、换了封面）的书，覆盖到 Kindle 上进度清零，躲不开。</text>
  <text x="36" y="352" class="s">· EPUB 照旧在 META-INF/eink-optimized 里记优化器版本（掌阅不受影响）。</text>
  <text x="36" y="374" class="s">· 产物文件名不变（除非书名变了），设备上靠覆盖同名文件更新；sync 生成出来和设备上那份逐字节相同就不再传。</text>
</svg>
