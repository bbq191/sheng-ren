<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 655" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>sync 怎么边生成边传：主线程、各设备的传输线程</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .b{fill:#fff;stroke:#999;stroke-width:1.1}
      .q{fill:#fff6e5;stroke:#d69a2b;stroke-width:1.2}
      .w{fill:#eef4ff;stroke:#5b7fd6;stroke-width:1.2}
      .g{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.2}
      .e{fill:#fdecea;stroke:#b2452d;stroke-width:1.2}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12px;fill:#444}
      .l{stroke:#555;stroke-width:1.3;fill:none}
      .d{stroke:#555;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="720" height="655" fill="#fafafa"/>

  <text x="185" y="30" text-anchor="middle" class="h">主线程：比较、生成、记录</text>
  <text x="530" y="30" text-anchor="middle" class="h">每台设备一条传输线程</text>

  <!-- 主线程 -->
  <rect class="b" x="30" y="50" width="310" height="56" rx="8"/>
  <text x="185" y="72" text-anchor="middle" class="h">每本书 × 每台接着的设备</text>
  <text x="185" y="92" text-anchor="middle" class="s">书在外层、设备在内层：中间文件一本书只做一次</text>
  <path class="l" d="M185 106 L185 126" marker-end="url(#a)"/>

  <rect class="g" x="30" y="128" width="310" height="56" rx="8"/>
  <text x="185" y="150" text-anchor="middle" class="h">先取回传完的（有就取，不等）</text>
  <text x="185" y="170" text-anchor="middle" class="s">complete：写生成记录、删旧位置（记录只在这里改）</text>
  <path class="l" d="M185 184 L185 204" marker-end="url(#a)"/>

  <rect class="q" x="30" y="206" width="310" height="56" rx="8"/>
  <text x="185" y="228" text-anchor="middle" class="h">这台还有空吗？</text>
  <text x="185" y="248" text-anchor="middle" class="s">每台在传（含排队）最多 2 本</text>
  <path class="l" d="M185 262 L185 282" marker-end="url(#a)"/>
  <text x="193" y="277" class="s">有空</text>
  <path class="l" d="M30 234 L24 234 L24 468 L28 468" marker-end="url(#a)"/>
  <text x="20" y="351" class="s" transform="rotate(-90 20 351)" text-anchor="middle">满了：先做别的设备</text>

  <rect class="w" x="30" y="284" width="310" height="56" rx="8"/>
  <text x="185" y="306" text-anchor="middle" class="h">prepare：比较，要的话生成</text>
  <text x="185" y="326" text-anchor="middle" class="s">没变 → 跳过或认领；变了 → 生成到书库临时目录</text>
  <path class="l" d="M185 340 L185 360" marker-end="url(#a)"/>

  <rect class="w" x="30" y="362" width="310" height="56" rx="8"/>
  <text x="185" y="384" text-anchor="middle" class="h">交给这台的传输线程（submit）</text>
  <text x="185" y="404" text-anchor="middle" class="s">不等它传完，回到第一步做下一件</text>

  <rect class="q" x="30" y="440" width="310" height="56" rx="8"/>
  <text x="185" y="462" text-anchor="middle" class="h">都过了一遍：补做留下的</text>
  <text x="185" y="482" text-anchor="middle" class="s">等那台空出来再交</text>
  <path class="l" d="M185 496 L185 516" marker-end="url(#a)"/>

  <rect class="g" x="30" y="518" width="310" height="56" rx="8"/>
  <text x="185" y="540" text-anchor="middle" class="h">「… 等设备那边传完」</text>
  <text x="185" y="560" text-anchor="middle" class="s">取回剩下的结果，记下来、每本报一行</text>

  <!-- 交给各条线程 -->
  <path class="l" d="M340 390 C370 390 370 110 398 110" marker-end="url(#a)"/>
  <path class="l" d="M340 390 C375 390 375 210 398 210" marker-end="url(#a)"/>

  <!-- 传输线程 -->
  <rect class="w" x="400" y="70" width="260" height="80" rx="8"/>
  <text x="530" y="92" text-anchor="middle" class="h">Kindle 线程</text>
  <text x="530" y="112" text-anchor="middle" class="s">一本一本拷（MTP，1MB 一块）</text>
  <text x="530" y="130" text-anchor="middle" class="s">直接写正式文件名，逐字节相同的不拷</text>

  <rect class="w" x="400" y="170" width="260" height="80" rx="8"/>
  <text x="530" y="192" text-anchor="middle" class="h">掌阅线程</text>
  <text x="530" y="212" text-anchor="middle" class="s">同 Kindle</text>

  <!-- 结果队列 -->
  <rect class="g" x="400" y="440" width="260" height="70" rx="8"/>
  <text x="530" y="462" text-anchor="middle" class="h">结果队列</text>
  <text x="530" y="482" text-anchor="middle" class="s">传完一本（成功或失败）、</text>
  <text x="530" y="499" text-anchor="middle" class="s">线程意外退出（那几本算没传成）</text>
  <path class="l" d="M660 110 L690 110 L690 475 L662 475" marker-end="url(#a)"/>
  <path class="l" d="M660 210 L690 210"/>
  <path class="l" d="M400 490 L342 490" marker-end="url(#a)"/>
  <path class="d" d="M400 455 L372 455 L372 156 L342 156" marker-end="url(#a)"/>
  <text x="378" y="434" class="s">取回</text>
  <path class="l" d="M530 510 L530 546 L342 546" marker-end="url(#a)"/>

  <rect class="e" x="20" y="590" width="680" height="50" rx="8"/>
  <text x="360" y="610" text-anchor="middle" class="h">中途 Ctrl+C</text>
  <text x="360" y="628" text-anchor="middle" class="s">没传完的记录不改，下次 sync 重做；设备上留下的半截文件下次认得出、重传</text>
</svg>
