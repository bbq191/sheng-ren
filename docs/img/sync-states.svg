<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 644" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>sync 遇到各种文件变化时怎么做</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>.h{font-weight:bold;font-size:15px} .s{font-size:12px;fill:#555}</style>
  </defs>
  <rect width="1000" height="644" fill="#ffffff"/>
  <text x="170" y="40" text-anchor="middle" class="h">跟踪目录里的 .epub / .cbz 发生了什么</text>
  <text x="680" y="40" text-anchor="middle" class="h">sync 怎么处理</text>
  <rect x="20" y="70" width="300" height="40" rx="6" fill="#eef4ff" stroke="#5b7fd6" stroke-width="1.2"/>
  <text x="34" y="95">新文件</text>
  <path d="M320 90 L378 90" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="380" y="70" width="600" height="40" rx="6" fill="#eaf7ee" stroke="#3f9a5b" stroke-width="1.2"/>
  <text x="394" y="95">入库</text>
  <rect x="20" y="118" width="300" height="40" rx="6" fill="#eef4ff" stroke="#5b7fd6" stroke-width="1.2"/>
  <text x="34" y="143">大小、修改时间都没变</text>
  <path d="M320 138 L378 138" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="380" y="118" width="600" height="40" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.2"/>
  <text x="394" y="143">跳过，不读内容（所以反复 sync 很快）</text>
  <rect x="20" y="166" width="300" height="58" rx="6" fill="#eef4ff" stroke="#5b7fd6" stroke-width="1.2"/>
  <text x="34" y="191">内容变了</text>
  <path d="M320 186 L378 186" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="380" y="166" width="600" height="58" rx="6" fill="#eaf7ee" stroke="#3f9a5b" stroke-width="1.2"/>
  <text x="394" y="191">入库新版本，旧条目删掉；设备上那份交给新版本，生成后原地换新</text>
  <text x="394" y="210" class="s">新版本入库失败：旧版本继续保留、继续跟踪；旧版本删不掉：下次再删</text>
  <rect x="20" y="232" width="300" height="40" rx="6" fill="#eef4ff" stroke="#5b7fd6" stroke-width="1.2"/>
  <text x="34" y="257">改名、移动（还在跟踪目录里）</text>
  <path d="M320 252 L378 252" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="380" y="232" width="600" height="40" rx="6" fill="#eaf7ee" stroke="#3f9a5b" stroke-width="1.2"/>
  <text x="394" y="257">按内容认出来，不重复入库；产物跟着挪</text>
  <rect x="20" y="280" width="300" height="58" rx="6" fill="#eef4ff" stroke="#5b7fd6" stroke-width="1.2"/>
  <text x="34" y="305">删掉了</text>
  <path d="M320 300 L378 300" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="380" y="280" width="600" height="58" rx="6" fill="#eaf7ee" stroke="#3f9a5b" stroke-width="1.2"/>
  <text x="394" y="305">连同产物从书库删掉（原件不动；--keep：这一次只报告）</text>
  <text x="394" y="324" class="s">同一本书还有一份：改记那份，不算删了；add 进来、原件在跟踪目录外的：不删</text>
  <rect x="20" y="346" width="300" height="40" rx="6" fill="#eef4ff" stroke="#5b7fd6" stroke-width="1.2"/>
  <text x="34" y="371">正在写入（读的时候大小变了）</text>
  <path d="M320 366 L378 366" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="380" y="346" width="600" height="40" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.2"/>
  <text x="394" y="371">这次跳过，下次再看</text>
  <rect x="20" y="394" width="300" height="40" rx="6" fill="#eef4ff" stroke="#5b7fd6" stroke-width="1.2"/>
  <text x="34" y="419">入库失败（DRM、文件坏了）</text>
  <path d="M320 414 L378 414" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="380" y="394" width="600" height="40" rx="6" fill="#fdecea" stroke="#b2452d" stroke-width="1.2"/>
  <text x="394" y="419">报一次错；文件没变就先不重试，升级 booklib 或过一小时再试</text>
  <rect x="20" y="442" width="300" height="40" rx="6" fill="#eef4ff" stroke="#5b7fd6" stroke-width="1.2"/>
  <text x="34" y="467">文件名不是 UTF-8</text>
  <path d="M320 462 L378 462" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="380" y="442" width="600" height="40" rx="6" fill="#fdecea" stroke="#b2452d" stroke-width="1.2"/>
  <text x="394" y="467">报错、不入库（改名后下次入库）</text>
  <rect x="20" y="490" width="300" height="58" rx="6" fill="#eef4ff" stroke="#5b7fd6" stroke-width="1.2"/>
  <text x="34" y="515">目录读不了（没有读或进入权限）</text>
  <path d="M320 510 L378 510" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="380" y="490" width="600" height="58" rx="6" fill="#fdecea" stroke="#b2452d" stroke-width="1.2"/>
  <text x="394" y="515">✗ 报出来，退出码 2；里面已登记的书原样保留、不删</text>
  <text x="394" y="534" class="s">汇总多一项"读不了的目录 N"；--watch 时同一个目录只报一次</text>
  <rect x="20" y="556" width="300" height="40" rx="6" fill="#eef4ff" stroke="#5b7fd6" stroke-width="1.2"/>
  <text x="34" y="581">整个跟踪目录不在（U 盘没插）</text>
  <path d="M320 576 L378 576" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="380" y="556" width="600" height="40" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.2"/>
  <text x="394" y="581">什么都不动</text>
  <text x="20" y="622" class="s">绿 = 书库跟着变　灰 = 不动　红 = 出错（报出来，不影响别的书）</text>
</svg>
