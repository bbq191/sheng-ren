<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 282" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>原件换了内容时设备上那份怎么原地换新（2026-10-09）</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .b{fill:#fff;stroke:#999;stroke-width:1.1}
      .q{fill:#fff6e5;stroke:#d69a2b;stroke-width:1.2}
      .w{fill:#eef4ff;stroke:#5b7fd6;stroke-width:1.2}
      .g{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.2}
      .dev{fill:#f3eefa;stroke:#8a63c9;stroke-width:1.3}
      .na{fill:#f4f4f4;stroke:#999;stroke-width:1.1;stroke-dasharray:5 4}
      .t{font-weight:bold;font-size:15px}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12px;fill:#444}
      .l{stroke:#555;stroke-width:1.3;fill:none}
      .d{stroke:#555;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
      .life{stroke:#aaa;stroke-width:1.2;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1000" height="282" fill="#fafafa"/>

  <!-- 上半：原件换了内容 -->
  <text x="20" y="30" class="t">原件换了内容（同一个路径）：设备上那份交给新版本，原地换新</text>

  <rect class="w" x="20" y="50" width="220" height="78" rx="8"/>
  <text x="130" y="74" text-anchor="middle" class="h">sync 第一步：同步</text>
  <text x="130" y="96" text-anchor="middle" class="s">大小、修改时间变了，重算哈希</text>
  <text x="130" y="114" text-anchor="middle" class="s">内容不一样 → 当新版本入库</text>
  <path class="l" d="M240 89 L268 89" marker-end="url(#a)"/>

  <rect class="q" x="270" y="50" width="230" height="78" rx="8"/>
  <text x="385" y="74" text-anchor="middle" class="h">hand_over_outputs</text>
  <text x="385" y="96" text-anchor="middle" class="s">旧条目在各设备上的生成记录</text>
  <text x="385" y="114" text-anchor="middle" class="s">交给新条目，指纹留空；旧条目删掉</text>
  <path class="l" d="M500 89 L528 89" marker-end="url(#a)"/>

  <rect class="w" x="530" y="50" width="200" height="78" rx="8"/>
  <text x="630" y="74" text-anchor="middle" class="h">sync 第二步：生成</text>
  <text x="630" y="96" text-anchor="middle" class="s">指纹空 = 要重新生成</text>
  <text x="630" y="114" text-anchor="middle" class="s">生成新版本、过质量门</text>
  <path class="l" d="M730 89 L758 89" marker-end="url(#a)"/>

  <rect class="g" x="760" y="52" width="220" height="74" rx="8"/>
  <text x="870" y="74" text-anchor="middle" class="h">Kindle、掌阅（MTP）</text>
  <text x="870" y="94" text-anchor="middle" class="s">覆盖同一个文件名</text>
  <text x="870" y="112" text-anchor="middle" class="s">逐字节相同的不拷</text>

  <rect class="na" x="20" y="150" width="960" height="60" rx="8"/>
  <text x="34" y="174" class="s">以前（2026-10-09 前）：先删旧产物，再当新书传——掌阅丢进度，新版本生成失败时设备上这本就没了。</text>
  <text x="34" y="194" class="s">新条目在这台设备上已经有自己的产物（同样内容早就在库里）时不交，旧的照常删。</text>

  <rect class="b" x="20" y="222" width="960" height="44" rx="8"/>
  <text x="34" y="249" class="s">MTP 上直接写正式文件名（原版 jmtpfs 的改名是整份下载再上传）：写之前先在生成记录里登记一条指纹留空的，写到一半被打断，下次 sync 认得出、重传。</text>

</svg>
