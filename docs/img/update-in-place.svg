<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>原件换了内容时设备上那份怎么原地换新；Move 原地替换与阅读进度找回（2026-10-09）</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .b{fill:#fff;stroke:#999;stroke-width:1.1}
      .q{fill:#fff6e5;stroke:#d69a2b;stroke-width:1.2}
      .w{fill:#eef4ff;stroke:#5b7fd6;stroke-width:1.2}
      .g{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.2}
      .dev{fill:#f3eefa;stroke:#8a63c9;stroke-width:1.3}
      .na{fill:#f4f4f4;stroke:#999;stroke-width:1.1;stroke-dasharray:5 4}
      .t{font-weight:bold;font-size:15px}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12px;fill:#444}
      .l{stroke:#555;stroke-width:1.3;fill:none}
      .d{stroke:#555;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
      .life{stroke:#aaa;stroke-width:1.2;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1000" height="790" fill="#fafafa"/>

  <!-- 上半：原件换了内容 -->
  <text x="20" y="30" class="t">① 原件换了内容（同一个路径）：设备上那份交给新版本，原地换新</text>

  <rect class="w" x="20" y="50" width="220" height="78" rx="8"/>
  <text x="130" y="74" text-anchor="middle" class="h">sync 第一步：同步</text>
  <text x="130" y="96" text-anchor="middle" class="s">大小、修改时间变了，重算哈希</text>
  <text x="130" y="114" text-anchor="middle" class="s">内容不一样 → 当新版本入库</text>
  <path class="l" d="M240 89 L268 89" marker-end="url(#a)"/>

  <rect class="q" x="270" y="50" width="230" height="78" rx="8"/>
  <text x="385" y="74" text-anchor="middle" class="h">hand_over_outputs</text>
  <text x="385" y="96" text-anchor="middle" class="s">旧条目在各设备上的生成记录</text>
  <text x="385" y="114" text-anchor="middle" class="s">交给新条目，指纹留空；旧条目删掉</text>
  <path class="l" d="M500 89 L528 89" marker-end="url(#a)"/>

  <rect class="w" x="530" y="50" width="200" height="78" rx="8"/>
  <text x="630" y="74" text-anchor="middle" class="h">sync 第二步：生成</text>
  <text x="630" y="96" text-anchor="middle" class="s">指纹空 = 要重新生成</text>
  <text x="630" y="114" text-anchor="middle" class="s">生成新版本、过质量门</text>
  <path class="l" d="M730 80 C745 80 745 64 758 64" marker-end="url(#a)"/>
  <path class="l" d="M730 98 C745 98 745 146 758 146" marker-end="url(#a)"/>

  <rect class="g" x="760" y="30" width="220" height="74" rx="8"/>
  <text x="870" y="52" text-anchor="middle" class="h">Kindle、掌阅（MTP）</text>
  <text x="870" y="72" text-anchor="middle" class="s">覆盖同一个文件名</text>
  <text x="870" y="90" text-anchor="middle" class="s">逐字节相同的不拷</text>

  <rect class="g" x="760" y="112" width="220" height="74" rx="8"/>
  <text x="870" y="134" text-anchor="middle" class="h">Move</text>
  <text x="870" y="154" text-anchor="middle" class="s">按记录里的 uuid 原地替换</text>
  <text x="870" y="172" text-anchor="middle" class="s">同一本书、同一个文件夹（见 ②）</text>

  <rect class="na" x="20" y="150" width="710" height="60" rx="8"/>
  <text x="34" y="174" class="s">以前（2026-10-09 前）：先删旧产物（Move 上进回收站），再当新书传——掌阅丢进度、Move 回收站里多一本，</text>
  <text x="34" y="194" class="s">新版本生成失败时设备上这本就没了。新条目在这台设备上已经有自己的产物（同样内容早就在库里）时不交，旧的照常删。</text>

  <rect class="b" x="20" y="222" width="960" height="44" rx="8"/>
  <text x="34" y="249" class="s">MTP 上直接写正式文件名（原版 jmtpfs 的改名是整份下载再上传）：写之前先在生成记录里登记一条指纹留空的，写到一半被打断，下次 sync 认得出、重传。</text>

  <!-- 下半：Move 原地替换时序 -->
  <text x="20" y="306" class="t">② Move 原地替换与阅读进度找回（书架服务的部分在它自己的仓库里）</text>

  <rect class="w" x="40" y="322" width="160" height="40" rx="8"/>
  <text x="120" y="347" text-anchor="middle" class="h">booklib 传输线程</text>
  <rect class="q" x="320" y="322" width="160" height="40" rx="8"/>
  <text x="400" y="347" text-anchor="middle" class="h">书架服务</text>
  <rect class="dev" x="600" y="322" width="160" height="40" rx="8"/>
  <text x="680" y="347" text-anchor="middle" class="h">xochitl</text>
  <rect class="b" x="820" y="322" width="160" height="40" rx="8"/>
  <text x="900" y="347" text-anchor="middle" class="h">你（读者）</text>

  <path class="life" d="M120 362 L120 730"/>
  <path class="life" d="M400 362 L400 730"/>
  <path class="life" d="M680 362 L680 730"/>
  <path class="life" d="M900 362 L900 730"/>

  <!-- 1 交书 -->
  <text x="260" y="394" text-anchor="middle" class="s">POST /import?uuid=…（新版本 EPUB）</text>
  <path class="l" d="M120 402 L398 402" marker-end="url(#a)"/>
  <!-- 正在替换 -->
  <rect class="b" x="130" y="414" width="262" height="58" rx="6"/>
  <text x="140" y="434" class="s">回 409（旧版 400）「正在替换」：上一次的</text>
  <text x="140" y="451" class="s">还没做完 → 轮询 GET /import/&lt;uuid&gt; 的</text>
  <text x="140" y="468" class="s">replacing，做完再交（最多等 30 分钟）</text>

  <!-- 2 快照 -->
  <rect class="q" x="410" y="420" width="250" height="44" rx="6"/>
  <text x="420" y="438" class="s">替换前给阅读位置拍快照：</text>
  <text x="420" y="456" class="s">所在 spine 文件 + 文件内的比例</text>

  <!-- 3 换文件 -->
  <text x="540" y="494" text-anchor="middle" class="s">换掉 &lt;uuid&gt;.epub（书开着就先关掉）</text>
  <path class="l" d="M400 502 L678 502" marker-end="url(#a)"/>

  <!-- 4 任务完成 -->
  <text x="260" y="534" text-anchor="middle" class="s">任务号；GET /import/jobs/&lt;号&gt; 查到 done</text>
  <path class="d" d="M398 542 L122 542" marker-end="url(#a)"/>
  <text x="130" y="562" class="s">→ 主线程写生成记录（uuid 不变）</text>

  <!-- 5 打开 -->
  <text x="790" y="594" text-anchor="middle" class="s">打开这本书</text>
  <path class="l" d="M900 602 L682 602" marker-end="url(#a)"/>

  <!-- 6 重排 -->
  <rect class="dev" x="690" y="614" width="200" height="44" rx="6"/>
  <text x="700" y="632" class="s">整本重新排版（显示新内容），</text>
  <text x="700" y="650" class="s">进度落回开头附近</text>

  <!-- 7 跳回 -->
  <text x="540" y="684" text-anchor="middle" class="s">等新的 .epubindex 写出 → 跳回快照的位置</text>
  <path class="l" d="M400 692 L678 692" marker-end="url(#a)"/>
  <text x="410" y="712" class="s">（书架服务的 qmd 补丁；约 60 秒没写出就放弃）</text>

  <rect class="b" x="20" y="740" width="960" height="40" rx="8"/>
  <text x="34" y="765" class="s">2026-10-09《绍宋》真机一次 ✓（跳回第 15 页）。文件里内容增删多时会偏几页；封面缩略图不刷新。加新删旧同样丢进度，还丢文件夹，所以仍原地替换。</text>
</svg>
