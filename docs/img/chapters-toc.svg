<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>按目录层级定书/卷、章、节（只管目录，不拆文件）</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .q{fill:#fff6e5;stroke:#d69a2b;stroke-width:1.3}
      .bk{fill:#f3eefa;stroke:#8a63c9;stroke-width:1.3}
      .ch{fill:#eef4ff;stroke:#5b7fd6;stroke-width:1.3}
      .sec{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.3}
      .no{fill:#f4f4f4;stroke:#999;stroke-width:1.2}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12.5px;fill:#444}
      .y{font-size:12px;fill:#2a7a3f;font-weight:bold}
      .n{font-size:12px;fill:#a33;font-weight:bold}
      .l{stroke:#555;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>

  <!-- 起点 -->
  <rect class="q" x="230" y="14" width="520" height="70" rx="10"/>
  <text x="490" y="42" text-anchor="middle" class="h">目录最上一层是一本本书或部、卷吗？</text>
  <text x="490" y="62" text-anchor="middle" class="s">带子条目的至少两条，且①多数像「第X部/卷」，或②本层不像章、</text>
  <text x="490" y="76" text-anchor="middle" class="s">下一层多数像「第X章/回/部」，或③本层不像章、第三层分在两本书以上</text>

  <!-- 是 -->
  <path class="l" d="M380 82 L230 130" marker-end="url(#a)"/>
  <text x="270" y="104" class="y">是：合集</text>
  <rect class="bk" x="40" y="132" width="340" height="62" rx="8"/>
  <text x="210" y="156" text-anchor="middle" class="h">第一层 = 书/卷</text>
  <text x="210" y="178" text-anchor="middle" class="s">第二层 = 章，第三层 = 节</text>

  <!-- 否 -->
  <path class="l" d="M600 82 L750 130" marker-end="url(#a)"/>
  <text x="680" y="104" class="n">否：普通书</text>
  <rect class="ch" x="600" y="132" width="340" height="62" rx="8"/>
  <text x="770" y="156" text-anchor="middle" class="h">第一层 = 章</text>
  <text x="770" y="178" text-anchor="middle" class="s">第二层 = 节</text>

  <!-- 汇合 -->
  <path class="l" d="M210 194 L210 232 L470 252" marker-end="url(#a)"/>
  <path class="l" d="M770 194 L770 232 L510 252" marker-end="url(#a)"/>
  <rect class="q" x="250" y="254" width="480" height="58" rx="10"/>
  <text x="490" y="278" text-anchor="middle" class="h">在正文里找每条目录的标题块</text>
  <text x="490" y="298" text-anchor="middle" class="s">标题元素或几个连续段落拼成目录文字（《绍宋》装饰图 + 「第一章」+「明道宫」）</text>

  <!-- 四种结果 -->
  <path class="l" d="M330 312 L120 362" marker-end="url(#a)"/>
  <path class="l" d="M440 312 L370 362" marker-end="url(#a)"/>
  <path class="l" d="M540 312 L610 362" marker-end="url(#a)"/>
  <path class="l" d="M650 312 L860 362" marker-end="url(#a)"/>

  <rect class="bk" x="20" y="364" width="220" height="92" rx="8"/>
  <text x="130" y="388" text-anchor="middle" class="h">书/卷、挂着章的「第X部」</text>
  <text x="130" y="410" text-anchor="middle" class="s">目录里最外层</text>
  <text x="130" y="430" text-anchor="middle" class="s">章挂在它下面</text>

  <rect class="ch" x="260" y="364" width="220" height="92" rx="8"/>
  <text x="370" y="388" text-anchor="middle" class="h">章</text>
  <text x="370" y="410" text-anchor="middle" class="s">标题在文件中间的补 id，</text>
  <text x="370" y="430" text-anchor="middle" class="s">目录改指到「文件#id」</text>

  <rect class="sec" x="500" y="364" width="220" height="92" rx="8"/>
  <text x="610" y="388" text-anchor="middle" class="h">节、章名只是数字</text>
  <text x="610" y="410" text-anchor="middle" class="s">挂在章下面一层；目录漏了的</text>
  <text x="610" y="430" text-anchor="middle" class="s">补 id、按阅读顺序补进去</text>

  <rect class="no" x="740" y="364" width="220" height="92" rx="8"/>
  <text x="850" y="388" text-anchor="middle" class="h">更深的</text>
  <text x="850" y="410" text-anchor="middle" class="s">不补进目录</text>

  <text x="490" y="494" text-anchor="middle" class="s">目录里没有的：章后面更深一级、不超过 40 字、不是「注：」开头的 &lt;hN&gt; 补成节；好读的「１」「２」节号段落补成节</text>
  <text x="490" y="518" text-anchor="middle" class="s">没有书自带目录、或六成以上的目录条目找不到标题时，退回按 &lt;h1&gt;–&lt;h6&gt; 级别判断（下一张图）</text>
  <text x="490" y="542" text-anchor="middle" class="s">原书的文件一个不拆、不并（2026-10-06 起不再分页）；只改目录和给标题补 id</text>
</svg>
