<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>章节分页：按标题把一个章节文件拆成多份</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .f{fill:#fff;stroke:#888;stroke-width:1.2}
      .pg{fill:#fff;stroke:#3f9a5b;stroke-width:1.4}
      .t{fill:#1d4fa8;font-weight:bold}
      .sec{fill:#8a4a00;font-weight:bold}
      .p{fill:#666;font-size:12px}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12px;fill:#444}
    </style>
  </defs>
  <rect width="940" height="430" fill="#fafafa"/>

  <text x="120" y="28" text-anchor="middle" class="h">原书：一个文件 ch01.xhtml</text>
  <rect class="f" x="30" y="40" width="180" height="300" rx="4"/>
  <text x="44" y="66" class="t">&lt;h1&gt;第一章 风起</text>
  <text x="44" y="90" class="p">引子正文……</text>
  <text x="44" y="108" class="p">……</text>
  <text x="44" y="136" class="sec">&lt;h2&gt;一、夜行</text>
  <text x="44" y="158" class="p">正文……¹</text>
  <text x="44" y="176" class="p">……</text>
  <text x="44" y="204" class="sec">&lt;h2&gt;二、渡口</text>
  <text x="44" y="226" class="p">正文……</text>
  <text x="44" y="244" class="p">……</text>
  <line x1="40" y1="266" x2="200" y2="266" stroke="#ccc" stroke-dasharray="3 3"/>
  <text x="44" y="288" class="p">注 1：……（章末注释）</text>

  <path d="M220 190 L278 190" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="249" y="180" text-anchor="middle" class="s">拆分</text>

  <text x="600" y="28" text-anchor="middle" class="h">拆开后：每个文件在所有阅读器里都从新的一页开始</text>

  <rect class="pg" x="290" y="40" width="140" height="170" rx="4"/>
  <text x="360" y="118" text-anchor="middle" class="t">第一章 风起</text>
  <text x="360" y="230" text-anchor="middle" class="s">ch01.xhtml</text>
  <text x="360" y="248" text-anchor="middle" class="s">章标题<tspan font-weight="bold">独立一页</tspan></text>

  <rect class="pg" x="445" y="40" width="140" height="170" rx="4"/>
  <text x="459" y="66" class="p">引子正文……</text>
  <text x="459" y="84" class="p">……</text>
  <text x="515" y="230" text-anchor="middle" class="s">ch01-1.xhtml</text>
  <text x="515" y="248" text-anchor="middle" class="s">章下正文另起一页</text>

  <rect class="pg" x="600" y="40" width="140" height="170" rx="4"/>
  <text x="614" y="66" class="sec">一、夜行</text>
  <text x="614" y="88" class="p">正文……¹</text>
  <text x="614" y="106" class="p">……</text>
  <line x1="610" y1="170" x2="730" y2="170" stroke="#ccc" stroke-dasharray="3 3"/>
  <text x="614" y="190" class="p" fill="#8a4a00">注 1：……</text>
  <text x="670" y="230" text-anchor="middle" class="s">ch01-2.xhtml</text>
  <text x="670" y="248" text-anchor="middle" class="s">节标题和正文<tspan font-weight="bold">同页</tspan></text>

  <rect class="pg" x="755" y="40" width="140" height="170" rx="4"/>
  <text x="769" y="66" class="sec">二、渡口</text>
  <text x="769" y="88" class="p">正文……</text>
  <text x="769" y="106" class="p">……</text>
  <text x="825" y="230" text-anchor="middle" class="s">ch01-3.xhtml</text>
  <text x="825" y="248" text-anchor="middle" class="s">节与节之间分页</text>

  <!-- 注释搬移 -->
  <path d="M110 296 C120 390 640 390 660 198" stroke="#c77a1a" stroke-width="1.3" fill="none" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="400" y="350" text-anchor="middle" class="s" fill="#8a4a00">注释块搬到引用它的那一份末尾（xochitl 只认同一文件内的 #锚点）</text>

  <text x="470" y="412" text-anchor="middle" class="s">同时：链接、目录（NCX/nav）、OPF 都改指新文件；目录缺节时把节按下一级补进去；不到 30 字的尾巴不单独成页</text>
</svg>
