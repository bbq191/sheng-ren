<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>Cargo workspace 各 crate 与依赖关系</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <style>
      .c{stroke-width:1.4;rx:8}
      .n{font-weight:bold;font-size:15px;font-family:monospace}
      .s{font-size:12px;fill:#444}
      .l{stroke:#555;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="860" height="400" fill="#fafafa"/>

  <rect class="c" x="300" y="20" width="260" height="70" fill="#fff6e5" stroke="#d69a2b"/>
  <text x="430" y="45" text-anchor="middle" class="n">library</text>
  <text x="430" y="64" text-anchor="middle" class="s">母版库 + booklib 命令</text>
  <text x="430" y="80" text-anchor="middle" class="s">入库 · 生成 · 指纹 · 去重</text>

  <rect class="c" x="80" y="140" width="240" height="70" fill="#eaf7ee" stroke="#3f9a5b"/>
  <text x="200" y="165" text-anchor="middle" class="n">azw3</text>
  <text x="200" y="184" text-anchor="middle" class="s">EPUB → AZW3（KF8）写出器</text>
  <text x="200" y="200" text-anchor="middle" class="s">bin: epub-to-azw3</text>

  <rect class="c" x="300" y="250" width="260" height="80" fill="#eef4ff" stroke="#5b7fd6"/>
  <text x="430" y="275" text-anchor="middle" class="n">bookconv</text>
  <text x="430" y="294" text-anchor="middle" class="s">内容层：转换 · 清洗 · 优化 · 图片 · 质量门</text>
  <text x="430" y="312" text-anchor="middle" class="s">bin: epub-optimize / cbz2pdf / readable-*</text>

  <rect class="c" x="600" y="140" width="200" height="60" fill="#f3eefa" stroke="#8a63c9"/>
  <text x="700" y="165" text-anchor="middle" class="n">profile</text>
  <text x="700" y="184" text-anchor="middle" class="s">设备参数（TOML 嵌入）</text>

  <rect class="c" x="80" y="300" width="180" height="60" fill="#fff" stroke="#888"/>
  <text x="170" y="325" text-anchor="middle" class="n">pdf-extract</text>
  <text x="170" y="344" text-anchor="middle" class="s">PDF 文字层（MIT fork）</text>

  <rect class="c" x="620" y="300" width="180" height="60" fill="#fff" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="710" y="325" text-anchor="middle" class="n" fill="#888">drm</text>
  <text x="710" y="344" text-anchor="middle" class="s">空壳（暂停，独立）</text>

  <path class="l" d="M360 90 L240 138" marker-end="url(#a)"/>
  <path class="l" d="M430 90 L430 248" marker-end="url(#a)"/>
  <path class="l" d="M500 90 L660 138" marker-end="url(#a)"/>
  <path class="l" d="M230 210 L350 248" marker-end="url(#a)"/>
  <path class="l" d="M530 250 L650 202" marker-end="url(#a)"/>
  <path class="l" d="M300 310 L262 322" marker-end="url(#a)"/>

  <text x="430" y="388" text-anchor="middle" class="s">箭头 = 依赖方向，单向无环</text>
</svg>
