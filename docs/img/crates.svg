<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>Cargo workspace 各 crate 与依赖关系</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <style>
      .c{stroke-width:1.4;rx:8}
      .n{font-weight:bold;font-size:15px;font-family:monospace}
      .s{font-size:12px;fill:#444}
      .l{stroke:#555;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="860" height="400" fill="#fafafa"/>

  <rect class="c" x="280" y="20" width="300" height="70" fill="#fff6e5" stroke="#d69a2b"/>
  <text x="430" y="45" text-anchor="middle" class="n">library</text>
  <text x="430" y="64" text-anchor="middle" class="s">书库 + booklib 命令</text>
  <text x="430" y="80" text-anchor="middle" class="s">入库 · 同步 · 按阅读模式生成 · 补元数据</text>

  <rect class="c" x="270" y="150" width="320" height="96" fill="#eef4ff" stroke="#5b7fd6"/>
  <text x="430" y="175" text-anchor="middle" class="n">bookconv</text>
  <text x="430" y="194" text-anchor="middle" class="s">CBZ/网页 → EPUB · 清洗 · 优化 · 图片 · 质量门</text>
  <text x="430" y="214" text-anchor="middle" class="s">bin: epub-optimize</text>
  <text x="430" y="232" text-anchor="middle" class="s">readable-probe / readable-measure</text>

  <rect class="c" x="330" y="300" width="200" height="60" fill="#f3eefa" stroke="#8a63c9"/>
  <text x="430" y="325" text-anchor="middle" class="n">profile</text>
  <text x="430" y="344" text-anchor="middle" class="s">阅读模式参数（TOML 嵌入）</text>

  <rect class="c" x="618" y="200" width="234" height="76" fill="#fdf0f3" stroke="#c9637d"/>
  <text x="735" y="223" text-anchor="middle" class="n">mobidict</text>
  <text x="735" y="242" text-anchor="middle" class="s">MOBI 词典 → StarDict（暂留）</text>
  <text x="735" y="262" text-anchor="middle" class="s">bin: mobi-dict-to-stardict</text>

  <rect class="c" x="640" y="306" width="180" height="60" fill="#fff" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="730" y="331" text-anchor="middle" class="n" fill="#888">drm</text>
  <text x="730" y="350" text-anchor="middle" class="s">空壳（暂停，独立）</text>

  <rect class="c" x="20" y="150" width="200" height="96" fill="#f0f7f7" stroke="#3c8f8f"/>
  <text x="120" y="172" text-anchor="middle" class="n">kfx</text>
  <text x="120" y="190" text-anchor="middle" class="s">EPUB → KFX 写出器（kindle 用）</text>
  <text x="120" y="207" text-anchor="middle" class="s">Ion 编解码 · KFX 容器读写</text>
  <text x="120" y="224" text-anchor="middle" class="s">bin: epub-to-kfx</text>
  <text x="120" y="240" text-anchor="middle" class="s">kfx-dump / kfx-repack</text>

  <path class="l" d="M430 90 L430 148" marker-end="url(#a)"/>
  <path class="l" d="M430 246 L430 298" marker-end="url(#a)"/>
  <path class="l" d="M300 90 C245 140 245 300 328 325" marker-end="url(#a)"/>
  <path class="l" d="M290 90 L170 148" marker-end="url(#a)"/>
  <path class="l" d="M220 205 L268 205" marker-end="url(#a)"/>
  <path class="l" d="M618 240 L592 232" marker-end="url(#a)"/>

  <text x="430" y="388" text-anchor="middle" class="s">箭头 = 依赖方向，单向无环（library 也直接用 profile、bookconv；kindle 走 kfx；AZW3 写出器 2026-10-09 删了）</text>
</svg>
