<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>Cargo workspace 各 crate 与依赖关系</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <style>
      .c{stroke-width:1.4;rx:8}
      .n{font-weight:bold;font-size:15px;font-family:monospace}
      .s{font-size:12px;fill:#444}
      .l{stroke:#555;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="860" height="400" fill="#fafafa"/>

  <rect class="c" x="280" y="20" width="300" height="70" fill="#fff6e5" stroke="#d69a2b"/>
  <text x="430" y="45" text-anchor="middle" class="n">library</text>
  <text x="430" y="64" text-anchor="middle" class="s">书库 + booklib 命令</text>
  <text x="430" y="80" text-anchor="middle" class="s">入库 · 同步 · 按阅读模式生成 · 补元数据</text>

  <rect class="c" x="270" y="150" width="320" height="96" fill="#eef4ff" stroke="#5b7fd6"/>
  <text x="430" y="175" text-anchor="middle" class="n">bookconv</text>
  <text x="430" y="194" text-anchor="middle" class="s">CBZ/网页 → EPUB · 清洗 · 优化 · 图片 · 质量门</text>
  <text x="430" y="214" text-anchor="middle" class="s">bin: epub-optimize</text>
  <text x="430" y="232" text-anchor="middle" class="s">readable-probe / readable-measure</text>

  <rect class="c" x="330" y="300" width="200" height="60" fill="#f3eefa" stroke="#8a63c9"/>
  <text x="430" y="325" text-anchor="middle" class="n">profile</text>
  <text x="430" y="344" text-anchor="middle" class="s">阅读模式参数（TOML 嵌入）</text>

  <rect class="c" x="630" y="40" width="210" height="96" fill="#eaf7ee" stroke="#3f9a5b"/>
  <text x="735" y="65" text-anchor="middle" class="n">azw3</text>
  <text x="735" y="84" text-anchor="middle" class="s">EPUB → AZW3（KF8 写出器）</text>
  <text x="735" y="102" text-anchor="middle" class="s">bin: epub-to-azw3</text>
  <text x="735" y="120" text-anchor="middle" class="s">azw3::read：KF8 读取器，回读自检</text>

  <rect class="c" x="640" y="300" width="180" height="60" fill="#fff" stroke="#bbb" stroke-dasharray="5 4"/>
  <text x="730" y="325" text-anchor="middle" class="n" fill="#888">drm</text>
  <text x="730" y="344" text-anchor="middle" class="s">空壳（暂停，独立）</text>

  <path class="l" d="M430 90 L430 148" marker-end="url(#a)"/>
  <path class="l" d="M430 246 L430 298" marker-end="url(#a)"/>
  <path class="l" d="M300 90 C200 140 200 300 328 325" marker-end="url(#a)"/>
  <path class="l" d="M580 70 L628 78" marker-end="url(#a)"/>
  <path class="l" d="M700 136 C690 170 640 190 592 195" marker-end="url(#a)"/>

  <text x="430" y="388" text-anchor="middle" class="s">箭头 = 依赖方向，单向无环（library 也直接用 profile、bookconv）</text>
</svg>
