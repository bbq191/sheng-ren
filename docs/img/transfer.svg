<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>传书路线：三个产物文件夹各拷到哪台设备的自带阅读器</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .fd{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.3}
      .r{fill:#f3eefa;stroke:#8a63c9;stroke-width:1.3}
      .n{fill:#fff6e5;stroke:#d69a2b;stroke-width:1.3}
      .h{font-weight:bold;font-size:15px}
      .s{font-size:12.5px;fill:#444}
      .m{font-family:monospace;font-size:12.5px;fill:#2a5c36}
      .l{stroke:#555;stroke-width:1.4;fill:none}
    </style>
  </defs>
  <rect width="1000" height="470" fill="#ffffff"/>

  <text x="110" y="30" text-anchor="middle" class="h">电脑上（书目录旁边）</text>
  <text x="770" y="30" text-anchor="middle" class="h">设备上的自带阅读器</text>

  <!-- 文件夹 -->
  <path class="fd" d="M20 82 h56 l10 -10 h40 l10 10 h64 v62 h-180 z"/>
  <text x="110" y="108" text-anchor="middle" class="h">kindle/</text>
  <text x="110" y="130" text-anchor="middle" class="s">KFX</text>

  <path class="fd" d="M20 202 h56 l10 -10 h40 l10 10 h64 v62 h-180 z"/>
  <text x="110" y="228" text-anchor="middle" class="h">ireader/</text>
  <text x="110" y="250" text-anchor="middle" class="s">EPUB</text>

  <path class="fd" d="M20 322 h56 l10 -10 h40 l10 10 h64 v62 h-180 z"/>
  <text x="110" y="348" text-anchor="middle" class="h">xochitl/</text>
  <text x="110" y="370" text-anchor="middle" class="s">EPUB（彩色）</text>

  <!-- 阅读器 -->
  <rect class="r" x="560" y="56" width="420" height="100" rx="8"/>
  <text x="576" y="80" class="h">Kindle 自带阅读器</text>
  <text x="576" y="104" class="s">USB（MTP，本机 jmtpfs 自动挂载）拷进 documents/</text>
  <text x="576" y="124" class="s">不认 EPUB；文字书流式、漫画固定版式</text>
  <text x="576" y="144" class="s">覆盖后：逐字节相同才保留进度，有任何不同就清零</text>

  <rect class="r" x="560" y="176" width="420" height="100" rx="8"/>
  <text x="576" y="200" class="h">掌阅自带阅读器</text>
  <text x="576" y="224" class="s">USB（MTP）连电脑导入</text>
  <text x="576" y="244" class="s">注释弹窗、漫画一律往左翻</text>
  <text x="576" y="264" class="s">覆盖后：字节变了进度也保留</text>

  <rect class="r" x="560" y="296" width="420" height="80" rx="8"/>
  <text x="576" y="320" class="h">Move 自带阅读器（xochitl）</text>
  <text x="576" y="344" class="s">网页上传 http://10.11.99.1/upload（单本约 88MB 以上被拒）</text>
  <text x="576" y="364" class="s">覆盖后进度：没测</text>

  <rect class="n" x="560" y="392" width="420" height="44" rx="8"/>
  <text x="576" y="412" class="s">漫画拷完再跑：</text>
  <text x="576" y="429" class="m">xochitl/comic-margins.sh --write</text>
  <path class="l" d="M770 376 L770 390" marker-end="url(#a)"/>

  <!-- 箭头 -->
  <path class="l" d="M200 113 C380 113 380 106 558 106" marker-end="url(#a)"/>
  <path class="l" d="M200 233 C380 233 380 226 558 226" marker-end="url(#a)"/>
  <path class="l" d="M200 353 C380 353 380 336 558 336" marker-end="url(#a)"/>

  <text x="20" y="460" class="s">重新生成后直接覆盖设备上的旧文件（文件名不变，除非书名变了）；三台都不装 KOReader。</text>
</svg>
