<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>漫画页在三台设备上的位置（按比例缩小 1/5）</title>
  <style>
    .scr{fill:#e9e9e9;stroke:#666;stroke-width:1.2}
    .rd{fill:#d9f0df;stroke:#3f9a5b;stroke-width:1.2;stroke-dasharray:4 3}
    .img{fill:#5b7fd6;fill-opacity:.35;stroke:#2f4f9e;stroke-width:1.2}
    .h{font-weight:bold;font-size:14px}
    .s{font-size:12px;fill:#444}
    .ok{font-size:12px;fill:#2f7a45;font-weight:bold}
    .no{font-size:12px;fill:#b2452d;font-weight:bold}
    .m{stroke:#b2452d;stroke-width:1.2}
  </style>
  <rect width="900" height="590" fill="#fafafa"/>
  <text x="450" y="24" text-anchor="middle" class="h">灰 = 屏幕　绿虚线 = 阅读范围（优化按它排）　蓝 = 漫画页（画布就是阅读范围，图保比放进"阅读范围 − 2×白边"）</text>

  <!-- ireader：1264x1680 -> 252.8x336，阅读范围 = 整屏；示意一张偏宽的页：左右 1px（受限），上下更多 -->
  <g transform="translate(30,50)">
    <rect class="scr" width="252.8" height="336" rx="6"/>
    <rect class="rd" width="252.8" height="336"/>
    <rect class="img" x="1" y="30" width="250.8" height="276"/>
    <text x="126.4" y="172" text-anchor="middle">左右各 1px</text>
    <text x="126.4" y="358" text-anchor="middle" class="h">ireader（掌阅）</text>
    <text x="126.4" y="376" text-anchor="middle" class="s">阅读范围 = 整屏 1264 × 1680</text>
    <text x="126.4" y="392" text-anchor="middle" class="s">comic_margin = 1 → 离屏幕 1px</text>
    <text x="126.4" y="410" text-anchor="middle" class="ok">✓ 做到了（还没重新上真机看）</text>
  </g>

  <!-- kindle：截图 1272x1696 -> 254.4x339.2；阅读范围 1104x1546 -> 220.8x309.2，左右 84→16.8，上下 75→15 -->
  <g transform="translate(320,50)">
    <rect class="scr" width="254.4" height="339.2" rx="6"/>
    <rect class="rd" x="16.8" y="15" width="220.8" height="309.2"/>
    <rect class="img" x="17" y="40" width="220.4" height="259"/>
    <line class="m" x1="0" y1="170" x2="16.8" y2="170"/>
    <text x="127.2" y="172" text-anchor="middle">离屏幕 85px</text>
    <text x="127.2" y="358" text-anchor="middle" class="h">kindle（Kindle 自带阅读器）</text>
    <text x="127.2" y="376" text-anchor="middle" class="s">阅读范围 1104 × 1546：阅读器自己</text>
    <text x="127.2" y="392" text-anchor="middle" class="s">留左右 84、上下 75，再加白边 1</text>
    <text x="127.2" y="410" text-anchor="middle" class="no">✗ 离屏幕 1px 还没做到（待查）</text>
  </g>

  <!-- xochitl：954x1696 -> 190.8x339.2；页边距 1 时图框 (1,112) 952x1457 -> x .2, y 22.4, 190.4x291.4 -->
  <g transform="translate(640,50)">
    <rect class="scr" width="190.8" height="339.2" rx="6"/>
    <rect class="rd" x="0.2" y="22.4" width="190.4" height="291.4"/>
    <rect class="img" x="0.2" y="22.4" width="190.4" height="291.4"/>
    <text x="95.4" y="16" text-anchor="middle" class="s">上 112px</text>
    <text x="95.4" y="172" text-anchor="middle">左右各 1px</text>
    <text x="95.4" y="332" text-anchor="middle" class="s">下 127px</text>
    <text x="95.4" y="358" text-anchor="middle" class="h">xochitl（Move）</text>
    <text x="95.4" y="376" text-anchor="middle" class="s">页边距设成 1 时 952 × 1457，</text>
    <text x="95.4" y="392" text-anchor="middle" class="s">画布里不留白边（comic_margin = 0）</text>
    <text x="95.4" y="410" text-anchor="middle" class="ok">✓ 左右 1px（上下是 xochitl 固定留的）</text>
  </g>

  <g class="s">
    <text x="30" y="500">· 图先裁白边，再保比缩放进框、居中；受限的那条边两侧正好是白边宽，另一条边两侧更多（不拉伸）。</text>
    <text x="30" y="522">· 黑白屏（kindle、ireader）转 256 级灰度、不抖动；xochitl 保留彩色。</text>
    <text x="30" y="544">· xochitl 的 1 档页边距界面上没有，拷书后用 xochitl/comic-margins.sh --write 登记（见"Move 上的漫画：登记页边距"）。</text>
    <text x="30" y="566">· 没登记的话还是默认页边距 56：图被缩到 842 宽，画面变小。</text>
  </g>
</svg>
