<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 972" width="960" height="972" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>安装与卸载流程</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555B66"/></marker>
    <style>
      .t{font-weight:600;fill:#1F2937}
      .tm{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace;font-weight:600;fill:#1F2937}
      .s{font-size:12px;fill:#4B5563}
      .sm{font-family:'Noto Sans Mono','DejaVu Sans Mono',monospace;font-size:11.5px;fill:#4B5563}
      .n{font-size:12px;fill:#6B7280}
    </style>
  </defs>
  <rect width="960" height="972" fill="#FCFCFD"/>
  <text x="250" y="32" text-anchor="middle" class="tm" font-size="15">./install.sh [--tools | --no-tools]</text>
  <text x="825" y="32" text-anchor="middle" class="tm" font-size="15">./uninstall.sh</text>
  <rect x="30" y="52" width="440" height="58" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="250.0" y="77.0" text-anchor="middle" class="t" font-size="14">先检查</text>
  <text x="250.0" y="95.0" text-anchor="middle" class="s">参数认得 · 有 cargo · 不是被 source · 不是 root 跑别人的仓库</text>
  <rect x="488" y="52.0" width="196" height="58" rx="8" fill="#FDEEEE" stroke="#D0534F" stroke-width="1.4"/>
  <text x="586.0" y="77.0" text-anchor="middle" class="t" font-size="13">不过：停下</text>
  <text x="586.0" y="95.0" text-anchor="middle" class="s">参数错退出 2，其它退出 1</text>
  <path d="M470 81.0 L486 81.0" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M250.0 110 L250.0 128" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="30" y="130" width="440" height="58" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="250.0" y="155.0" text-anchor="middle" class="t" font-size="14">安装目录能写吗</text>
  <text x="250.0" y="173.0" text-anchor="middle" class="s">bin 目录和记账文件所在的目录（还没建的看上级）</text>
  <rect x="488" y="130.0" width="196" height="58" rx="8" fill="#FDEEEE" stroke="#D0534F" stroke-width="1.4"/>
  <text x="586.0" y="155.0" text-anchor="middle" class="t" font-size="13">不能写：停下</text>
  <text x="586.0" y="173.0" text-anchor="middle" class="s">在编译之前；说是哪个目录</text>
  <path d="M470 159.0 L486 159.0" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M250.0 188 L250.0 206" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="30" y="208" width="440" height="58" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="250.0" y="233.0" text-anchor="middle" class="t" font-size="14">拿锁</text>
  <text x="250.0" y="251.0" text-anchor="middle" class="s">flock 锁住安装目录本身，不另留锁文件</text>
  <rect x="488" y="208.0" width="196" height="58" rx="8" fill="#FDEEEE" stroke="#D0534F" stroke-width="1.4"/>
  <text x="586.0" y="233.0" text-anchor="middle" class="t" font-size="13">另一个在跑：停下</text>
  <text x="586.0" y="251.0" text-anchor="middle" class="s">install / uninstall 同时只一个</text>
  <path d="M470 237.0 L486 237.0" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M250.0 266 L250.0 284" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="30" y="286" width="440" height="76" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="250.0" y="311.0" text-anchor="middle" class="t" font-size="14">定这次装哪些</text>
  <text x="250.0" y="329.0" text-anchor="middle" class="s">总是装 booklib；--tools 另装 epub-optimize 等</text>
  <text x="250.0" y="347.0" text-anchor="middle" class="s">都不加：装过开发工具就一起升级</text>
  <path d="M250.0 362 L250.0 380" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="30" y="382" width="440" height="58" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="250.0" y="407.0" text-anchor="middle" class="t" font-size="14">同名命令被别的包占着吗</text>
  <text x="250.0" y="425.0" text-anchor="middle" class="s">只认从本仓库路径装的；不用 --force 抢别人的</text>
  <rect x="488" y="382.0" width="196" height="58" rx="8" fill="#FDEEEE" stroke="#D0534F" stroke-width="1.4"/>
  <text x="586.0" y="407.0" text-anchor="middle" class="t" font-size="13">占着：停下</text>
  <text x="586.0" y="425.0" text-anchor="middle" class="s">告诉你是哪个包，退出 1</text>
  <path d="M470 411.0 L486 411.0" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M250.0 440 L250.0 458" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="30" y="460" width="440" height="76" rx="8" fill="#EEF3FF" stroke="#5B7FD6" stroke-width="1.4"/>
  <text x="250.0" y="485.0" text-anchor="middle" class="t" font-size="14">① 一次编译全部要装的命令</text>
  <text x="250.0" y="503.0" text-anchor="middle" class="sm">cargo build --release --locked -p … --bin …</text>
  <text x="250.0" y="521.0" text-anchor="middle" class="s">复用仓库的 target/，第一次要几分钟</text>
  <rect x="488" y="460.0" width="196" height="76" rx="8" fill="#FDEEEE" stroke="#D0534F" stroke-width="1.4"/>
  <text x="586.0" y="485.0" text-anchor="middle" class="t" font-size="13">编译失败：停下</text>
  <text x="586.0" y="503.0" text-anchor="middle" class="s">安装目录一点没动；</text>
  <text x="586.0" y="521.0" text-anchor="middle" class="s">为加锁新建的空目录删掉</text>
  <path d="M470 498.0 L486 498.0" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M250.0 536 L250.0 554" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="30" y="556" width="440" height="76" rx="8" fill="#EEF3FF" stroke="#5B7FD6" stroke-width="1.4"/>
  <text x="250.0" y="581.0" text-anchor="middle" class="t" font-size="14">② 留一份现状</text>
  <text x="250.0" y="599.0" text-anchor="middle" class="s">这次要装的命令文件、cargo 记账文件</text>
  <text x="250.0" y="617.0" text-anchor="middle" class="s">放 bin/.sheng-ren-install-backup，装完删掉</text>
  <path d="M250.0 632 L250.0 650" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="30" y="652" width="440" height="76" rx="8" fill="#EEF3FF" stroke="#5B7FD6" stroke-width="1.4"/>
  <text x="250.0" y="677.0" text-anchor="middle" class="t" font-size="14">③ 逐个包安装</text>
  <text x="250.0" y="695.0" text-anchor="middle" class="sm">cargo install --locked --path crates/&lt;包&gt;</text>
  <text x="250.0" y="713.0" text-anchor="middle" class="s">上一步编好了，这里只拷贝，约 1 秒</text>
  <rect x="488" y="652.0" width="196" height="76" rx="8" fill="#FDEEEE" stroke="#D0534F" stroke-width="1.4"/>
  <text x="586.0" y="677.0" text-anchor="middle" class="t" font-size="13">失败或 Ctrl-C：回滚</text>
  <text x="586.0" y="695.0" text-anchor="middle" class="s">命令、记账文件退回原样；</text>
  <text x="586.0" y="713.0" text-anchor="middle" class="s">新建的空目录删掉，退出 1</text>
  <path d="M470 690.0 L486 690.0" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M250.0 728 L250.0 746" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="30" y="748" width="440" height="58" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="250.0" y="773.0" text-anchor="middle" class="t" font-size="14">--no-tools：卸掉开发工具</text>
  <text x="250.0" y="791.0" text-anchor="middle" class="s">没装过就什么都不做</text>
  <path d="M250.0 806 L250.0 824" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="30" y="826" width="440" height="76" rx="8" fill="#EAF7EE" stroke="#3F9A5B" stroke-width="1.4"/>
  <text x="250.0" y="851.0" text-anchor="middle" class="t" font-size="14">✓ 装好（退出 0）</text>
  <text x="250.0" y="869.0" text-anchor="middle" class="s">核对 PATH 里先找到的 booklib 是不是刚装的那个</text>
  <text x="250.0" y="887.0" text-anchor="middle" class="s">不在 PATH 里就告诉你怎么加（fish 给 fish_add_path）</text>
  <rect x="712" y="52" width="228" height="58" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="826.0" y="77.0" text-anchor="middle" class="t" font-size="14">先检查</text>
  <text x="826.0" y="95.0" text-anchor="middle" class="s">同左：参数、cargo、source、root</text>
  <path d="M826.0 110 L826.0 128" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="712" y="130" width="228" height="58" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="826.0" y="155.0" text-anchor="middle" class="t" font-size="14">安装目录在吗</text>
  <text x="826.0" y="173.0" text-anchor="middle" class="s">不在＝什么都没装过</text>
  <rect x="712" y="212" width="228" height="58" rx="8" fill="#EAF7EE" stroke="#3F9A5B" stroke-width="1.4"/>
  <text x="826.0" y="237.0" text-anchor="middle" class="t" font-size="13">“没有找到”，退出 0</text>
  <text x="826.0" y="255.0" text-anchor="middle" class="s">不调 cargo，不建出目录</text>
  <path d="M742 188 L742 210" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="750" y="204" text-anchor="start" class="n">不在</text>
  <path d="M938 159 L952 159 L952 316 L826.0 316 L826.0 326" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="934" y="306" text-anchor="end" class="n">在</text>
  <rect x="712" y="328" width="228" height="58" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="826.0" y="353.0" text-anchor="middle" class="t" font-size="14">拿锁</text>
  <text x="826.0" y="371.0" text-anchor="middle" class="s">另一个在跑：停下，退出 1</text>
  <path d="M826.0 386 L826.0 404" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="712" y="406" width="228" height="58" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="826.0" y="431.0" text-anchor="middle" class="t" font-size="14">找本仓库装的包</text>
  <text x="826.0" y="449.0" text-anchor="middle" class="s">按仓库路径认（经符号链接装的也认）</text>
  <path d="M826.0 464 L826.0 482" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="712" y="484" width="228" height="58" rx="8" fill="#FFFFFF" stroke="#9AA3AF" stroke-width="1.4"/>
  <text x="826.0" y="509.0" text-anchor="middle" class="t" font-size="14">一次卸掉</text>
  <text x="826.0" y="527.0" text-anchor="middle" class="sm">cargo uninstall 包1 包2 …</text>
  <path d="M826.0 542 L826.0 560" fill="none" stroke="#555B66" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="712" y="562" width="228" height="94" rx="8" fill="#EAF7EE" stroke="#3F9A5B" stroke-width="1.4"/>
  <text x="826.0" y="587.0" text-anchor="middle" class="t" font-size="14">✓ 卸完（退出 0）</text>
  <text x="826.0" y="605.0" text-anchor="middle" class="s">别处装的同名命令：只提示，不删</text>
  <text x="826.0" y="623.0" text-anchor="middle" class="s">书库、设备上的书：一概不动</text>
  <text x="826.0" y="641.0" text-anchor="middle" class="s">只告诉你书库在哪</text>
  <text x="826.0" y="680" text-anchor="middle" class="n">重复运行无害</text>
  <text x="480" y="934" text-anchor="middle" class="n">装到哪：$CARGO_INSTALL_ROOT/bin ＞ cargo 配置的 install.root ＞ $CARGO_HOME/bin ＞ ~/.cargo/bin</text>
  <text x="480" y="954" text-anchor="middle" class="n">重复运行 = 升级；被 kill -9 打断的，再跑一次就装成完整的新版本（残留的备份自动清掉）</text>
</svg>
