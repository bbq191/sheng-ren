<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13">
  <title>Move 上的漫画怎么设成页边距 1</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .pc{fill:#eef4ff;stroke:#5b7fd6;stroke-width:1.2}
      .mv{fill:#fff6e5;stroke:#d69a2b;stroke-width:1.2}
      .you{fill:#eaf7ee;stroke:#3f9a5b;stroke-width:1.2}
      .h{font-weight:bold;font-size:14px}
      .s{font-size:12px;fill:#444}
      .l{stroke:#555;stroke-width:1.3;fill:none}
    </style>
  </defs>
  <rect width="900" height="410" fill="#fafafa"/>
  <text x="20" y="28" class="h">蓝 = 电脑上　橙 = Move 上　绿 = 你要做的</text>

  <rect class="pc" x="20" y="50" width="200" height="92" rx="8"/>
  <text x="120" y="72" text-anchor="middle" class="h">① booklib sync</text>
  <text x="120" y="92" text-anchor="middle" class="s">漫画按页边距 1 排（952 × 1457）</text>
  <text x="120" y="110" text-anchor="middle" class="s">书里写标记</text>
  <text x="120" y="128" text-anchor="middle" class="s">META-INF/eink-reader-margins = 1</text>
  <path class="l" d="M220 96 L250 96" marker-end="url(#a)"/>

  <rect class="mv" x="252" y="50" width="200" height="92" rx="8"/>
  <text x="352" y="72" text-anchor="middle" class="h">② 书架服务导入</text>
  <text x="352" y="92" text-anchor="middle" class="s">经 SSH 交给它，加进 xochitl；</text>
  <text x="352" y="110" text-anchor="middle" class="s">看到书里的标记就自动登记</text>
  <text x="352" y="128" text-anchor="middle" class="s">（大书走它的大文件通道）</text>
  <path class="l" d="M452 96 L482 96" marker-end="url(#a)"/>

  <rect class="mv" x="484" y="50" width="180" height="92" rx="8"/>
  <text x="574" y="72" text-anchor="middle" class="h">③ 登记队列</text>
  <text x="574" y="92" text-anchor="middle" class="s">书架服务的</text>
  <text x="574" y="110" text-anchor="middle" class="s">comic-margins.json</text>
  <text x="574" y="128" text-anchor="middle" class="s">（每本只登记一次）</text>
  <path class="l" d="M694 96 L666 96" marker-end="url(#a)"/>

  <rect class="you" x="696" y="50" width="184" height="92" rx="8" stroke-dasharray="5 4"/>
  <text x="788" y="72" text-anchor="middle" class="h">别的办法传上去的</text>
  <text x="788" y="92" text-anchor="middle" class="s">手工补登记：</text>
  <text x="788" y="110" text-anchor="middle" class="s">comic-margins.sh --write</text>
  <text x="788" y="128" text-anchor="middle" class="s">（不加 --write 只列出来）</text>
  <path class="l" d="M574 142 C574 170 700 160 720 186" marker-end="url(#a)"/>

  <rect class="you" x="640" y="188" width="240" height="92" rx="8"/>
  <text x="760" y="210" text-anchor="middle" class="h">④ 在 Move 上打开书</text>
  <text x="760" y="230" text-anchor="middle" class="s">第一次打开时生效</text>
  <path class="l" d="M640 234 L582 234" marker-end="url(#a)"/>

  <rect class="mv" x="300" y="188" width="280" height="92" rx="8"/>
  <text x="440" y="210" text-anchor="middle" class="h">⑤ 页边距代理（注入 xochitl）</text>
  <text x="440" y="230" text-anchor="middle" class="s">开书约 2 秒后查队列，调 xochitl 自己的</text>
  <text x="440" y="248" text-anchor="middle" class="s">setMargins(1)，然后销账</text>
  <text x="440" y="266" text-anchor="middle" class="s">（每本只设一次）</text>
  <path class="l" d="M300 234 L262 234" marker-end="url(#a)"/>

  <rect class="mv" x="20" y="188" width="240" height="92" rx="8"/>
  <text x="140" y="210" text-anchor="middle" class="h">⑥ xochitl 按页边距 1 重排</text>
  <text x="140" y="230" text-anchor="middle" class="s">整页图左右离屏幕 1px、</text>
  <text x="140" y="248" text-anchor="middle" class="s">上 112、下 127（固定留）</text>

  <g class="s">
    <text x="20" y="318">· 为什么这么绕：xochitl 界面上的页边距只有 28 / 56 / 112 三档；直接改书的 .content 会被运行中的 xochitl 用内存里的状态盖回去，只能让它自己设。</text>
    <text x="20" y="340">· 登记之后你在界面上把页边距改回去，不会再被设回来（每本只设一次）。</text>
    <text x="20" y="362">· sync 传的书由书架服务自动登记（2026-10-07 起）；手工脚本先检查连得上、代理装了、有 unzip，写队列前核对没被书架服务同时改过。</text>
    <text x="20" y="384">· 文字书不用登记：它们按默认页边距 56 排（842 × 1455）。</text>
  </g>
</svg>
