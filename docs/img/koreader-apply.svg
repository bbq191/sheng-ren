<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14">
  <title>koreader/apply.sh 的流程：取回 → 算新配置 → 预览 → 检查已退出 → 备份 → 写入并回读 → 失败回滚</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#888;stroke-width:1.2}
      .src{fill:#eef4ff;stroke:#5b7fd6}
      .lib{fill:#fff6e5;stroke:#d69a2b}
      .gen{fill:#eaf7ee;stroke:#3f9a5b}
      .dev{fill:#f3eefa;stroke:#8a63c9}
      .bad{fill:#fdecec;stroke:#c44}
      .h{font-weight:bold;font-size:15px}
      .s{font-size:12px;fill:#555}
      path.l{stroke:#555;stroke-width:1.4;fill:none}
      path.r{stroke:#c44;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="960" height="470" fill="#fafafa"/>

  <text x="480" y="28" text-anchor="middle" class="h">koreader/apply.sh &lt;设备&gt; [--restore | --uninstall] [--write]</text>

  <!-- 第一行：只读 -->
  <text x="20" y="62" class="s">不带 --write：只读，走到③为止</text>
  <rect class="box dev" x="20" y="72" width="190" height="96" rx="8"/>
  <text x="115" y="96" text-anchor="middle">① 连上设备</text>
  <text x="115" y="122" text-anchor="middle" class="s">掌阅、Kindle：USB（MTP，gio）</text>
  <text x="115" y="146" text-anchor="middle" class="s">取回四个配置文件和补丁</text>

  <rect class="box lib" x="250" y="72" width="340" height="96" rx="8"/>
  <text x="420" y="96" text-anchor="middle">② 在电脑上算出新配置</text>
  <text x="420" y="118" text-anchor="middle" class="s">应用：个人 → 方案（文字、漫画、进度同步）→ 设备 → 预设</text>
  <text x="420" y="136" text-anchor="middle" class="s">--restore 换成备份；--uninstall 撤掉方案层</text>
  <text x="420" y="154" text-anchor="middle" class="s">读设备文件失败（不是"没有"）就停，不拿空表覆盖</text>

  <rect class="box src" x="630" y="72" width="310" height="96" rx="8"/>
  <text x="785" y="96" text-anchor="middle">③ 列出净改动（dry run）</text>
  <text x="785" y="118" text-anchor="middle" class="s">只比原文件和最终结果（中间层改回来的不算）</text>
  <text x="785" y="136" text-anchor="middle" class="s">缺哪些字体、哪些补丁要拷 / 删</text>
  <text x="785" y="154" text-anchor="middle" class="s">没有改动就结束</text>

  <path class="l" d="M210 120 L248 120" marker-end="url(#a)"/>
  <path class="l" d="M590 120 L628 120" marker-end="url(#a)"/>

  <!-- 第二行：写入 -->
  <text x="20" y="226" class="s">带 --write</text>
  <path class="l" d="M785 168 L785 190 L115 190 L115 234" marker-end="url(#a)"/>

  <rect class="box dev" x="20" y="236" width="190" height="112" rx="8"/>
  <text x="115" y="260" text-anchor="middle">④ KOReader 退出了吗</text>
  <text x="115" y="286" text-anchor="middle" class="s">Kindle：crash.log 最后一次</text>
  <text x="115" y="304" text-anchor="middle" class="s">启动后有没有退出记录</text>
  <text x="115" y="328" text-anchor="middle" class="s">掌阅：问你（或 --closed）</text>

  <rect class="box lib" x="250" y="236" width="170" height="112" rx="8"/>
  <text x="335" y="260" text-anchor="middle">⑤ 备份</text>
  <text x="335" y="282" text-anchor="middle" class="s">要改的配置、要覆盖</text>
  <text x="335" y="298" text-anchor="middle" class="s">或删掉的补丁</text>
  <text x="335" y="320" text-anchor="middle" class="s">koreader-backup/</text>
  <text x="335" y="336" text-anchor="middle" class="s">&lt;时间&gt;/&lt;设备&gt;/</text>

  <rect class="box gen" x="460" y="236" width="300" height="112" rx="8"/>
  <text x="610" y="260" text-anchor="middle">⑥ 写入，每个文件写完就回读核对</text>
  <text x="610" y="284" text-anchor="middle" class="s">字体（按大小核对）→ 补丁 → 配置</text>
  <text x="610" y="308" text-anchor="middle" class="s">MTP 替换已有文件：先拷 .tmp 再换</text>
  <text x="610" y="332" text-anchor="middle" class="s">回读经 gio，不经 FUSE（有缓存）</text>

  <rect class="box gen" x="800" y="256" width="140" height="72" rx="8"/>
  <text x="870" y="286" text-anchor="middle">✓ 完成</text>
  <text x="870" y="308" text-anchor="middle" class="s">报告备份位置</text>

  <path class="l" d="M210 292 L248 292" marker-end="url(#a)"/>
  <path class="l" d="M420 292 L458 292" marker-end="url(#a)"/>
  <path class="l" d="M760 292 L798 292" marker-end="url(#a)"/>

  <!-- 失败分支 -->
  <rect class="box bad" x="20" y="384" width="190" height="56" rx="8"/>
  <text x="115" y="408" text-anchor="middle" fill="#a22">在运行：拒绝写</text>
  <text x="115" y="428" text-anchor="middle" class="s">它退出时会把设置写回去</text>
  <path class="r" d="M115 348 L115 382" marker-end="url(#a)"/>

  <rect class="box bad" x="460" y="384" width="480" height="56" rx="8"/>
  <text x="700" y="408" text-anchor="middle" fill="#a22">任何一个文件写入或回读失败：回滚</text>
  <text x="700" y="428" text-anchor="middle" class="s">已写的文件从备份还原，原来没有的删掉；还原不了的报出备份路径</text>
  <path class="r" d="M610 348 L610 382" marker-end="url(#a)"/>
</svg>
