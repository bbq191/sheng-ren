# host 端电子书书库与 EPUB 优化工具（见 README.md 与 docs/）。
# 依赖单向无环：library → azw3、kfx → bookconv → profile；mobidict → azw3、bookconv；drm 独立。
[workspace]
resolver = "2"
members = [
    "crates/bookconv",
    "crates/profile",
    "crates/drm",
    "crates/library",
    "crates/azw3",
    "crates/mobidict",
    "crates/kfx",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
