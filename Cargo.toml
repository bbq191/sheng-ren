# host 端电子书书库与 EPUB 优化工具（见 README.md 与 docs/）。
# 依赖单向无环：library → kfx → bookconv → csscascade → profile、bookbase。
[workspace]
resolver = "2"
members = [
    "crates/bookbase",
    "crates/bookconv",
    "crates/csscascade",
    "crates/profile",
    "crates/library",
    "crates/kfx",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
